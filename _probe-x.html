<!doctype html><html><head><meta charset="utf-8"><title>x</title></head><body style="margin:0;font:12px monospace">
<pre id="o">…</pre><div id="box"></div>
<script>
var out=[], left=3, RS=[1, 1.12, 1.25];
RS.forEach(function(ratio){
  var f=document.createElement('iframe');
  f.src='/preview/home-mobile-n3/'; f.style.cssText='width:390px;height:400px;border:0;position:absolute;left:-9999px';
  document.getElementById('box').appendChild(f);
  f.addEventListener('load',function(){
    var d=f.contentDocument;
    var st=d.createElement('style');
    /* 模擬比較寬的中文字型：把字距推開，等效於每個字變寬 */
    st.textContent='html,body{overflow:visible!important}'+
      (ratio>1 ? 'body,body *{letter-spacing:'+((ratio-1)).toFixed(3)+'em !important}' : '');
    d.head.appendChild(st);
    var seen=[];
    d.querySelectorAll('*').forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.right>391) seen.push('   '+Math.round(r.right)+'  <'+el.tagName.toLowerCase()+'> .'+(typeof el.className==='string'?el.className:'')+' | '+(el.textContent||'').trim().slice(0,20));
    });
    out.push('字寬 x'+ratio+'   docScrollW='+d.documentElement.scrollWidth+'\n'+(seen.slice(0,10).join('\n')||'   （沒有溢出）'));
    if(--left===0) document.getElementById('o').textContent=out.sort().join('\n\n');
  });
});
</script></body></html>
