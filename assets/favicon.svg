<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="芳仁牙醫診所">
  <!--
    幾何：診所標誌的嘴（一個節點都沒有改過）＋ 依自己中心放大 1.6 倍的牙洞。
    沒有底框，寬度撐滿方框。詳見 PALETTE.md 第六節。

    深淺兩版的牙洞位置「故意」不一樣：
      深色版 上移 1.05（原定稿）
      淺色版 上移 2.05（多補 1.00）
    抗鋸齒讓邊緣變成漸層，眼睛認定的邊界落在兩端顏色的 L* 中點 ——
    白底上是覆蓋率 0.650、深底上是 0.332。所以同一條路徑在白底會看起來比較細，
    實測感知差 0.35 到 0.55 px。使用者在五個上移量之間比對後選 2.05（多補 1.00），
    感知殘差 16px +0.14、32px +0.34、64px +1.10 —— 淺色略厚於深色，是使用者要的分寸。
    量測腳本與五個方案在 preview/logo-favicon-bridge/。「不要」把兩條路徑合成一條。

    顏色（2026-08-07 定案）：淺 #4f716e、深 #4b7a60。
  -->
  <style>
    .lt { fill: #4f716e }
    .dk { fill: #4b7a60 }
    @media (prefers-color-scheme: dark) {
      .lt { display: none }
      .dk { display: block }
    }
  </style>
