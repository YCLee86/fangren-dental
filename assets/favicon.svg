<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="芳仁牙醫診所">
  <!-- 診所的標誌本體。幾何是 2026-08-07 定稿的那一版（牙洞 1.6 倍、上移 1.05），
       和頁首那顆同一條路徑，只有牙洞比例不同 —— favicon 要在 16px 下還看得出洞。

       兩個顏色都是實測來的，不是隨手挑的（PALETTE.md 第六之七節）：
         淺色 #4f6361  診療椅實測色，白底分頁列 5.81:1
         深色 #4f8065  同色相 147°、同彩度 24%，只把亮度從 Y 0.11 提到 0.16
                       —— 深底分頁列 3.37:1，過非文字圖形的 3.0 下限還留餘裕，
                          而和淺色的色差 ΔE 只有 20.7，並排要盯著看才分得出來。

       fill 屬性留著當退路：不吃 <style> 的算圖器（少數 RSS 閱讀器、舊工具）
       會用屬性上的淺色，不會變成黑色方塊。 -->
  <style>
    path { fill: #4f6361; }
    @media (prefers-color-scheme: dark) { path { fill: #4f8065; } }
  </style>
