<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="芳仁牙醫診所">
  <!-- ===========================================================================
       主畫面圖示的**來源檔**。點陣版由 tools/app-icons.mjs 從這一份算出來：
         assets/icon-180.png            iOS「加入主畫面」（apple-touch-icon）
         assets/icon-192.png / -512.png  Android「加到主螢幕」（site.webmanifest）
         assets/icon-maskable-512.png   Android 會自己裁形狀的那一種

       ⚠ 這一顆和 assets/favicon.svg **不是同一件事，不要合併**：
         favicon.svg   分頁列。透明底、兩色（深淺分頁列各一）、牙洞放大 1.6 倍
         icon.svg      主畫面。**不透明底**、一色、牙洞維持原始比例

       兩個差異都是被平台逼出來的，不是風格選擇：
       ・**底非有不可。** iOS 會把帶透明的 apple-touch-icon 直接壓在純黑上，
         標誌是暗色的，壓完等於一塊黑方磚。PALETTE.md 第六之七節那句
         「不要用加個底色方塊來解」講的是**分頁列**那顆（它的底是透明的、
         而且真的可以透明）；主畫面這顆沒有「不要底」這個選項。
       ・**牙洞不放大。** favicon 的 1.6 倍是為了 16px 下那個洞不被抗鋸齒吃掉。
         這裡最小 180px，洞有 14px 寬，放大反而失真 —— 所以用原始比例。

       ---------------------------------------------------------------------------
       幾何：直接從診所的 AI 原始檔量出來的（2026-08-12）

       來源 `20241205_芳仁牙醫_LOGO_外框.ai` 第 3 頁、中間那個圓圈裡的標誌本體。
       比對過：**站上 index.html 頁首那條路徑就是這一條**，等比例縮 0.6454888747 倍，
       25 個節點的最大殘差 0.0022（在 44.29 寬的 viewBox 上，＝ 0.005%）——
       也就是說站上那顆本來就是原廠向量，不是誰描出來的。所以這裡沒有「換一個圖形」，
       只是把同一條路徑重新正規化成 1000 單位寬，省掉 index.html 那組偏移量。

       原始外框 68.6097 × 33.8115 pt，長寬比 **2.02918**（＝站上 viewBox 的比例）。
       貝茲曲線的極值有算進去，不是用控制點的框。

       ⚠ AI 檔裡的標誌是**空心的**（2.293pt 線框），站上用的是**把中線填實**那一版。
       這裡跟著站上走 —— 使用者要的是「網站上用的圖案」。

       ---------------------------------------------------------------------------
       顏色（兩顆都不是新的，都是站上已經在用的值）

         底 #ffffff   ＝ **純白**（2026-08-12 第五輪，使用者指定「要像 Google Maps 那樣亮」）
                        ⚠ 這裡刻意**不是** --paper `#e2e5e6`。原因是量出來的：
                        同一個資料夾裡，Google Maps 的白在螢幕上是 rgb(255,255,255)、
                        我們的紙色是 rgb(227,228,230) —— 兩者都**原封不動**通過了
                        iOS 的玻璃效果（那層效果只抬暗色、亮端完全不碰），
                        所以螢幕上就是實打實差 27 階亮度，並排看得很明顯。
                        底改純白之後和 Maps 同亮度，因為白進去就是白出來。
                        ⚠ 這是**圖示專用**的決定，站上的底色仍然是 --paper，不要跟著改。
         牙 #3f654a   ＝ 一般牙科的**套色**（＝〈定期檢查〉那一篇的重點色），
                        [data-spec="general"] 的 --accent，PALETTE 第六之十一節第七小節

       對比 5.23:1，遠高於非文字圖形的 3.0 下限。

       ⚠ 一般牙科有**兩階**，這裡取的是**套色**那一階，不是深階 #2c5238（對紙 6.99）。
         理由：深階是「白底上的**字**」用的，套色才是「填實的**塊**」用的 ——
         首頁的 chip 按下去就是 #3f654a 填滿站在紙色上，和這顆圖示是同一種用法。
         標誌是一塊填實的形狀，不是字。

       ⚠ 這一顆從 #4f6361（favicon 的診療椅綠、對紙 5.04）換過來是使用者指定的
         （2026-08-12：「紙色底，但用一般牙科 定期檢查的綠」）。
         份量幾乎一樣（5.04 → 5.23），換的是色相 —— 不要「順手」改回去和 favicon 一致，
         分頁列與主畫面本來就不必同色，理由見下面那段「兩個檔」的說明。
       要換配色改下面那兩個值就好，改完跑 `node tools/app-icons.mjs` 重算點陣版。

       ---------------------------------------------------------------------------
       大小：scale(.778) ＝ 標誌寬 778px、佔畫布 76.0%

       兩個平台的安全範圍不一樣，取小的那個還要留餘裕：
       ・iOS 把圖示裁成圓角方形（圓角約邊長的 22.4%）。標誌在垂直方向落在
         y 320~704，離上下角落的曲線區（229px）很遠，左右吃的是直邊，76% 沒問題。
       ・Android 的 maskable 安全區是**直徑 80% 的圓**。2.02918:1 的矩形要塞進
         直徑 819.2 的圓，寬度上限是 734.8px（71.8%）—— 76% 會超出。
         所以 maskable 那張由 tools/app-icons.mjs 把下面的 scale 換成 .696
         （696px、68.0%）再算一次。
         ⚠ 腳本比對的是**底下那個 g 的 transform 屬性整串**（含前面那段
           位移到畫布中心的 translate），不是單獨的倍率 ——
           這段註解裡就有一模一樣的倍率寫法，
           只找倍率會換到註解裡那一個，maskable 版會悄悄和一般版逐位元組相同
           （已經踩過一次）。改下面那一行的寫法要順手去改腳本，
           腳本有一道「只准命中一次」的檢查會擋住，不會無聲失敗。
       =========================================================================== -->
  <rect width="1024" height="1024" fill="#ffffff"/>
  <g transform="translate(512 512) scale(.778) translate(-500 -246.4045)">
    <!-- 一條路徑、evenodd：前半是外框，後半那一小圈是牙洞，靠 evenodd 挖空。 -->
    <path fill="#3f654a" fill-rule="evenodd" d="M 163.61 464.83 C 202.57 495.92 282.12 504.63 362.69 470.09 C 472.15 423.14 563.32 443.40 656.05 476.05 C 683.17 485.60 778.99 510.77 838.69 471.44 C 909.67 424.70 1068.03 207.71 967.52 72.13 C 883.84 -40.73 753.61 10.02 725.76 20.01 C 626.05 55.76 453.84 96.28 233.34 15.24 C 194.67 1.03 70.50 -27.61 16.73 72.13 C -41.16 179.53 61.76 383.56 163.61 464.83 Z M 706.37 413.48 C 711.98 411.85 714.13 411.43 719.61 413.48 C 723.29 414.85 728.28 414.61 731.91 413.48 C 743.77 409.80 755.46 386.42 753.32 356.68 C 751.18 326.94 674.63 331.08 674.69 356.68 C 674.74 377.08 682.06 403.35 692.12 410.48 C 696.46 413.56 699.67 415.44 706.37 413.48 Z"/>
  </g>
</svg>
