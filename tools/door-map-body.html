<!-- ==========================================================================
     門口的告示（A4 橫）。⚠⚠ 2026-08-23 用途整個換掉了：
     原本是「停車參考圖」，使用者說明實情之後改成**紅線提醒**——
     門口那一段劃了紅線，以前多半柔性勸導，前幾天警察到場直接開單。
     ⚠ 抬頭那塊「停車資訊 ＋ 診所名稱」與頁尾的地址電話**都拿掉了**
       （使用者指定）：這張紙貼在自家門口，看的人就站在門口，不必自我介紹。
     ⚠ 「車主在拖吊車來之前出現就不會被拖吊」**刻意不寫** ——
       那等於教人賭一把，而這張紙的目的正好相反。
     ========================================================================== -->
<div class="sheet">
  <!-- ⚠⚠ 抬頭（「門口這一段是紅線／最近有警察到現場直接開單」）2026-08-23
       由使用者拿掉 —— 這張紙就貼在那一段紅線旁邊，標題只是把四點提醒又講一次。
       樣式 .nt-head 還留在樣式表裡，要放回來把這一段補回去就好。 -->
  <div class="nt-main">
    <div class="sh-map">
<!--MAP-->
    </div>

    <div class="nt-side">
      <!-- ⚠ 三句的分工：① 事實對照（平常沒車 vs 是紅線）② 這幾天真的變了
           ③ 出路在哪。
           ⚠⚠ 第一句是**使用者逐字指定的**：「平常車不多，但門口是紅線」。
             我原本寫「看起來停一下沒關係」，被退回 —— 那是替他把僥倖的念頭
             講出來，等於幫他找了個理由。**只擺事實，不要替讀者配旁白。** -->
      <ul class="nt-points">
        <li>平常車不多，但<b>門口是紅線</b>。</li>
        <!-- ⚠ 「在門口」拿掉了：抬頭已經寫著門口，留著只會讓「門／口」被斷行拆開。 -->
        <li>以前多半是柔性勸導，前幾天已經有人<b>被直接開單</b>。</li>
        <!-- ⚠⚠ 「最近的停車場走一分鐘就到」2026-08-23 由使用者拿掉 ——
             最近的那一個（P3 斗六永樂站，50 公尺）**很不好進出**，
             列在清單裡是為了完整，不是要推薦它。
             ⚠ 底下清單的順序因此**刻意不是照距離排**（190／140／50），
             是使用者自己排的，P3 排在最後。**不要「順手」照距離重排。** -->
        <!-- ⚠ 這一條原本在停車場清單底下當小字，2026-08-23 使用者要求提上來
             當第四點 —— 路邊停車格對只停一下的人比停車場更有用。 -->
        <li>周邊路段另有畫設之路邊停車格。</li>
      </ul>

      <ul class="sh-lots">
        <li><span class="no">P1</span><span class="nm">壹車房－中華路停車場</span><span class="du">190 公尺・步行 3 分鐘</span></li>
        <li><span class="no">P2</span><span class="nm">合廷停車場</span><span class="du">140 公尺・步行 2 分鐘</span></li>
        <li><span class="no">P3</span><span class="nm">斗六永樂站停車場</span><span class="du">50 公尺・步行 1 分鐘</span></li>
      </ul>

      <p class="sh-note">停車計價方式依各業者現場標示為準。</p>

      <!-- ⚠ QR 指向 fangren.net 的「診所資訊」那一節：那裡有可以點的地圖，
           三個停車場各自連到 Google 地圖，掃一次三個都拿得到。
           **不要做成三顆小 QR** —— 量過右欄只有約 120mm 寬，
           三顆 20mm 的碼會把停車場名字擠到折行。
           ⚠ 碼是 tools/qr.mjs 產的向量 path（零依賴、印多大都不糊），
           由 door-map-preview.mjs 在產生的時候塞進來。 -->
      <div class="nt-qr"><!--QR--><span>掃這裡看地圖<br>與停車場位置</span></div>
      <!-- ⚠ 收尾那一句（「不用急，先把車停好　我們等你」）2026-08-23 由使用者
           拿掉：這是一張告示，不是一封信。 -->
    </div>
  </div>
</div>
