<!-- ==========================================================================
     門口的告示（A4 橫）。⚠⚠ 2026-08-23 用途整個換掉了：
     原本是「停車參考圖」，使用者說明實情之後改成**紅線提醒**——
     門口那一段劃了紅線，以前多半柔性勸導，前幾天警察到場直接開單。
     ⚠ 抬頭那塊「停車資訊 ＋ 診所名稱」與頁尾的地址電話**都拿掉了**
       （使用者指定）：這張紙貼在自家門口，看的人就站在門口，不必自我介紹。
     ⚠ 「車主在拖吊車來之前出現就不會被拖吊」**刻意不寫** ——
       那等於教人賭一把，而這張紙的目的正好相反。
     ========================================================================== -->
<div class="sheet">
  <!-- ⚠⚠ 抬頭（「門口這一段是紅線／最近有警察到現場直接開單」）2026-08-23
       由使用者拿掉 —— 這張紙就貼在那一段紅線旁邊，標題只是把四點提醒又講一次。
       樣式 .nt-head 還留在樣式表裡，要放回來把這一段補回去就好。 -->
  <div class="nt-main">
    <div class="sh-map">
<!--MAP-->
    </div>

    <div class="nt-side">
      <!-- ⚠ 三句的分工：① 事實對照（平常沒車 vs 是紅線）② 這幾天真的變了
           ③ 出路在哪。
           ⚠⚠ 第一句是**使用者逐字指定的**：「平常車不多，但門口是紅線」。
             我原本寫「看起來停一下沒關係」，被退回 —— 那是替他把僥倖的念頭
             講出來，等於幫他找了個理由。**只擺事實，不要替讀者配旁白。** -->
      <ul class="nt-points">
        <li>永樂街平常車不多，但診所門口被<b>劃設紅線</b>。</li>
        <!-- ⚠ 第二句 2026-08-23 使用者改成「近來常有直接開單情形」——
             原本寫「前幾天已經有人被直接開單」是**單一事件**，
             他要的是**現在的常態**。兩者的嚇阻力差很多，不要改回去。 -->
        <li>過往多為柔性勸導，近來常有<b>直接開單</b>情形。</li>
        <!-- ⚠⚠ 「最近的停車場走一分鐘就到」2026-08-23 由使用者拿掉 ——
             最近的那一個（P3 斗六永樂站，50 公尺）**很不好進出**，
             列在清單裡是為了完整，不是要推薦它。
             ⚠ 底下清單的順序因此**刻意不是照距離排**（190／140／50），
             是使用者自己排的，P3 排在最後。**不要「順手」照距離重排。** -->
        <!-- ⚠ 這一條原本在停車場清單底下當小字，2026-08-23 使用者要求提上來
             當第四點 —— 路邊停車格對只停一下的人比停車場更有用。 -->
        <li>周邊路段有畫設之路邊停車格，鄰近停車場可參考如下圖。</li>
        <!-- ⚠ 這一句原本是清單底下的小字，2026-08-23 使用者要求**和前三句同一個字級** ——
             所以直接變成第四點，不要只把 .sh-note 的 font-size 調大
             （那樣它還是「附註」的樣子，縮排與行距都對不上）。 -->
        <li>停車計價方式依各業者現場標示為準。</li>
      </ul>
    </div>
  </div>

  <!-- ⚠⚠ 三個停車場搬到底下這一條、橫跨整張紙 —— 使用者要的是
       **掃了直接開那一個停車場**，所以一場一顆 QR。
       ⚠ 一場一顆的風險是「相機對錯」：三顆碼擠在一起時，手機可能抓到旁邊那一顆。
         治法是**拉開距離**，不是把碼做小 —— 三張卡各佔紙寬的三分之一，
         碼與碼的中心相距約 90mm（碼本身 22mm），相機要退到很遠才會同時框到兩顆，
         而那時候正中間的仍然是想掃的那一顆。
         每顆碼自己還有四格的靜區 ＋ 一圈白底，邊界很清楚。
       ⚠ 順序（P1 190m／P2 140m／P3 50m）**刻意不是照距離排**，是使用者排的。 -->
  <div class="nt-lots">
    <div class="nt-lot">
      <div class="nt-code"><!--QR1--></div>
      <p class="nt-nm"><span class="no">P1</span>壹車房－中華路停車場</p>
      <p class="nt-du">190 公尺・步行 3 分鐘</p>
    </div>
    <div class="nt-lot">
      <div class="nt-code"><!--QR2--></div>
      <p class="nt-nm"><span class="no">P2</span>合廷停車場</p>
      <p class="nt-du">140 公尺・步行 2 分鐘</p>
    </div>
    <div class="nt-lot">
      <div class="nt-code"><!--QR3--></div>
      <p class="nt-nm"><span class="no">P3</span>斗六永樂站停車場</p>
      <p class="nt-du">50 公尺・步行 1 分鐘</p>
    </div>
  </div>
</div>
