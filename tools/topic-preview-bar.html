
<!-- =============================================================================
     提案用的樣式與切換條。定案時：把 .tp-* 搬進 index.html 的樣式表，
     這一整段（.pv-*、.tp-todo、以及症狀清單的顯示規則）一起刪掉。
     ⚠ class 一律 tp-／pv- 前綴 —— 這一頁是 index.html 的完整複本，
       站上有的 class 全部都在，短名字幾乎一定會撞（CLAUDE.md 第八節）。
     ============================================================================= -->
<style>
.tp-intro { margin: 1.4rem 0 0; max-width: 46rem; }
.tp-intro h1 { margin: 0 0 .55rem; font-size: clamp(1.5rem, 4.6vw, 2.05rem); line-height: 1.35; color: var(--ink); }
/* 三段處境是「他們」，用柔墨；底下那句回應是「我們」，用墨。
   ⚠ 靠深淺分出對話關係就夠了，**不要加項目符號** —— 一加就變回症狀清單的樣子。 */
.tp-case {
  margin: 0 0 .7rem; font-size: 1.0rem; line-height: 1.85; color: var(--ink-soft);
  padding-left: .85rem; border-left: 2px solid var(--rule);
}
.tp-stance { margin: 1.05rem 0 1.15rem; font-size: 1.02rem; line-height: 1.85; color: var(--ink); }
.tp-stance strong { color: var(--accent-deep); font-weight: 700; }

/* 「這些狀況該來看一下」。
   ⚠ **預設不顯示**（2026-08-18）——它讓人自我檢查，不是讓人覺得被理解，
     是健檢問卷的聲音不是陪伴的聲音。留成切換條的一格讓使用者自己決定。 */
html:not([data-shape="checks"]) .tp-checks { display: none; }
.tp-checks { margin: 0 0 1.15rem; }
.tp-checks-h { margin: 0 0 .5rem; font-weight: 700; color: var(--ink); }
.tp-checks ul { margin: 0; padding-left: 1.3rem; }
.tp-checks li { margin-bottom: .34rem; line-height: 1.85; }
.tp-checks strong { color: var(--ink); font-weight: 700; }

/* 「第一次來，大概是這樣」——拉力版，預設。
   ⚠ 刻意**不做成卡片**：加了框就變成一張表單／FAQ，讀起來是流程說明。
     這裡要的是把話接著講下去，所以就是接在開場後面的兩段。 */
.tp-first { margin: 0 0 1.15rem; }
.tp-first-h { margin: 0 0 .5rem; font-weight: 700; color: var(--ink); }
.tp-first p { margin: 0 0 .7rem; line-height: 1.85; color: var(--ink-soft); }
.tp-first p:last-child { margin-bottom: 0; }

/* 推力版的三題問答。**預設不顯示** —— 問題本身就是三個障礙（痛／時間／錢），
   答案再溫和，問句已經先把代價攤在讀者面前。留成切換條的一格給使用者比對。 */
html:not([data-after="qa"]) .tp-qa { display: none; }
html[data-after="qa"] .tp-first { display: none; }
.tp-qa {
  background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
  padding: 1.05rem 1.15rem; margin: 0 0 1rem;
}
.tp-qa dt { margin: .95rem 0 .28rem; font-weight: 700; color: var(--accent-deep); line-height: 1.65; }
.tp-qa dt:first-child { margin-top: 0; }
.tp-qa dd { margin: 0; color: var(--ink); line-height: 1.85; }

.tp-note {
  margin: 0 0 .4rem; font-size: .84rem; line-height: 1.8; color: var(--ink-soft);
  background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: .8rem .95rem;
}

/* 免責聲明搬到頁面最後（診所資訊之前）之後，它不在 .shell 裡了，要自己吃版心。 */
.tp-note.wrap-note { max-width: 46rem; margin: 0 auto 1.6rem; padding-inline: 1rem; }

/* 還沒問過使用者的待填格。**提案專用，正式站不會有這個樣子** */
.tp-todo {
  display: inline; background: rgba(175, 76, 82, .10);
  border-bottom: 1.5px dashed var(--brick); border-radius: 3px;
  padding: .05em .25em; color: var(--ink);
}
.tp-todo::before { content: "⚠ "; }

/* ⚠⚠ 拿掉 HERO 之後要自己讓開固定的頁首。
   `header.site-head` 是 position: fixed，首頁靠 HERO 佔位（而且 HERO 是**刻意**
   鑽到頁首底下的，那是設計的一部分）。著陸頁沒有 HERO，#topics 就從 y=0 開始，
   「主題與科別」那一列被蓋掉 14~42px（390／834／1440 實測）。
   ⚠ 一定要限定 `[data-topic]` —— 套到首頁會把 HERO 整個推下來。
   ⚠⚠ **不能只用 `var(--head-h)`** —— 手機（≤720）的頁首是
     `.site-head .shell { height: auto }`＋`padding-block: 3.736vw 3.1472vw`，
     高度由內容撐，和 `--head-h` 無關（390 上實際 61px，變數卻是 76px，高估 15px）。
     所以照這個 repo 既有的做法**開頁量一次寫進 CSS 變數**
     （`--lamp-pad`、`--ar-y` 都是這樣，CLAUDE.md 第九節第 9 條）。
     沒有 JS 時退回 `--head-h`：偏大一點但不會破圖。 */
body[data-topic] #main { padding-top: calc(var(--topic-pad, var(--head-h)) + 1.1rem); }

/* 搜尋框搬到「主題與科別」那一列、靠右（2026-08-18）。
   ⚠ 一定要限定 #topics —— .sec-head 是三個小節共用的元件。
   ⚠ 站上原本的 `.topic-search { flex: 0 1 15rem; min-width: 11rem }` 是給
     「和 chips 同一列」用的，搬上來之後 min-width 11rem 在 375 寬會把標題擠掉，
     所以這裡重新給一組。 */
#topics .sec-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: .8rem 1rem; flex-wrap: nowrap;
}
#topics .sec-head h2 { flex: 0 0 auto; }
#topics .sec-head .topic-search { flex: 0 1 15rem; min-width: 0; margin-top: 0; }

/* ---- 搜尋框的視覺重量（2026-08-18 三格待選）------------------------------
   使用者：「移上去了，但搜尋欄位很大，比例上會讓我覺得很搶眼、好像要去點。」
   ⚠ 這不只是大小，是**重量**：站上原本的樣式是 `background: var(--card)`
     ＝ #f4f4f5，比周圍的紙 #e2e5e6 **更亮**，等於往前站一階；再加一圈框，
     讀起來就是一顆等著被按的按鈕。它在這一頁是次要功能，不該搶。
   ⚠ 三格共同守住的兩件（都不准動）：
     ・框高 44px —— 觸控目標下限，不是造型。
     ・手機字級 16px —— 低於 16 的話 iOS Safari 一聚焦就把整頁放大。 */

/* Ⓐ 現況：卡色底 ＋ 框 ＋ 15rem */
html[data-search="a"] #topics .sec-head .topic-search { flex: 0 1 15rem; }

/* Ⓑ 淡：底色收成透明（讓它退回紙面）、框改用更淡的一階、收窄到 11rem */
html[data-search="b"] #topics .sec-head .topic-search { flex: 0 1 11rem; }
html[data-search="b"] #topics .topic-search input {
  background: transparent;
  border-color: color-mix(in srgb, var(--rule) 62%, var(--paper));
}
html[data-search="b"] #topics .topic-search input:hover,
html[data-search="b"] #topics .topic-search input:focus { border-color: var(--ink-soft); }

/* Ⓒ 只有一條底線：整個盒子拿掉，只留下緣那一條。44px 的高度留著（觸控） */
html[data-search="c"] #topics .sec-head .topic-search { flex: 0 1 10rem; }
html[data-search="c"] #topics .topic-search input {
  background: transparent; border-radius: 0;
  border: 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 72%, var(--paper));
  padding-inline: .15rem;
}
html[data-search="c"] #topics .topic-search input:hover,
html[data-search="c"] #topics .topic-search input:focus { border-bottom-color: var(--ink-soft); }

/* Ⓓ 框 ＋ 窄（2026-08-18 定案方向）：使用者看過三格之後
   ——「現在這個版本的寬度差不多，但我覺得用原來的框框版本就好」。
   ＝ Ⓒ 的寬度（10rem）配站上原本的框（卡色底 ＋ 一圈框），
   所以這一格**不覆寫任何顏色**，只給寬度 —— 框的樣式就是 index.html 裡那一份。
   收窄之後 390 上從 240px → 160px，重量自然就下來了。 */
html[data-search="d"] #topics .sec-head .topic-search { flex: 0 1 10rem; }

/* ---- 「幾篇文章、幾位醫師」放哪裡（2026-08-18 四格待選）------------------
   首頁上這個註記是 .filter-note：按下標記才出現、印「兒童牙科：3 篇文章、
   2 位醫師」。著陸頁沒有「按下去」這件事（標記是連結），所以它一直不會出現。
   ⚠ 科別名不必再印一次 —— 那已經是這一頁的 h1 了。
   ⚠ 0 的那一項整個不寫（矯正是 0 篇文章）。判斷在產生器裡，不是這裡。 */
.tp-count { margin: 0; }
html:not([data-count="b"]) .tp-count-b,
html:not([data-count="c"]) .tp-count-c,
html:not([data-count="d"]) .tp-count-d { display: none; }
.tp-count:empty { display: none !important; }
.tp-dot { margin: 0 .45em; color: var(--rule); }
.tp-count a { color: var(--accent-deep); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent-deep) 30%, transparent); }
.tp-count a:hover { border-bottom-color: var(--accent-deep); }

/* Ⓑ h1 底下當副標：最安靜，純文字不帶連結 */
.tp-count-b {
  margin: -.15rem 0 .75rem; font-size: .84rem; letter-spacing: .02em;
  color: var(--ink-soft);
}
/* Ⓒ 開場之後、內容之前：當往下的路標，所以兩個數字是錨點連結 */
.tp-count-c {
  margin: 0 0 1.15rem; padding-top: .95rem; font-size: .88rem;
  color: var(--ink-soft); border-top: 1px solid var(--rule);
}
.tp-count-c a { font-weight: 700; }
/* Ⓓ chips 正下方＝首頁 .filter-note 原本的位置 */
.tp-count-d { margin: .85rem 0 0; font-size: .82rem; color: var(--ink-soft); }

/* chips 從 button 換成 a：外觀沿用站上那一組規則，這裡只補連結本身的重置 */
.chips a { display: inline-block; text-decoration: none; }
.chips a[data-todo] { opacity: .45; pointer-events: none; }

/* ---- 切換條 ---- */
.pv-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
  background: rgba(244,244,245,.94); backdrop-filter: blur(8px) saturate(1.15);
  border-top: 1px solid var(--rule);
  padding: .55rem max(.7rem, env(safe-area-inset-left)) calc(.55rem + env(safe-area-inset-bottom));
  font-size: .8rem; color: var(--ink);
}
html.pv-closed .pv-bar { display: none; }
.pv-row { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; margin-bottom: .3rem; }
.pv-lab { color: var(--ink-soft); flex: 0 0 auto; font-size: .76rem; }
.pv-bar button {
  font: inherit; font-size: .78rem; cursor: pointer; padding: .3rem .6rem; border-radius: 7px;
  border: 1px solid var(--rule); background: #fff; color: var(--ink);
}
.pv-bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-fill); }
.pv-meter { font-size: .74rem; color: var(--ink-soft); line-height: 1.6; }
.pv-meter b { color: var(--ink); font-weight: 700; }
.pv-open {
  position: fixed; right: max(.7rem, env(safe-area-inset-right)); bottom: calc(.7rem + env(safe-area-inset-bottom));
  z-index: 91; font: inherit; font-size: .74rem; cursor: pointer; padding: .34rem .6rem; border-radius: 8px;
  border: 1px solid var(--rule); background: rgba(244,244,245,.94); color: var(--ink-soft); backdrop-filter: blur(8px);
}
html:not(.pv-closed) .pv-open { display: none; }
html:not(.pv-closed) body { padding-bottom: 7.5rem; }
</style>

<div class="pv-bar">
  <div class="pv-row">
    <span class="pv-lab">幾篇幾位</span>
    <button type="button" data-k="count" data-v="off">不放</button>
    <button type="button" data-k="count" data-v="b">h1 底下</button>
    <button type="button" data-k="count" data-v="c">開場之後</button>
    <button type="button" data-k="count" data-v="d">標記下方</button>
  </div>
  <div class="pv-row">
    <span class="pv-lab">搜尋框</span>
    <button type="button" data-k="search" data-v="a">現況</button>
    <button type="button" data-k="search" data-v="b">淡</button>
    <button type="button" data-k="search" data-v="c">只有底線</button>
    <button type="button" data-k="search" data-v="d">框＋窄</button>
  </div>
  <div class="pv-row">
    <span class="pv-lab">開場之後</span>
    <button type="button" data-k="after" data-v="first">第一次來（拉力）</button>
    <button type="button" data-k="after" data-v="qa">三題問答（推力）</button>
  </div>
  <div class="pv-row">
    <span class="pv-lab">開場的形狀</span>
    <button type="button" data-k="shape" data-v="new">短（預設）</button>
    <button type="button" data-k="shape" data-v="checks">＋症狀清單</button>
    <button type="button" id="pvclose" style="margin-left:auto">收起</button>
  </div>
  <div class="pv-meter" id="pvmeter">—</div>
</div>
<button type="button" class="pv-open" id="pvopen">切換條</button>

<script>
/* 著陸頁讓開固定頁首的量。量的是**未捲動那一態**（捲動後頁首會收合，
   那不是我們要讓開的高度），所以 scrollY 不在頂端時就不更新。 */
(function () {
  var hd = document.querySelector('header.site-head');
  if (!hd) return;
  function set() {
    if (scrollY > 4) return;
    document.documentElement.style.setProperty('--topic-pad', hd.getBoundingClientRect().height + 'px');
  }
  set();
  addEventListener('load', set);
  addEventListener('resize', set);
})();

(function () {
  var root = document.documentElement;
  if (!root.getAttribute('data-shape')) root.setAttribute('data-shape', 'new');
  if (!root.getAttribute('data-after')) root.setAttribute('data-after', 'first');
  if (!root.getAttribute('data-search')) root.setAttribute('data-search', 'd');
  if (!root.getAttribute('data-count')) root.setAttribute('data-count', 'c');
  var mc = /[?&]count=([a-z0-9]+)/.exec(location.search);
  if (mc && ['off', 'b', 'c', 'd'].indexOf(mc[1]) >= 0) root.setAttribute('data-count', mc[1]);
  var ms = /[?&]search=([a-z0-9]+)/.exec(location.search);
  if (ms && ['a', 'b', 'c', 'd'].indexOf(ms[1]) >= 0) root.setAttribute('data-search', ms[1]);
  var ma = /[?&]after=([a-z0-9]+)/.exec(location.search);
  if (ma && ['first', 'qa'].indexOf(ma[1]) >= 0) root.setAttribute('data-after', ma[1]);
  var m = /[?&]shape=([a-z0-9]+)/.exec(location.search);   /* 正規式要含數字，CLAUDE.md 第八節 */
  if (m && ['new', 'checks'].indexOf(m[1]) >= 0) root.setAttribute('data-shape', m[1]);

  /* 量的是「開場那一塊」自己，不是整頁 —— 使用者說的「字太多」指的就是它。
     屏數用 visualViewport（iOS 的 innerHeight 比看得到的高，第九節第 6 條）。 */
  function measure() {
    var box = document.querySelector('.tp-intro');
    var n = (box.innerText || '').replace(/\s/g, '').length;
    var vh = (window.visualViewport && visualViewport.height) || innerHeight;
    var screens = (box.getBoundingClientRect().height / vh).toFixed(1);
    var left = document.querySelectorAll('.tp-intro .tp-todo').length;
    document.getElementById('pvmeter').innerHTML =
      '開場 <b>' + n + '</b> 字　手機上 <b>' + screens + '</b> 屏　'
      + (screens <= 0.85 ? '不到一屏 ✓' : screens <= 1.25 ? '約一屏' : '⚠ 超過一屏')
      + '　待填 <b>' + left + '</b> 格';
  }
  function paint() {
    document.querySelectorAll('.pv-bar button[data-k]').forEach(function (b) {
      b.setAttribute('aria-pressed', root.getAttribute('data-' + b.dataset.k) === b.dataset.v);
    });
    measure();
  }
  document.querySelectorAll('.pv-bar button[data-k]').forEach(function (b) {
    b.addEventListener('click', function () {
      root.setAttribute('data-' + b.dataset.k, b.dataset.v);
      var p = new URLSearchParams(location.search); p.set(b.dataset.k, b.dataset.v);
      history.replaceState(null, '', location.pathname + '?' + p);
      paint();
    });
  });
  document.getElementById('pvclose').addEventListener('click', function () { root.classList.add('pv-closed'); });
  document.getElementById('pvopen').addEventListener('click', function () { root.classList.remove('pv-closed'); });
  paint(); addEventListener('load', measure);
})();
</script>
