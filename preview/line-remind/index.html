<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>看診前 48 小時提醒・提案（芳仁牙醫診所）</title>
<!--
  提案頁：LINE 官方帳號的「約診提醒」那一則（看診前 48 小時送出）。
  推導在 drafts/channels/README.md 第三、八、九、十四、十五、十九節。

  ⚠ 這一頁模擬的是**病人的畫面**，不是後台。
  ⚠⚠ 字級一律寫**固定 px**（channels/README 第 18-2 節）：LINE Flex 的 size 是固定 px
     （xxs 11／xs 13／sm 14／md 16／lg 19／xl 22／xxl 27），不是比例。
     寫成 rem 的話每一行都比 LINE 實際的小 1~2.7px，提案頁一旦和真實算繪對不上，
     上面做的每一個判斷都是假的。
     ⚠ 現況那一張也照同一張表畫 —— 它是廠商的卡，實際字級我們沒有量過，
       所以那是**近似**，不要拿它的 px 去下結論；要比的是結構、emoji 與紅字。
  ⚠ class 一律 pv- 前綴（撞名的教訓見 CLAUDE.md 第八節）。
  ⚠⚠ 這一頁是使用者 2026-09-04 指定要做的：「我們之後會做 48 小時提醒的頁面，
     在那邊會再確認版型與確認的按鈕，那邊做好後再回到這裡解決你們說的
     『不知道要確認什麼或跟誰確認』」——**所以那顆確認的按鈕在這一頁定**，
     定完再回頭看綁定完成那一則要不要多寫一句。
-->
<style>
:root{
  --paper:#e2e5e6; --card:#f4f4f5; --rule:#cdd0d2;
  --ink:#2a2c27; --ink-soft:#5c5f57; --green:#3f654a; --deep:#2c5238;
  --brick:#af4c52;
  /* LINE 那一側的顏色（別人的介面，不進 PALETTE.md） */
  --li-bg:#e9edf1; --li-in:#ffffff; --li-head:#ffffff; --li-meta:#8b96a1; --li-ink:#14181c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.7;padding-bottom:230px}
.pv-wrap{max-width:430px;margin:0 auto;padding:14px 14px 0}
h1{font-size:1rem;font-weight:700;letter-spacing:.02em}
.pv-sub{font-size:.78rem;color:var(--ink-soft);margin:.35rem 0 .9rem}
.pv-sub b{color:var(--ink)}
.pv-sub code,.pv-note code,.pv-panel code{font-size:.94em;overflow-wrap:anywhere}

/* ---- 手機外框 ＋ LINE 聊天室 ---------------------------------------- */
.pv-phone{border:1px solid var(--rule);border-radius:14px;overflow:hidden;
  background:var(--li-bg);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.pv-head{background:var(--li-head);display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-bottom:1px solid #e3e6ea}
.pv-head .b{font-size:.9rem;font-weight:700;color:var(--li-ink)}
.pv-head img{width:26px;height:26px;border-radius:50%;display:block}
.pv-head .x{margin-left:auto;color:var(--li-meta);font-size:1rem;letter-spacing:.14em}
.pv-chat{padding:12px 8px 16px;display:flex;flex-direction:column;gap:10px}
/* ⚠⚠ 圖卡在 LINE 上是**固定 268px**，這個框放不下的話，上面量到的每一個數字都是假的
   （bind-done 那一輪踩過：390 的螢幕只給了 243.4px，折行判斷全部偏鬆）。
   成因是我們比真手機多吃了兩層內距：頁面的 14 ＋ 聊天室的 11。
   所以窄螢幕讓手機框貼齊頁面兩邊、聊天室內距收到 8 —— 390 上還剩 300px 給卡片。
   ⚠ 320 以下仍然放不下，面板會現場報出來，不要當成沒事。 */
@media (max-width: 429px) {
  .pv-phone{margin-inline:-14px;border-radius:0;border-left-width:0;border-right-width:0}
}
.pv-day{align-self:center;background:rgba(0,0,0,.16);color:#fff;font-size:11px;
  padding:2px 11px;border-radius:11px}
.pv-msg{display:flex;gap:7px;align-items:flex-end;max-width:100%}
.pv-av{width:30px;height:30px;border-radius:50%;flex:none;display:block}
#pv-slot{min-width:0;flex:0 1 268px;max-width:268px}
.pv-t{font-size:11px;color:var(--li-meta);flex:none;padding-bottom:2px}

/* ---- 卡片外殼（兩案共用）：268px、圓角 14 ---------------------------- */
.pv-hc{width:100%;border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---- Ⓐ 現況：**從使用者 2026-09-04 提供的真截圖逐項量出來的** -------
   ⚠⚠ 那張截圖是**診所端的後台聊天室**（標題是病人的名字、底下有「使用手動聊天」
     與「預約傳送」、卡片下面有「已讀」），**不是病人的手機**。
     所以**那裡的卡片寬度 348px 不能拿來當病人看到的寬度** —— 這一頁仍然照 268px 畫。
   ⚠ 但**字級可以拿**：Flex 的字級是固定 px，跟卡片多寬無關。
   量到的（375 CSS px 的螢幕、3× 截圖，逐像素解出來）：
     卡片 348 × 約 560px、左右內距 22px
     標題列 高 43.7px、白字 19px、置中
     病人姓名 22px；「提醒您，您的看診時間將至」等內文與清單 16px
       （「請問您是否前往看診呢？」11 個全形字 ＝ 176.0px，16 整除）
     日期 22px 粗體
     「⚠ 就診須知 ⚠」**靠右**（中心 245.3，而版心中心是 174）—— 不是置中
     紅字置中 16px；綠色藥丸鈕 高 60px、左右比文字內距各外擴 14.5px
     「不克前往，預約改期」19px 置中
   ⚠ 顏色是從截圖描的（橄欖綠 #7c8a63、紅字 #d0021b），**不是站上的色** ——
     刻意不寫進 PALETTE.md，也不要拿去別的地方用。
   ⚠⚠ 這一頁把它畫在 **268px** 上（病人那一側的寬度），所以它會比截圖裡**更高、
     折更多行** —— 那是預測不是量測，面板上的高度要這樣讀。 */
.pv-old{background:#fff;color:#333}
.pv-old .h{background:#7c8a63;color:#fff;font-weight:700;text-align:center;
  padding:9px 8px;font-size:19px;line-height:1.35}
.pv-old .b{padding:18px 22px 18px;font-size:16px;line-height:1.7}
.pv-old .who{color:#555}
.pv-old .who .nm{font-size:22px;color:#333}
.pv-old .dt{font-weight:700;color:#111;font-size:22px;line-height:1.4;margin:10px 0 0}
.pv-old hr{border:0;border-top:1px solid #e0e0e0;margin:10px 0}
/* ⚠ 靠右不是置中 —— 量出來中心偏右 71px。 */
.pv-old .nh{text-align:right;font-weight:700;color:#333;margin-bottom:11px;font-size:19px}
.pv-old ol{margin:0 0 0 1.4em;padding:0;line-height:1.75}
.pv-old ol li{margin:9px 0}
.pv-old .red{color:#d0021b;font-weight:700;text-align:center;margin:10px 0 8px}
/* 藥丸鈕比文字內距**再往外**：量到左右各離卡片邊 7.5px，而內距是 22 → 外擴 14.5 */
.pv-old .btn{background:#7c8a63;color:#fff;font-weight:700;text-align:center;
  padding:16px;border-radius:30px;font-size:19px;line-height:1.4;margin:0 -14px}
.pv-old .sub{color:#7c8a63;text-align:center;font-size:19px;padding-top:12px}

/* ---- Ⓑ 新版：和招呼圖卡／綁定完成同一套（卡 268、內距 14）------------
   顏色一顆都沒新增，全部回 PALETTE.md 拿：
     卡 #f4f4f5・墨 #2a2c27・柔墨 #5c5f57・線 #cdd0d2・綠 #3f654a・深階 #2c5238
     紙灰方塊＝--paper 直接鋪
     警示方塊＝磚紅 #af4c52 濃度 .09（＝綁定完成那一則已定案的那一塊）
     改約方塊＝矯正那支套色 #4478b5 濃度 .10（同上，2026-09-04 使用者挑的）
   ⚠⚠ 兩塊淡底的濃度**不要自己調** —— .10 是反解出來的（要和 .09 的磚紅
     合成後亮度相同）。細節見 bind-done 那一頁與 channels/README 第 19-18 節。 */
.pv-new{background:var(--card)}
/* 頭圖：Flex 的 hero，size:full ＋ aspectRatio 2:1 ＝ 卡片滿寬、高度是寬的一半。
   ⚠⚠ **圖還沒畫，這裡先把位置預留出來**（使用者 2026-09-04：「先預留圖卡的位置」）。
     虛線那一塊就是 1024×512 會佔掉的地方 —— 實測 134px，佔整張卡的兩成。
   ⚠ 佔位符的字用 CSS 的 content 產生，**不是文字節點** —— 不然它會被算進行數、
     孤字判斷與紅線掃描裡（同 card-more-button 那一輪「繼續讀」那三個字的理由）。
   ⚠ 真的接上圖之後，width/height 屬性一定要寫（＋ aspect-ratio）：不寫的話圖還沒
     下載完高度是 0，面板會報出一個比實際矮 134px 的卡片。 */
.pv-new .hero{display:block;width:100%;aspect-ratio:2/1;background:var(--paper);
  border-bottom:1px solid var(--rule)}
.pv-new .hero.ph{display:flex;align-items:center;justify-content:center;
  outline:1px dashed var(--rule);outline-offset:-9px}
.pv-new .hero.ph::before{content:"頭圖　1024 × 512（還沒畫）";font-size:12px;
  color:var(--ink-soft);letter-spacing:.04em}
.pv-new .top{display:flex;align-items:center;gap:8px;padding:11px 14px 10px;
  border-bottom:1px solid var(--rule)}
.pv-new .top img{width:20px;height:20px;border-radius:50%;display:block}
.pv-new .top b{font-size:14px;font-weight:400;color:var(--ink-soft);letter-spacing:.06em}
.pv-new .b{padding:14px}
/* 開場：使用者 2026-09-04 自己寫的「哈囉　病人名字　提醒2天後有約要看牙齒喔」。
   ⚠⚠⚠ 拆成兩行，是為了讓**變數那一行從行首開始，而且在行尾結束** ——
     〔病人姓名〕是系統填的（{{patient}}），名字幾個字我們不知道。
     他寫的那一句名字夾在中間，整句放同一行的話，名字一長就把「喔」擠成孤字。
     拆開之後第一行只有「哈囉　〔名字〕」，**8 個字的名字都還在寬度內**。
   ⚠ 用字一個都沒改，只是換行。 */
.pv-new .hi{font-size:16px;line-height:1.6;color:var(--ink)}
.pv-new .hi b{font-weight:700}
.pv-new .lead{font-size:14px;line-height:1.7;color:var(--ink-soft);margin-top:2px;
  white-space:pre-line}
/* ⚠⚠ 日期仍然是這張卡最大的那一個（xl 22）—— 上面那句寫著「2天後」，
     但真正要記住的是哪一天幾點。
   ⚠ 現況寫「2026/07/06 (一) 20:00」，這裡只動兩件：拿掉年份、月日改中文。
     **括號維持廠商現在的半形**（全形一組多吃約 19px，而且要求的改動愈小愈可能改到）。 */
.pv-new .dt{font-size:22px;line-height:1.45;font-weight:700;color:var(--ink);
  letter-spacing:.01em;margin-top:6px}
.pv-new .box{border-radius:8px;padding:10px 12px;margin-top:12px;
  font-size:14px;line-height:1.75;white-space:pre-line}
.pv-new .box.know{background:var(--paper);color:var(--ink-soft)}
.pv-new .box.warn{background:rgba(175,76,82,.09);color:var(--li-ink);font-weight:700}
.pv-new .box.say{background:rgba(68,120,181,.10);color:var(--ink)}
.pv-new .warnline{font-size:14px;line-height:1.75;color:var(--ink-soft);
  margin-top:12px;white-space:pre-line}
/* ⚠⚠ 主鈕要放 logo，而 **LINE Flex 的 `button` 只有 label、不支援圖示**
   （第十一之二節）—— 所以和招呼圖卡那兩顆一樣，做成**可點的 box**
   （box 掛 action，裡面 image ＋ text）。代價是失去按鈕內建的按壓效果。
   ⚠ logo 用招呼卡已經產好的 `mark-white.png`（白色、34px 寬），
     **不要另外再產一份** —— 由 `node drafts/channels/mark-png.mjs` 維護。
   ⚠ 34px 是招呼卡 2026-09-03 定案的寬度，這一顆照抄。 */
.pv-new .btn{display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:9px;padding:12px;margin-top:14px;background:var(--green);color:#fff;
  line-height:1.4}
.pv-new .btn img{flex:none;display:block;width:34px}
.pv-new .btn span{font-size:16px;font-weight:700;letter-spacing:.02em}
/* ---- 「點下去」的三件事（2026-09-04 深夜第四輪）------------------------
   使用者：「好像少了要病患點下去的感覺，原來的版本有說點擊回覆，按鈕上也有手勢提示」。
   ⚠⚠ 拆開來是**三個各自獨立的量**（同第九節第 17 條那個淡出：一句話講到三件事）：
     ① 有沒有一句話**開口叫他點**（現況有，我們拿掉了）
     ② 按鈕上有沒有「往前走」的記號（現況是 👉）
     ③ 按鈕**看起來像不像按鈕**（現況是藥丸，我們是圓角方框）
   修一個不會治好另外兩個，所以切換條上是三條尺。 */
.pv-new .cta{font-size:14px;line-height:1.7;color:var(--ink-soft);text-align:center;
  margin-top:14px}
/* 現況那一句：紅字、粗體、上下各一個箭頭。⚠ 對照用，站上不會這樣寫 */
.pv-new .cta.asis{color:#d0021b;font-weight:700}
/* 角形＝站上「往下滑／回到最上面」那顆轉成朝右，由 remind-marks.mjs 產。
   ⚠ 高度跟著**字**走不是跟著標誌走（站上那一族是字高的 .58~.7）：
     16px 的字配 11px 高，長寬比 0.4828 算出 5.3px 寬。 */
.pv-new .btn .chev,
.pv-new .nob .chev,
.pv-new .tel .chev{flex:none;display:block;width:5.3px;height:11px;margin-left:-2px}
/* 主鈕的三種形狀。⚠⚠ `real` 那一格是**真的 Flex button** —— 它有 LINE 內建的
   按壓效果，但 **button 只有一個 label、放不了圖示**（第十一之二節），
   所以那一格的 logo 一定會消失。這是取捨不是漏做。 */
.pv-new .btn.pill{border-radius:30px;padding:16px 12px}
.pv-new .btn.real{border-radius:9px;padding:14px 12px}
.pv-new .btn.real img{display:none}
/* 「掰掰不去囉」：2026-09-04 使用者指定**加 logo**（shape_r2c3 嘴巴倒過來）
   ＋ 字改成他自己寫的「掰掰不去囉」（原本是我擬的「我不能到」）。
   ⚠ 它是次要動作，和主鈕**對等**會把「請你確認」這件事稀釋掉 —— 所以做成
     **線框鈕**（同一個框、同一顆 logo，但底是空的），不是第二顆實心的綠鈕。
   ⚠⚠ logo 是 `mark-nogo.png`：`brand/shapes/shape-r2c3.svg` **整個上下翻**
     （繞它自己 bbox 的中線），由 `node drafts/channels/remind-marks.mjs` 產。
     **牙洞不必另外調** —— 整張翻過去，洞跟著翻到右葉的下半，仍然被包在形狀裡；
     只翻外框、把洞留在原位的話，洞會落在形狀外面、在 fill-rule: evenodd
     底下**靜靜地消失而且不報錯**（那一版試過，見 README 第 20-12 節）。
   ⚠ 34px 寬（＝主鈕那顆的寬度）→ 長寬比 3.081 算出高 11.0px。 */
.pv-new .nob{display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--deep);border-radius:9px;padding:11px 6px;margin-top:8px;
  color:var(--deep);font-size:16px;font-weight:700;line-height:1.4}
.pv-new .nob img{flex:none;display:block;width:34px}
.pv-new .nob.plain{display:block;text-align:center;border:0;padding:11px 6px 0;
  margin-top:0;font-size:14px;font-weight:500}
.pv-new .nob.plain img{display:none}
/* 「突然有事想改時間，請致電診所」＋ 電話鈕（2026-09-04 使用者指定新增）。
   ⚠ 那一句原本寫「臨時有事須改約」，同一天稍晚由使用者改成「突然有事想改時間」——
     「須」是規定的口氣、「改約」是診所的行話；他這一版是**病人自己會講的話**。
   ⚠⚠ 這**不違反** 09-04 那條「診所電話不要做成按鈕」—— 那一條禁的是
     「說明句裡的號碼穿按鈕的衣服」；這裡上面那一句就是**叫他現在打電話**，
     是真的行動呼籲，號碼是那個動作本身。
   ⚠ 話筒取的是 **index.html 頁尾那一顆**（Font Awesome solid），不另外畫；
     16.8px 寬 ＝ 和主鈕那顆標誌**同高**（34 ÷ 2.029 ＝ 16.8）。 */
.pv-new .telnote{font-size:14px;line-height:1.7;color:var(--ink-soft);margin-top:14px}
.pv-new .tel{display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--deep);border-radius:9px;padding:11px 6px;margin-top:8px;
  color:var(--deep);font-size:16px;font-weight:700;line-height:1.4;
  letter-spacing:.02em;font-variant-numeric:tabular-nums}
.pv-new .tel img{flex:none;display:block;width:16.8px}
/* 量名字那一行用的探針（真名 3 個字時多寬）—— 不佔位、不影響版面 */
.pv-probe{position:absolute;left:-9999px;top:0;font-size:14px;line-height:1.7;
  white-space:nowrap;font-weight:400}

/* ---- 量測面板 -------------------------------------------------------- */
.pv-cap{font-size:.74rem;color:var(--ink-soft);margin:9px 2px 0}
.pv-panel{margin:12px 0 0;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);padding:9px 11px;font-size:.73rem;line-height:1.85;
  color:var(--ink-soft)}
.pv-panel b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.pv-panel .ok{color:var(--deep);font-weight:700}
.pv-panel .no{color:#a33;font-weight:700}
.pv-panel hr{border:0;border-top:1px solid var(--rule);margin:7px 0}
.pv-note{font-size:.73rem;color:var(--ink-soft);margin:12px 0 0;
  border-left:3px solid var(--rule);padding-left:10px}
.pv-note b{color:var(--ink)}
.pv-h2{font-size:1rem;font-weight:700;margin:30px 0 0;letter-spacing:.01em}
.pv-h2 + .pv-sub{margin-top:6px}

/* ---- 切換條 ---------------------------------------------------------- */
.pv-bar{position:fixed;left:0;right:0;bottom:0;z-index:9;
  background:rgba(244,244,245,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--rule);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
.pv-bar .r{display:flex;gap:6px;align-items:center;overflow-x:auto;
  scrollbar-width:none;padding-bottom:2px}
.pv-bar .r::-webkit-scrollbar{display:none}
.pv-bar .lb{font-size:.66rem;color:var(--ink-soft);flex:none;width:3.6em}

<script>
(function () {
  "use strict";

  /* ⚠⚠ 斷行一律用 \n 自己指定，不要交給自動換行（line-auto-reply/README 第 24-3 節）。
     這張卡的可用寬度：卡片 268 − 內距 28 ＝ **240px**；淡底方塊裡再扣 24 ＝ **216px**。
     換算成全形字：sm 14 → 卡上 17 個／方塊裡 15 個；md 16 → 15 個；xs 13 → 18 個。
     ⚠ 半形字算一半 —— 「24」「2」「05-5339369」都是半形，不能用「數幾個字元」代替量測。

     ⚠⚠⚠ 但**有變數的那一行不能手動斷行**：〔病人姓名〕是系統填的（{{patient}}），
       名字幾個字我們不知道，硬斷會在別人身上斷錯地方。那一行只能交給自動換行，
       面板會現場量「真名 3 個字時多寬」給你看。 */

  var TEL = "05-5339369";

  /* ---- 現況（照截圖，姓名已遮）------------------------------------- */
  var OLD = {
    name: "Ⓐ 現況",
    note: "廠商系統現在送出的那一張。<b>2026-09-04 你給了真截圖，這一份是逐像素量出來重做的</b>"

      + "<hr>六件問題在 channels/README 第 9-1 節：<b>飽和的橄欖綠滿版標題列</b>、"
      + "<b>⚠ 就診須知 ⚠</b>（把戴口罩講成警報）、<b>紅字＋↓↓ 箭頭</b>、"
      + "<b>「點此 👉 確定會到！」</b>（emoji ＋ 驚嘆號 ＋「點此」三重用力）、"
      + "<b>編號清單＋『』引號</b>（公文體）、以及<b>資訊層級亂</b> —— "
      + "日期雖然大，卻被上下的雜訊淹沒。"
      + "<br>⚠⚠ 截圖還量到<b>第七件</b>，之前沒發現：那一行「⚠ 就診須知 ⚠」"
      + "<b>是靠右的，不是置中</b>（中心 245.3，而版心中心是 174）—— "

      + "（一個叫他打電話、一個叫他按按鈕）。"

  /* ---- 新版 ----------------------------------------------------------

  /* ⚠ 就診須知那兩條是**臨床內容，要醫師點頭才能改**（channels/README 第 9-4 節）。

       與攜帶『健保卡』」，他只寫「攜帶健保卡」）—— 那是刪減不是漏字，但**口罩是
       感控**，要醫師點頭。面板底下有提醒。
     ⚠ 照站上慣例補的兩處：頓號（他用空格隔開「發燒 咳嗽 呼吸道症狀」）、句號。 */
  var KNOW = {
    two:  { name: "兩條", text: "請攜帶健保卡。\n如有發燒、咳嗽、呼吸道症狀，\n請多休息並來電改約。" },
    one:  { name: "只留健保卡", text: "請攜帶健保卡。" },
    none: { name: "不放", text: "" }
  };
  /* 24 小時那一段：2026-09-04 使用者整理綁定完成那一則時帶進來的新事實。
     ⚠⚠ 而它其實**是這張卡的事** —— 計時是從這一則送出的那一刻開始算的。 */
  var WARN = {
    box:  { name: "淡底方塊" },
    line: { name: "一般句" },
    none: { name: "不寫" }
  };
  var WARN_TEXT = "請按下面的按鈕回覆。\n若24小時內無回應，\n系統將自動取消約診，\n以遞補他人的候診需求。";
  /* ⚠⚠⚠ 「不克前往」那一顆要不要留 —— 這是使用者 2026-09-04 要我們分析的那一題。
       完整的分析寫在頁面底下那段說明，這裡只放結論：**建議留，但維持文字鈕**。
       三格：文字鈕（建議）／拿掉／做成實心的第二顆。 */
  var NOB = {
    line: { name: "線框鈕" },
    text: { name: "只有字" },
    drop: { name: "拿掉" }
  };
  /* 頭圖：使用者 2026-09-04「還是做個圖卡吧　比較趣味　先預留圖卡的位置」。
     ⚠ 圖還沒畫，先留位置（虛線那一塊 ＝ 1024×512 會佔掉的高度）。
     ⚠⚠ 有頭圖時**卡片頂端那一行診所名就拿掉**（同綁定完成那一張：頭圖自己就是識別）；
       切到「不放圖」時它會回來，識別不會整個消失。 */
  var HERO = { y: { name: "預留位置" }, n: { name: "不放圖" } };

  /* ---- 「點下去的感覺」三條尺（2026-09-04 深夜第四輪）------------------
     ① 叫他點的那一句。⚠ 文字是**我擬的**，這張卡其餘每一個字都是你寫的，
        這一句你要換就換（現況那句是廠商的，放在最後一格只當對照）。 */
  var CTA = {
    none: { name: "不放", text: "" },
    a:    { name: "請點下面的按鈕回覆", text: "請點下面的按鈕回覆" },
    b:    { name: "點一下…讓我們知道喔", text: "點一下下面的按鈕，讓我們知道喔" },
    asis: { name: "現況那句", text: "\u2193 請點擊下方按鈕，回覆是否前往看診 \u2193" }
  };
  /* ② 按鈕上的「往前走」記號。角形＝站上那顆轉成朝右（remind-marks.mjs 產）。
     ⚠ `hand` 那一格是現況的 👉，**對照用** —— 站上全站 0 個 emoji，面板會標出來。 */
  var CHEV = {
    none: { name: "不放" },
    main: { name: "只有主鈕" },
    all:  { name: "三顆都放" },
    hand: { name: "主鈕用 👉" }
  };
  /* ③ 主鈕的形狀。⚠⚠ `real` ＝ 真的 Flex button：有 LINE 內建的按壓效果，
     但 **button 放不了圖示**，所以 logo 會消失（第十一之二節）。 */
  var SHAPE = {
    box:  { name: "圓角方框" },
    pill: { name: "藥丸" },
    real: { name: "真的按鈕（沒 logo）" }
  };

  /* ⚠⚠ 預設 wa="none"、nb="line"：2026-09-04 使用者指定「粉紅底整個拿掉」、
     「藍灰底整個拿掉」、取消鈕加 logo。24 小時那一段的尺**留著**（它是他自己
     帶進來的事實，要放回去按一下就有），但預設不出現。 */
  /* ⚠ 預設就開在**我建議的那一組**（叫他點的那一句 ＋ 主鈕的角形，形狀不動）——
     要看回上一版你點頭的樣子，把「叫他點的那句」切到「不放」、角形切到「不放」。 */
  var v = "new", nb = "line", wa = "none", kn = "two", hr = "y",
      cta = "b", cv = "main", sh = "box";

  /* 網址參數（⚠ 正規式一定要寫 [a-z0-9]+，寫 [a-z]+ 會吃不到帶數字的值） */
  (function () {
    var q = location.search;
    function pick(k, set, def) {
      var m = q.match(new RegExp("[?&]" + k + "=([a-z0-9]+)"));
      return m && set[m[1]] ? m[1] : def;
    }
    v  = (q.match(/[?&]v=(old|new)/) || [])[1] || v;
    nb = pick("n", NOB, nb); wa = pick("w", WARN, wa);
    kn = pick("k", KNOW, kn); hr = pick("h", HERO, hr);
    cta = pick("c", CTA, cta); cv = pick("g", CHEV, cv); sh = pick("s", SHAPE, sh);
  })();

  /* 電話那一行在 Flex 裡**不會**自動變成可以撥的（純文字訊息才會）——
     所以這裡不畫成連結的樣子，畫成它真正的長相：一行字。見底下的說明。 */

  function oldHtml() {
    return '<div class="pv-hc pv-old" id="pv-body">'
      + '<div class="h">斗六芳仁牙醫診所</div>'
      + '<div class="b">'
      + '<div class="who"><span class="nm">〔病人姓名〕</span> 提醒您，您的看診時間將至 '
      + '請問您是否前往看診呢？</div>'
      + '<div class="dt">2026/07/06 (一) 20:00</div><hr>'
      + '<div class="nh">\u26a0\ufe0f 就診須知 \u26a0\ufe0f</div>'
      + '<ol><li>進入醫療場所者請戴『口罩』與攜帶『健保卡』</li>'
      + '<li>有發燒/咳嗽/呼吸道症狀等，請來電改約</li></ol><hr>'
      + '<div class="red">↓ 請點擊下方按鈕，回覆是否前往看診 ↓</div>'
      + '<div class="btn">點此 👉 確定會到！</div>'
      + '<div class="sub">不克前往，預約改期</div>'
      + '</div></div>';
  }

  /* 新版的順序（三段，2026-09-04 使用者第二輪定的）：
       ① 這一次是什麼　開場 ＋ 日期 ＋ 就診須知

       ③ 來不了怎麼辦　突然有事想改時間，請致電診所 ＋ 電話鈕

       **使用者指定整個拿掉**，換成上面這兩行。**那不是漏掉** ——
       改約期限（看診日前 2 天、不含假日）本來就該住在**綁定完成**那一則：

       他做不到的條件。「這裡沒有專人即時回覆訊息」也一起消失了，那是取捨，
       面板底下有記。 */
  function newHtml() {
    var h = '<div class="pv-hc pv-new" id="pv-body">'
      + (hr === "y"
          ? '<div class="hero ph"></div>'
          : '<div class="top"><img src="../../assets/icon-192.png" alt=""><b>芳仁牙醫診所</b></div>')
      + '<div class="b">'
      /* ⚠ 名字加粗（Flex 就是一個 span 加 weight: bold，顏色不動）——
           一個帳號收得到好幾個家人的提醒，「這一次是誰」要一眼看到。 */
      + '<p class="hi">哈囉　<b>〔病人姓名〕</b></p>'
      + '<p class="lead" id="pv-lead">提醒2天後有約要看牙齒喔</p>'
      + '<p class="dt">7月6日 (一) 20:00</p>';
    if (kn !== "none") h += '<p class="box know">' + KNOW[kn].text + '</p>';
    if (wa === "box")  h += '<p class="box warn">' + WARN_TEXT + '</p>';
    if (wa === "line") h += '<p class="warnline">' + WARN_TEXT + '</p>';
    /* ① 叫他點的那一句，排在主鈕正上方 */
    if (cta !== "none")
      h += '<p class="cta' + (cta === "asis" ? " asis" : "") + '">' + CTA[cta].text + '</p>';
    /* 主鈕：可點的 box（Flex 的 button 放不了 logo），白色標誌 ＋「ok 沒問題」。
       ⚠ `real` 那一格是真的 button，logo 由 CSS 藏起來（Flex 那邊是根本放不進去）。 */
    var wc = '<img class="chev" src="mark-chev-white.png" alt="">';
    var dc = '<img class="chev" src="mark-chev-deep.png" alt="">';
    h += '<span class="btn' + (sh === "box" ? "" : " " + sh) + '">'
      +  '<img src="../line-welcome/mark-white.png" alt="">'
      +  '<span>ok 沒問題' + (cv === "hand" ? " \ud83d\udc49" : "") + '</span>'
      +  (cv === "main" || cv === "all" ? wc : "") + '</span>';
    if (nb !== "drop") {
      h += '<span class="nob' + (nb === "text" ? " plain" : "") + '">'
        +  '<img src="mark-nogo.png" alt=""><span>掰掰不去囉</span>'
        +  (cv === "all" ? dc : "") + '</span>';
    }
    /* 「突然有事想改時間，請致電診所」＋ 電話鈕（2026-09-04 使用者指定）——
       ⚠ 這一句和上面那顆按鈕**不是二選一**，是兩件事接在一起：
         按鈕 ＝ 告訴我們你不會來；電話 ＝ 重新約時間。 */
    h += '<p class="telnote">突然有事想改時間，請致電診所</p>'
      +  '<span class="tel"><img src="mark-tel.png" alt=""><span>' + TEL + '</span>'
      +  (cv === "all" ? dc : "") + '</span>';
    return h + '</div></div>';
  }

  /* 這張卡現在給了幾個「可以點」的線索。⚠ 這是**這一輪的判準**：
     使用者說「少了要點下去的感覺」，那就要數得出來現在有幾個、加了之後有幾個。 */
  function cues() {
    var a = [];
    if (cta !== "none") a.push("叫他點的那一句");
    /* ⚠⚠ 主鈕切到「真的按鈕」時，**圖示一個都放不進去** —— logo 與角形一起消失
       （Flex 的 button 只有一個文字標籤）。所以那時 ② 這條尺對主鈕是無效的。 */
    if (cv === "hand") a.push("👉");
    else if (cv === "main") a.push(sh === "real" ? "主鈕的角形（⚠ 真的按鈕放不進去）"
                                                : "主鈕的角形");
    else if (cv === "all") a.push(sh === "real" ? "另外兩顆的角形（⚠ 主鈕放不進去）"
                                                : "三顆的角形");
    if (sh === "pill") a.push("藥丸鈕");
    if (sh === "real") a.push("真的 button（有按壓效果）");
    return a;
  }

  /* ---- 量測 ---------------------------------------------------------- */
  /* 逐字量 top 分組 —— 這樣才知道**實際**折成幾行、末行剩幾個字。
     ⚠ 不能只數 \n：手動斷好的一行如果太長，瀏覽器還是會再折一次，
       而那一折出來的末行就是孤字。要量的正是這件事。 */
  function lines(el) {
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), tns = [], n;
