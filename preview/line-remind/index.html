<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>看診前 48 小時提醒・提案（芳仁牙醫診所）</title>
<!--
  提案頁：LINE 官方帳號的「約診提醒」那一則（看診前 48 小時送出）。
  推導在 drafts/channels/README.md 第三、八、九、十四、十五、十九節。

  ⚠ 這一頁模擬的是**病人的畫面**，不是後台。
  ⚠⚠ 字級一律寫**固定 px**（channels/README 第 18-2 節）：LINE Flex 的 size 是固定 px
     （xxs 11／xs 13／sm 14／md 16／lg 19／xl 22／xxl 27），不是比例。
     寫成 rem 的話每一行都比 LINE 實際的小 1~2.7px，提案頁一旦和真實算繪對不上，
     上面做的每一個判斷都是假的。
     ⚠ 現況那一張也照同一張表畫 —— 它是廠商的卡，實際字級我們沒有量過，
       所以那是**近似**，不要拿它的 px 去下結論；要比的是結構、emoji 與紅字。
  ⚠ class 一律 pv- 前綴（撞名的教訓見 CLAUDE.md 第八節）。
  ⚠⚠ 這一頁是使用者 2026-09-04 指定要做的：「我們之後會做 48 小時提醒的頁面，
     在那邊會再確認版型與確認的按鈕，那邊做好後再回到這裡解決你們說的
     『不知道要確認什麼或跟誰確認』」——**所以那顆確認的按鈕在這一頁定**，
     定完再回頭看綁定完成那一則要不要多寫一句。
-->
<style>
:root{
  --paper:#e2e5e6; --card:#f4f4f5; --rule:#cdd0d2;
  --ink:#2a2c27; --ink-soft:#5c5f57; --green:#3f654a; --deep:#2c5238;
  --brick:#af4c52;
  /* LINE 那一側的顏色（別人的介面，不進 PALETTE.md） */
  --li-bg:#e9edf1; --li-in:#ffffff; --li-head:#ffffff; --li-meta:#8b96a1; --li-ink:#14181c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.7;padding-bottom:230px}
.pv-wrap{max-width:430px;margin:0 auto;padding:14px 14px 0}
h1{font-size:1rem;font-weight:700;letter-spacing:.02em}
.pv-sub{font-size:.78rem;color:var(--ink-soft);margin:.35rem 0 .9rem}
.pv-sub b{color:var(--ink)}
.pv-sub code,.pv-note code,.pv-panel code{font-size:.94em;overflow-wrap:anywhere}

/* ---- 手機外框 ＋ LINE 聊天室 ---------------------------------------- */
.pv-phone{border:1px solid var(--rule);border-radius:14px;overflow:hidden;
  background:var(--li-bg);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.pv-head{background:var(--li-head);display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-bottom:1px solid #e3e6ea}
.pv-head .b{font-size:.9rem;font-weight:700;color:var(--li-ink)}
.pv-head img{width:26px;height:26px;border-radius:50%;display:block}
.pv-head .x{margin-left:auto;color:var(--li-meta);font-size:1rem;letter-spacing:.14em}
.pv-chat{padding:12px 8px 16px;display:flex;flex-direction:column;gap:10px}
/* ⚠⚠ 圖卡在 LINE 上是**固定 268px**，這個框放不下的話，上面量到的每一個數字都是假的
   （bind-done 那一輪踩過：390 的螢幕只給了 243.4px，折行判斷全部偏鬆）。
   成因是我們比真手機多吃了兩層內距：頁面的 14 ＋ 聊天室的 11。
   所以窄螢幕讓手機框貼齊頁面兩邊、聊天室內距收到 8 —— 390 上還剩 300px 給卡片。
   ⚠ 320 以下仍然放不下，面板會現場報出來，不要當成沒事。 */
@media (max-width: 429px) {
  .pv-phone{margin-inline:-14px;border-radius:0;border-left-width:0;border-right-width:0}
}
.pv-day{align-self:center;background:rgba(0,0,0,.16);color:#fff;font-size:11px;
  padding:2px 11px;border-radius:11px}
.pv-msg{display:flex;gap:7px;align-items:flex-end;max-width:100%}
.pv-av{width:30px;height:30px;border-radius:50%;flex:none;display:block}
#pv-slot{min-width:0;flex:0 1 268px;max-width:268px}
.pv-t{font-size:11px;color:var(--li-meta);flex:none;padding-bottom:2px}

/* ---- 卡片外殼（兩案共用）：268px、圓角 14 ---------------------------- */
.pv-hc{width:100%;border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---- Ⓐ 現況：照使用者提供的截圖重做 ---------------------------------
   ⚠ 顏色是從截圖描的（橄欖綠標題列、紅字），**不是站上的色** ——
     它們刻意不寫進 PALETTE.md，也不要拿去別的地方用。 */
.pv-old{background:#fff;color:#333}
.pv-old .h{background:#7c8a63;color:#fff;font-weight:700;text-align:center;
  padding:10px 8px;font-size:16px;line-height:1.5}
.pv-old .b{padding:12px 13px 14px;font-size:14px;line-height:1.7}
.pv-old .who{color:#555}
.pv-old .dt{font-weight:700;color:#111;font-size:19px;margin:8px 0 10px}
.pv-old hr{border:0;border-top:1px solid #e0e0e0;margin:10px 0}
.pv-old .nh{text-align:center;font-weight:700;color:#333;margin-bottom:5px;font-size:14px}
.pv-old ol{margin:0 0 0 1.25em;padding:0;font-size:13px;line-height:1.75}
.pv-old ol li{margin:3px 0}
.pv-old .red{color:#d0021b;font-weight:700;text-align:center;margin:11px 0 9px;font-size:13px}
.pv-old .btn{background:#7c8a63;color:#fff;font-weight:700;text-align:center;
  padding:11px;border-radius:22px;font-size:16px}
.pv-old .sub{color:#7c8a63;text-align:center;font-size:14px;padding-top:10px}

/* ---- Ⓑ 新版：和招呼圖卡／綁定完成同一套（卡 268、內距 14）------------
   顏色一顆都沒新增，全部回 PALETTE.md 拿：
     卡 #f4f4f5・墨 #2a2c27・柔墨 #5c5f57・線 #cdd0d2・綠 #3f654a・深階 #2c5238
     紙灰方塊＝--paper 直接鋪
     警示方塊＝磚紅 #af4c52 濃度 .09（＝綁定完成那一則已定案的那一塊）
     改約方塊＝矯正那支套色 #4478b5 濃度 .10（同上，2026-09-04 使用者挑的）
   ⚠⚠ 兩塊淡底的濃度**不要自己調** —— .10 是反解出來的（要和 .09 的磚紅
     合成後亮度相同）。細節見 bind-done 那一頁與 channels/README 第 19-18 節。 */
.pv-new{background:var(--card)}
.pv-new .top{display:flex;align-items:center;gap:8px;padding:11px 14px 10px;
  border-bottom:1px solid var(--rule)}
.pv-new .top img{width:20px;height:20px;border-radius:50%;display:block}
.pv-new .top b{font-size:14px;font-weight:400;color:var(--ink-soft);letter-spacing:.06em}
.pv-new .b{padding:14px}
.pv-new .lead{font-size:14px;line-height:1.7;color:var(--ink-soft);white-space:pre-line}
/* ⚠⚠⚠ 「提醒您，」單獨一行，是為了讓**變數那一行從行首開始**。
   〔病人姓名〕是系統填的（{{patient}}），名字幾個字我們不知道 —— 兩件事接在同一行的話，
   名字一長就會把句尾擠成孤字（放佔位符時實測折出一個「了」）。
   拆開之後那一行只剩「〔名字〕的看診時間快到了」，面板量到**名字 8 個字以內都不會折**。
   ⚠ 它不是版面的裝飾，是**變數欄位的防呆**：這一行不能手動斷行，只能給它足夠的餘裕。 */
.pv-new .lead.nm{margin-top:1px}
/* ⚠⚠ 日期是這張卡唯一非讀不可的東西，所以它是最大的那一個（xl 22）。
   ⚠ 現況寫的是「2026/07/14 (二) 19:15」，這裡只動兩件：
     ①**年份拿掉** —— 提醒在 48 小時前送，年份沒有任何資訊量，卻吃掉 5 個半形字寬。
     ②月日改成中文。
   ⚠⚠ **括號維持半形（跟現況一樣），刻意不換成全形** —— 兩個理由：
     ・全形括號各佔一整個全形字寬，一組吃掉約 19px（第 19-17 節那一條），
       而這一行在 xl 22 上本來就是全卡最寬的（全形版量到 228.8／可用 240）。
     ・⚠⚠ 更要緊的是：**這是廠商系統的欄位，我們要求的改動愈小愈可能真的改到。**
       他們現在就是印半形，只要求「把年份拿掉、月日改中文」比連標點一起改容易得多。 */
.pv-new .dt{font-size:22px;line-height:1.45;font-weight:700;color:var(--ink);
  letter-spacing:.01em;margin-top:4px}
.pv-new .box{border-radius:8px;padding:10px 12px;margin-top:12px;
  font-size:14px;line-height:1.75;white-space:pre-line}
.pv-new .box.know{background:var(--paper);color:var(--ink-soft)}
.pv-new .box.warn{background:rgba(175,76,82,.09);color:var(--li-ink);font-weight:700}
.pv-new .box.say{background:rgba(68,120,181,.10);color:var(--ink)}
/* 24 小時那一段不用方塊時的兩種輕做法（切換條上比得到） */
.pv-new .warnline{font-size:14px;line-height:1.75;color:var(--ink-soft);
  margin-top:12px;white-space:pre-line}
/* 兩顆按鈕：主鈕是 Flex 原生的 button（實心綠、白字），
   ⚠ 這一顆**不需要圖示**，所以用 button 就夠了 —— 招呼卡那兩顆做成「可點的盒子」
     是因為要放 logo（Flex 的 button 只有 label、不支援圖示、也不會換行）。 */
.pv-new .btn{display:block;text-align:center;border-radius:9px;padding:12px;
  margin-top:14px;background:var(--green);color:#fff;font-size:16px;font-weight:700;
  letter-spacing:.02em;line-height:1.4}
.pv-new .nob{display:block;text-align:center;color:var(--deep);font-size:14px;
  font-weight:500;padding:11px 6px 0;line-height:1.4}
.pv-new .fine{font-size:13px;line-height:1.75;color:var(--ink-soft);margin-top:11px;
  white-space:pre-line}
.pv-new .fine b,.pv-new .lead b{font-weight:700;color:var(--ink-soft)}
/* 量名字那一行用的探針（真名 3 個字時多寬）—— 不佔位、不影響版面 */
.pv-probe{position:absolute;left:-9999px;top:0;font-size:14px;line-height:1.7;
  white-space:nowrap;font-weight:400}

/* ---- 量測面板 -------------------------------------------------------- */
.pv-cap{font-size:.74rem;color:var(--ink-soft);margin:9px 2px 0}
.pv-panel{margin:12px 0 0;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);padding:9px 11px;font-size:.73rem;line-height:1.85;
  color:var(--ink-soft)}
.pv-panel b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.pv-panel .ok{color:var(--deep);font-weight:700}
.pv-panel .no{color:#a33;font-weight:700}
.pv-panel hr{border:0;border-top:1px solid var(--rule);margin:7px 0}
.pv-note{font-size:.73rem;color:var(--ink-soft);margin:12px 0 0;
  border-left:3px solid var(--rule);padding-left:10px}
.pv-note b{color:var(--ink)}
.pv-h2{font-size:1rem;font-weight:700;margin:30px 0 0;letter-spacing:.01em}
.pv-h2 + .pv-sub{margin-top:6px}

/* ---- 切換條 ---------------------------------------------------------- */
.pv-bar{position:fixed;left:0;right:0;bottom:0;z-index:9;
  background:rgba(244,244,245,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--rule);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
.pv-bar .r{display:flex;gap:6px;align-items:center;overflow-x:auto;
  scrollbar-width:none;padding-bottom:2px}
.pv-bar .r::-webkit-scrollbar{display:none}
.pv-bar .lb{font-size:.66rem;color:var(--ink-soft);flex:none;width:3.6em}
/* ⚠ 切換條在手機上不能吃掉太多畫面（CLAUDE.md 第八節 hero-motion-mobile 那一輪：
     第一版量到一屏的 28%，而要判斷的正是那張卡）。五把尺收緊之後量到 23%。 */
.pv-bar button{flex:none;font:inherit;font-size:.72rem;line-height:1.55;
  border:1px solid var(--deep);color:var(--deep);background:#fff;
  border-radius:8px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.pv-bar button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.pv-bar .r + .r{margin-top:4px}
.pv-bar .r.off{opacity:.38;pointer-events:none}
/* ⚠⚠ 六把尺攤開會吃掉一屏的 28%，而這一頁要判斷的正是那張卡（它自己就 82%）。
   照 type-scale-ipad-2 那一輪的做法：**收起要縮成一顆小鈕，不是變矮的一條**。
   收起之後整條只剩 40px（5%）。 */
.pv-bar .fold{position:absolute;right:10px;top:-31px;border-radius:8px 8px 0 0;
  border-bottom-color:transparent;font-size:.7rem;padding:3px 10px;
  background:rgba(244,244,245,.96)}
.pv-bar.fold-in{padding-top:7px}
.pv-bar.fold-in .r{display:none}
.pv-bar.fold-in .fold{position:static;border-radius:8px;border-bottom-color:var(--deep)}
</style>
</head>
<body>
<div class="pv-wrap">
  <h1>看診前 48 小時的約診提醒　<span style="font-weight:400;font-size:.7em">提案</span></h1>
  <p class="pv-sub">這一則是<b>整個帳號曝光最高的訊息</b>（每一次約診都送一次），
  也是<b>四則裡唯一要花錢的</b>（主動推播才計費）。<br>
  底下切換<b>現況</b>與<b>新版</b>，再用下面<b>五把尺</b>決定<b>要留哪些、刪哪些</b>
  （切換條右上角可以<b>收起</b>）。
  推導在 <code>drafts/channels/README.md</code> 第三、八、九、十五、十九節。</p>

  <div class="pv-phone">
    <div class="pv-head"><img src="../../assets/icon-192.png" alt=""><span class="b">芳仁牙醫診所</span><span class="x">⋯</span></div>
    <div class="pv-chat">
      <div class="pv-day">7 月 12 日</div>
      <div class="pv-msg"><img class="pv-av" src="../../assets/icon-192.png" alt="">
        <div id="pv-slot"></div>
        <span class="pv-t">10:00</span></div>
    </div>
  </div>
  <p class="pv-cap">↑ 這一則是<b>診所這一側主動送出</b>的，所以聊天室裡沒有病人自己的訊息。
  ⚠ 近似，不是 LINE 自己的算繪。</p>

  <div class="pv-panel" id="pv-panel"></div>
  <p class="pv-note" id="pv-note"></p>
</div>

<div class="pv-bar" id="pv-bar">
  <button class="fold" id="pv-fold" aria-expanded="true">收起</button>
  <div class="r"><span class="lb">版本</span><span id="sw-v"></span></div>
  <div class="r" id="row-btn"><span class="lb">確認鈕</span><span id="sw-b"></span></div>
  <div class="r" id="row-no"><span class="lb">不克前往</span><span id="sw-n"></span></div>
  <div class="r" id="row-w"><span class="lb">24小時</span><span id="sw-w"></span></div>
  <div class="r" id="row-k"><span class="lb">就診須知</span><span id="sw-k"></span></div>
  <div class="r" id="row-t"><span class="lb">診所名</span><span id="sw-t"></span></div>
</div>

<span class="pv-probe" id="pv-probe"></span>

<script>
(function () {
  "use strict";

  /* ⚠⚠ 斷行一律用 \n 自己指定，不要交給自動換行（line-auto-reply/README 第 24-3 節）。
     這張卡的可用寬度：卡片 268 − 內距 28 ＝ **240px**；淡底方塊裡再扣 24 ＝ **216px**。
     換算成全形字：sm 14 → 卡上 17 個／方塊裡 15 個；md 16 → 15 個；xs 13 → 18 個。
     ⚠ 半形字算一半 —— 「24」「2」「05-5339369」都是半形，不能用「數幾個字元」代替量測。

     ⚠⚠⚠ 但**有變數的那一行不能手動斷行**：〔病人姓名〕是系統填的（{{patient}}），
       名字幾個字我們不知道，硬斷會在別人身上斷錯地方。那一行只能交給自動換行，
       面板會現場量「真名 3 個字時多寬」給你看。 */

  var TEL = "05-5339369";

  /* ---- 現況（照截圖，姓名已遮）------------------------------------- */
  var OLD = {
    name: "Ⓐ 現況",
    note: "廠商系統現在送出的那一張（照你提供的截圖重做，顏色是從截圖描的）。"
      + "六件問題在 channels/README 第 9-1 節：<b>飽和的橄欖綠滿版標題列</b>、"
      + "<b>⚠ 就診須知 ⚠</b>（把戴口罩講成警報）、<b>紅字＋↓↓ 箭頭</b>、"
      + "<b>「點此 👉 確定會到！」</b>（emoji ＋ 驚嘆號 ＋「點此」三重用力）、"
      + "<b>編號清單＋『』引號</b>（公文體）、以及<b>資訊層級亂</b>——"
      + "日期雖然大，卻被上下的雜訊淹沒。"
      + "<br>⚠ 另外三件是**事實**不是美感："
      + "①標題寫「<b>斗六</b>芳仁牙醫診所」，站上與其他每一個地方都是「芳仁牙醫診所」；"
      + "②「〔病人姓名〕 提醒您」的語序讀起來像<b>那個人在提醒你</b>"
      + "（名字本身是必要的 —— 一個帳號收得到好幾個家人的提醒，那是唯一分得出是誰的線索）；"
      + "③須知第 2 條「請來電改約」和底下那顆「不克前往，預約改期」<b>互相矛盾</b>"
      + "（一個叫他打電話、一個叫他按按鈕）。"
  };

  /* ---- 新版 ---------------------------------------------------------- */
  /* ⚠ 就診須知那兩句是**臨床內容**，要醫師點頭才能改（channels/README 第 9-4 節）。
       「一句」那一格砍掉的是發燒那一句 —— 那是感染管控，砍掉要醫師同意。 */
  var KNOW = {
    two:  { name: "兩句", text: "看診前請帶健保卡，並戴上口罩。\n如果有發燒或咳嗽，\n先打電話給診所。" },
    one:  { name: "一句", text: "看診前請帶健保卡，並戴上口罩。" },
    none: { name: "不放", text: "" }
  };
  /* 24 小時那一段：這是 2026-09-04 你自己整理那一份帶進來的新事實 ——
     ⚠⚠ 而它其實**是這張卡的事**：計時是從這一則送出的那一刻開始算的。
     綁定完成那一則只是先告訴他有這回事，真正到期的是這裡。 */
  var WARN = {
    box:  { name: "淡底方塊" },
    line: { name: "一般句" },
    none: { name: "不寫" }
  };
  var WARN_TEXT = "請按下面的按鈕回覆。\n若24小時內無回應，\n系統將自動取消約診，\n以遞補他人的候診需求。";

  /* ---- 量測 ---------------------------------------------------------- */
  /* 逐字量 top 分組 —— 這樣才知道**實際**折成幾行、末行剩幾個字。
     ⚠ 不能只數 \n：手動斷好的一行如果太長，瀏覽器還是會再折一次，
       而那一折出來的末行就是孤字。要量的正是這件事。 */
  function lines(el) {
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), tns = [], n;
    while ((n = w.nextNode())) tns.push(n);
    var r = document.createRange(), g = {};
    tns.forEach(function (tn) {
      var t = tn.textContent;
      for (var k = 0; k < t.length; k++) {
        r.setStart(tn, k); r.setEnd(tn, k + 1);
        var b = r.getBoundingClientRect();
        if (b.height && t[k] !== "\n" && t[k] !== " " && t[k] !== "　") {
          var top = Math.round(b.top);
          if (!g[top]) g[top] = { s: "", l: b.left, r: b.right };
          g[top].s += t[k];
          if (b.left < g[top].l) g[top].l = b.left;
          if (b.right > g[top].r) g[top].r = b.right;
        }
      }
    });
    return Object.keys(g).map(Number).sort(function (a, b2) { return a - b2; })
      .map(function (t) { return { s: g[t].s, w: g[t].r - g[t].l }; });
  }

  function rel(c) {
    return [c.r, c.g, c.b].map(function (x) {
      x /= 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4);
    }).reduce(function (a, x, i) { return a + x * [.2126, .7152, .0722][i]; }, 0);
  }
  function px(c) { var m = c.match(/[\d.]+/g).map(Number); return { r: m[0], g: m[1], b: m[2], a: m.length > 3 ? m[3] : 1 }; }
  function ratio(fg, bg) { var a = rel(fg) + .05, b = rel(bg) + .05; return a > b ? a / b : b / a; }
  /* ⚠⚠ 淡底方塊是**半透明**疊在卡色上，直接讀 rgba 會算錯 —— 要先合成。 */
  function ct(el, cardBg) {
    if (!el) return null;
    var cs = getComputedStyle(el), wb = px(cs.backgroundColor), fg = px(cs.color);
    var bg = wb.a === 0 ? cardBg : {
      r: wb.r * wb.a + cardBg.r * (1 - wb.a),
      g: wb.g * wb.a + cardBg.g * (1 - wb.a),
      b: wb.b * wb.a + cardBg.b * (1 - wb.a)

    return { c: ratio(fg, bg), bg: bg };
  }
  function hex(c) {
    return "#" + [c.r, c.g, c.b].map(function (x) {
      return ("0" + Math.round(x).toString(16)).slice(-2);

  }

  var EMOJI = /[\u2600-\u27BF\u2B00-\u2BFF]|[\uD83C-\uD83E][\uDC00-\uDFFF]/g;

  function measure() {
    var body = document.getElementById("pv-body");
    var ls = lines(body);
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    var box = body.getBoundingClientRect();
    var text = body.innerText || body.textContent;
    var emo = text.match(EMOJI) || [];
    var cardBg = px(getComputedStyle(body).backgroundColor);

    /* 可用寬度 ＝ 卡片扣掉內距（圖卡是固定 268，不必像泡泡那樣算天花板） */
    var inner = body.querySelector(".b"), ics = getComputedStyle(inner);
    var avail = inner.getBoundingClientRect().width
      - parseFloat(ics.paddingLeft) - parseFloat(ics.paddingRight);

    /* 自己斷了幾行 —— 拿它和實際畫出來的比，多出來的就是被自動折掉的。
       ⚠ 現況那一張是照截圖重做的，沒有手動斷行，所以只對新版算。 */
    var self = {}, selfN = 0;
    if (v === "new") {
      body.querySelectorAll(".lead,.dt,.box,.warnline,.fine,.btn,.nob").forEach(function (el) {

    var wide = 0, widest = "";
    ls.forEach(function (l) { if (l.w > wide) { wide = l.w; widest = l.s; } });

      probe.textContent = "李小明的看診時間快到了";
      nameW = probe.getBoundingClientRect().width;
      /* 幾個字才會折：一個一個加上去試 */
      for (var i = 2; i <= 8; i++) {
        probe.textContent = Array(i + 1).join("名") + "的看診時間快到了";
        if (probe.getBoundingClientRect().width > avail) break;
        nameMax = i;
      }
      probe.textContent = "";

            + "下面的折行判斷偏鬆 " + (268 - box.width).toFixed(0) + "px</span>")
      + "<br>高 <b>" + box.height.toFixed(0) + "px</b>　佔你這一屏 <b>"
        + (box.height / vh * 100).toFixed(0) + "%</b>"
      + "　字數 <b>" + text.replace(/\s/g, "").length + "</b>"
      + "<br>emoji <b>" + emo.length + "</b>" + (emo.length ? "（" + emo.join(" ") + "）" : "")
        + "　紅字 <b>" + body.querySelectorAll(".red").length + " 行</b>"
        + (emo.length || body.querySelectorAll(".red").length
            ? "" : " <span class='ok'>都是 0</span>")
      + (v === "new"
          ? "<br>自己斷 <b>" + selfN + " 行</b>，你這台畫出 <b>" + ls.length + " 行</b>"
            + (ls.length - selfN > 0
                ? "（多的 " + (ls.length - selfN) + " 行是被再折一次的）"
                : "<span class='ok'>（一行都沒被再折）</span>")
          : "<br>畫出 <b>" + ls.length + " 行</b>")
      + "<br>孤字 " + (orphan.length
          ? "<span class='no'>" + orphan.length + " 行：「"
            + orphan.map(function (o) { return o.s; }).join("」「") + "」</span>"
          : "<span class='ok'>沒有</span>")
      + "<br>最寬的一行 <b>" + wide.toFixed(0) + "px</b>／可用到 <b>" + avail.toFixed(0) + "px</b>"
        + " <span>（" + widest.slice(0, 12) + "）</span>"
      + "<br>電話沒被折斷 " + (!hasTel
          ? "<span class='no'>這一張根本沒有印號碼</span>"

      + (v === "new"

  /* ---- 切換條 -------------------------------------------------------- */
  function bar(id, set, get, put) {
    var box = document.getElementById(id);
    box.innerHTML = "";
    Object.keys(set).forEach(function (k) {
      var b = document.createElement("button");
      b.textContent = set[k].name;
      b.setAttribute("aria-pressed", get() === k ? "true" : "false");
      b.onclick = function () { put(k); render(); };
      box.appendChild(b);
    });
  }
  function render() {

    bar("sw-v", { old: { name: "Ⓐ 現況" }, new: { name: "Ⓑ 新版" } },
        function () { return v; }, function (k) { v = k; });
    bar("sw-b", BTN, function () { return bt; }, function (k) { bt = k; });
    bar("sw-n", NOB, function () { return nb; }, function (k) { nb = k; });
    bar("sw-w", WARN, function () { return wa; }, function (k) { wa = k; });
    bar("sw-k", KNOW, function () { return kn; }, function (k) { kn = k; });
    bar("sw-t", TOPBAR, function () { return tb; }, function (k) { tb = k; });
    /* 現況那一張是廠商的，四把尺對它無效 —— 關掉而不是拿掉，
       不然切回新版時整條會跳高一截。 */
    ["row-btn", "row-no", "row-w", "row-k", "row-t"].forEach(function (id) {
      document.getElementById(id).className = "r" + (v === "old" ? " off" : "");
    });
    var q = v === "old" ? "?v=old"
      : "?v=new&b=" + bt + "&n=" + nb + "&w=" + wa + "&k=" + kn + "&t=" + tb;
    history.replaceState(null, "", location.pathname + q);
    measure();
    document.getElementById("pv-note").innerHTML = note();
  }
