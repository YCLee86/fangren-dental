<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>LINE 自動回應・提案（芳仁牙醫診所）</title>
<!--
  提案頁：LINE 官方帳號的自動回應在「病人手機上」長什麼樣。
  推導與全部文字在 drafts/line-auto-reply/README.md。

  ⚠ 這一頁模擬的是**病人的畫面**，不是後台。
     後台那個「自動回應訊息」的小標籤只有你（管理者）看得到，病人不會看到。
  ⚠ 圖文訊息那兩張是**真的產出檔**（preview/line-reply/rich-{2,4}.png，
     由 drafts/line-auto-reply/rich.mjs 產生），不是用 CSS 再畫一次 ——
     同 og-topic-card 那一輪的教訓：CSS 重畫的會比實際清楚，等於在騙自己。
  ⚠ 泡泡的綠 #6de67b 是從使用者的 LINE 截圖量出來的（drafts/line-mock.mjs 那一輪）。
  ⚠ class 一律 pv- 前綴。定案之後這一頁整個刪掉，文字搬進 history/。
-->
<style>
:root{
  --paper:#e2e5e6; --card:#f4f4f5; --rule:#cdd0d2;
  --ink:#2a2c27; --ink-soft:#5c5f57; --green:#3f654a; --deep:#2c5238;
  /* LINE 那一側的顏色（別人的介面，不進 PALETTE.md） */
  --li-bg:#e9edf1; --li-in:#ffffff; --li-out:#6de67b; --li-head:#ffffff;
  --li-meta:#8b96a1; --li-ink:#14181c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.7;padding-bottom:210px}
.pv-wrap{max-width:430px;margin:0 auto;padding:14px 14px 0}
h1{font-size:1rem;font-weight:700;letter-spacing:.02em}
.pv-sub{font-size:.78rem;color:var(--ink-soft);margin:.35rem 0 .9rem}

/* ---- 手機外框 ＋ LINE 聊天室 ---------------------------------------- */
.pv-phone{border:1px solid var(--rule);border-radius:14px;overflow:hidden;
  background:var(--li-bg);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.pv-head{background:var(--li-head);display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-bottom:1px solid #e3e6ea}
.pv-head .b{font-size:.9rem;font-weight:700;color:var(--li-ink)}
.pv-head img{width:26px;height:26px;border-radius:50%;display:block}
.pv-head .x{margin-left:auto;color:var(--li-meta);font-size:1rem;letter-spacing:.14em}
.pv-chat{padding:12px 11px 16px;display:flex;flex-direction:column;gap:11px}

.pv-msg{display:flex;gap:7px;align-items:flex-end;max-width:100%}
.pv-msg.me{flex-direction:row-reverse}
.pv-av{width:30px;height:30px;border-radius:50%;flex:none;background:#fff;
  border:1px solid #e3e6ea}
.pv-msg.me .pv-av{visibility:hidden}
.pv-bub{background:var(--li-in);border-radius:15px;padding:8px 11px;
  font-size:.86rem;line-height:1.62;color:var(--li-ink);white-space:pre-wrap;
  max-width:min(268px,74%);box-shadow:0 1px 1px rgba(0,0,0,.05);word-break:break-word}
.pv-msg.me .pv-bub{background:var(--li-out)}
.pv-bub a{color:#2b6cb0;text-decoration:underline}
.pv-bub.img{padding:0;background:none;box-shadow:none;border-radius:12px;overflow:hidden;
  max-width:min(232px,66%);line-height:0}
.pv-bub.img img{width:100%;display:block}
.pv-t{font-size:.62rem;color:var(--li-meta);flex:none;padding-bottom:2px}
.pv-card{background:#fff;border-radius:12px;overflow:hidden;max-width:min(232px,66%);
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pv-card .k{background:#e8eef7;height:52px}
.pv-card .btn{background:#2d5db8;color:#fff;font-size:.78rem;font-weight:700;
  text-align:center;padding:9px 6px}
.pv-day{align-self:center;background:rgba(0,0,0,.16);color:#fff;font-size:.66rem;
  padding:2px 11px;border-radius:11px}

/* ---- 量測面板 -------------------------------------------------------- */
.pv-panel{margin:12px 0 0;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);padding:9px 11px;font-size:.72rem;line-height:1.85;
  color:var(--ink-soft)}
.pv-panel b{color:var(--ink);font-weight:700}
.pv-panel .ok{color:var(--deep);font-weight:700}
.pv-panel .no{color:#a33;font-weight:700}
.pv-note{font-size:.72rem;color:var(--ink-soft);margin:10px 0 22px;
  border-left:3px solid var(--rule);padding-left:9px}

/* ---- 切換條 ---------------------------------------------------------- */
.pv-bar{position:fixed;left:0;right:0;bottom:0;z-index:9;
  background:rgba(244,244,245,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--rule);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.pv-bar .r{display:flex;gap:6px;align-items:center;overflow-x:auto;
  scrollbar-width:none;padding-bottom:2px}
.pv-bar .r::-webkit-scrollbar{display:none}
.pv-bar .lb{font-size:.66rem;color:var(--ink-soft);flex:none;width:2.6em}
.pv-bar button{flex:none;font:inherit;font-size:.74rem;line-height:1.6;
  border:1px solid var(--deep);color:var(--deep);background:#fff;
  border-radius:8px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.pv-bar button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.pv-bar .r + .r{margin-top:6px}
</style>
</head>
<body>

<div class="pv-wrap">
  <h1>LINE 自動回應 —— 病人手機上長什麼樣</h1>
  <p class="pv-sub">底下切換<b>情境</b>與<b>版本</b>。這是病人看到的畫面：官方帳號在左邊，他自己的訊息在右邊。
    後台那個「自動回應訊息」小標籤只有你看得到，他不會看到。<br>
    ⚠ <b>加好友</b>那一則是「招呼訊息」，<b>綁定完</b>與<b>打字之後</b>跳出來的是同一則「自動回應」——
    後台是兩個不同的設定。</p>

  <div class="pv-phone">
    <div class="pv-head">
      <img src="../../assets/icon-192.png" alt="">
      <span class="b">芳仁牙醫診所</span><span class="x">···</span>
    </div>
    <div class="pv-chat" id="chat"></div>
  </div>

  <div class="pv-panel" id="panel"></div>
  <p class="pv-note" id="note"></p>
</div>

<div class="pv-bar">
  <div class="r"><span class="lb">情境</span><span id="sw-s"></span></div>
  <div class="r"><span class="lb">版本</span><span id="sw-v"></span></div>
</div>

<script>
(function () {
  var TEL = "05-5339369";

  /* ⚠⚠ 後台是兩個不同的設定，而且 LINE 分不出「剛綁定完」和「打字問事情」：
     ・招呼訊息 —— 只在「加好友」的當下送一次，可以用 {好友的顯示名稱} 這個變數。
     ・自動回應 —— 病人送出任何訊息都會回；那句「綁定成功」是以病人的身分送進
       聊天室的，所以它也會觸發這一則。**同一則文字要在兩種情境下都讀得通。** */

  var WELCOME = {
    img:
"{好友的顯示名稱}你好，這裡是芳仁牙醫診所。\n斗六永樂街上，1983 年開到現在。\n\n在這個 LINE 上你可以：\n・改約診、取消 —— 打電話最快\n・看門診時間，哪一診有你要看的科\n・點開地圖找路，附近哪裡好停車\n\n看診時間內都有人接：\n" + TEL + "",
    txt:
"{好友的顯示名稱}你好，這裡是芳仁牙醫診所。\n斗六永樂街上，1983 年開到現在。\n\n改約診、取消，打電話最快：" + TEL + "\n看診時間　週一至週五\n早 08:45–11:30／午 13:45–16:30／晚 17:45–20:00\n\n門診表、找路與各科說明：https://fangren.net"
  };

  var AUTO = {
    img:
"這裡是芳仁牙醫診所。\n\n這個帳號沒有專人看訊息，\n改約診或取消，直接撥電話最快：\n" + TEL + "\n看診時間內都有人接，忙線就隔幾分鐘再撥。\n\n門診時間、找路、診所網站，\n上面那張圖點一下就有。",
    txt:
"這裡是芳仁牙醫診所。\n\n這個帳號沒有專人看訊息，\n改約診或取消，直接撥電話最快：\n" + TEL + "\n看診時間內都有人接，忙線就隔幾分鐘再撥。\n\n看診時間　週一至週五\n早 08:45–11:30／午 13:45–16:30／晚 17:45–20:00\n門診表與找路：https://fangren.net"
  };

  var NOW =
"感謝您的訊息！\n\n很抱歉，本帳號無法個別回覆用戶的訊息。\n如有需要更改約診，\n麻煩在診所營業時間來電 。\n診所電話 055339369 謝謝。\n診所有專業的諮詢人員，\n如有療程需要了解，\n請來電告知想要約諮詢師了解。";

  var VER = {
    now:  { name: "現況" },
    four: { name: "四格圖＋短文字", img: "rich-4.png",
            tap: "四格各自可以點：診所網站、直接撥號、門診表、Google 地圖" },
    two:  { name: "兩格圖＋短文字", img: "rich-2.png",
            tap: "上半開網站、下半直接撥號" },
    text: { name: "只有文字" }
  };
  var SCENE = { hello: "剛加好友", bind: "剛綁定完", ask: "傳訊息要改約" };

  var state = { s: "bind", v: "four" };

  function body(scene, ver) {
    if (ver === "now") return NOW;
    var set = (scene === "hello") ? WELCOME : AUTO;
    return VER[ver].img ? set.img : set.txt;
  }

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function linkify(node, text) {
    text.split(/(https:\/\/fangren\.net)/).forEach(function (p, i) {
      if (i % 2) { var a = el("a", null, p); a.href = p; node.appendChild(a); }
      else node.appendChild(document.createTextNode(p));
    });
  }
  function msg(who, time, build) {
    var row = el("div", "pv-msg" + (who === "me" ? " me" : ""));
    var av = el("div", "pv-av");
    if (who !== "me") av.style.background = "url(../../assets/icon-192.png) center/cover";
    row.appendChild(av);
    row.appendChild(build());
    row.appendChild(el("span", "pv-t", time));
    return row;
  }
  function bubble(text) {
    return function () { var b = el("div", "pv-bub"); linkify(b, text); return b; };
  }
  function image(src) {
    return function () {
      var b = el("div", "pv-bub img"), i = new Image();
      i.src = src; i.alt = ""; i.addEventListener("load", measure);
      b.appendChild(i); return b;
    };
  }
  function reply(chat, time) {
    var v = VER[state.v];
    if (v.img) chat.appendChild(msg("oa", time, image(v.img)));
    chat.appendChild(msg("oa", time, bubble(body(state.s, state.v))));
  }

  function render() {
    var chat = document.getElementById("chat");
    chat.innerHTML = "";
    chat.appendChild(el("div", "pv-day", "今天"));

    if (state.s === "hello") {
      if (state.v === "now")
        chat.appendChild(msg("oa", "8:44", bubble("（現行的招呼訊息我沒有看到，所以這一格是空的）")));
      else reply(chat, "8:44");
    } else if (state.s === "bind") {
      chat.appendChild(msg("oa", "8:45", function () {
        var c = el("div", "pv-card");
        c.appendChild(el("div", "k"));
        c.appendChild(el("div", "btn", "點擊啟動完整服務 →"));
        return c;
      }));
      chat.appendChild(msg("me", "8:46", bubble("✅ 0976237217 綁定成功！\n可以啟用線上相關服務囉！")));
      reply(chat, "8:46");
    } else {
      chat.appendChild(msg("me", "18:42", bubble("你好，我想改下週三下午的約診")));
      reply(chat, "18:42");
      chat.appendChild(msg("me", "18:44", bubble("謝謝，我有打電話，忙線中")));
      reply(chat, "18:44");
    }
    requestAnimationFrame(measure);
  }

  function measure() {
    var v = VER[state.v];
    var bubs = document.querySelectorAll(".pv-chat .pv-msg:not(.me) .pv-bub:not(.img)");
    var last = bubs[bubs.length - 1];
    var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    var h = last ? last.getBoundingClientRect().height : 0;
    var pct = h / vh * 100;
    var lines = body(state.s, state.v).split("\n").length;
    var img = document.querySelector(".pv-chat .pv-bub.img img");
    var iw = img ? Math.round(img.getBoundingClientRect().width) : 0;
    var kind = (state.s === "hello") ? "招呼訊息" : "自動回應";

    document.getElementById("panel").innerHTML =
      "<b>" + kind + "・" + v.name + "</b>　" +
      (pct > 62 ? '<span class="no">佔一屏 ' + pct.toFixed(0) + "%</span>，要捲才看得完"
                : '<span class="ok">佔一屏 ' + pct.toFixed(0) + '%</span>，一眼看得完') +
      "<br>文字 <b>" + lines + "</b> 行・泡泡高 <b>" + h.toFixed(0) + "px</b>（你的螢幕 " +
      Math.round(window.innerWidth) + "×" + Math.round(vh) + "）" +
      (iw ? "<br>圖在聊天室裡實際顯示 <b>" + iw + "px</b> 寬（原檔 1040×1040）" : "") +
      (v.tap ? "<br>可以點的地方：" + v.tap : "");

    document.getElementById("note").textContent =
      state.s === "hello"
        ? "「招呼訊息」是加好友的當下送出的那一則，後台和自動回應是兩個不同的設定，"
          + "而且只有它可以用 {好友的顯示名稱} 這個變數。"
        : state.s === "bind"
        ? "⚠ 這一則不是招呼訊息，是自動回應 —— 那句「綁定成功」是以病人的身分送進聊天室的，"
          + "所以自動回應被觸發了，而且擋不掉（LINE 的關鍵字回應是完全一致比對，"
          + "那句話裡的手機號碼每個人都不一樣）。所以同一則文字要在「剛綁定完」與"
          + "「打字問事情」兩種情境下都讀得通。"
        : "截圖裡真的發生過的一段：他傳訊息、拿到自動回應、打了電話忙線、再傳一次、"
          + "又拿到同一則。同一則會出現兩次，所以它每次讀起來都還要有用。";
  }

  function chips(host, obj, key) {
    Object.keys(obj).forEach(function (k) {
      var b = el("button", null, obj[k].name || obj[k]);
      b.type = "button";
      b.setAttribute("aria-pressed", String(state[key] === k));
      b.addEventListener("click", function () {
        state[key] = k;
        host.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        sync(); render();
      });
      host.appendChild(b);
    });
  }
  function sync() {
    history.replaceState(null, "", location.pathname + "?s=" + state.s + "&v=" + state.v);
  }
  var m = location.search.match(/[?&]s=([a-z0-9]+)/);
  if (m && SCENE[m[1]]) state.s = m[1];
  m = location.search.match(/[?&]v=([a-z0-9]+)/);
  if (m && VER[m[1]]) state.v = m[1];

  chips(document.getElementById("sw-s"), SCENE, "s");
  chips(document.getElementById("sw-v"), VER, "v");
  render();
  window.addEventListener("resize", measure);
})();
</script>
</body>
</html>
