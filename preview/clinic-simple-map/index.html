         米灰色的街廓、紅色豆子標診所、藍色圓圈標停車場、三角形指「入口」。

     不會被吃掉**。不寫 paint-order 的話描邊蓋在填色上，洞會縮成一條縫。 */
.map-svg .lot .pk {
  fill: var(--card); stroke: var(--card); stroke-width: 1.6;
  paint-order: stroke; stroke-linejoin: round;
}
/* 對焦框。⚠ **滑鼠點下去不可以出現**（2026-08-14 使用者：「電腦版點下去
   停車場有奇怪的框框」）。`:focus-visible` 本來就是為了這件事，但**帶
   `tabindex` 的非原生可聚焦元素，Chrome 用滑鼠點也會判定成 focus-visible**
   —— 這三塊 `<g role="button" tabindex="0">` 正是那種。
   所以點完之後主動 `blur()`（見下面的 JS）：滑鼠使用者不留焦點，
   用 Tab 走過來的還是會亮框（那不是 click 來的）。 */
.lot:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* 步行路線：Google 那種點狀線。dasharray 的 0.1 ＋ round 端點 ＝ 圓點。 */
/* ⚠ 路線**不畫線**，它只是「幾何來源」：底下的 JS 沿著它等距排圓點。
   原本用 stroke-dasharray 排點，轉角會把相位打亂，看起來就是間隔不一致、
   靠近診所那一段還會像歪掉（2026-08-14 使用者指出兩次）。 */
.route { fill: none; stroke: none; }
.dots { opacity: 0; transition: opacity .18s ease; }
.dots circle { fill: var(--map-park); }
.rlab { opacity: 0; pointer-events: none; transition: opacity .18s ease; }
.dots.on, .rlab.on { opacity: 1; }
.rlab.on { pointer-events: auto; }
/* 牌子的兩案（2026-08-14 第三十四輪，使用者：「停車場的對話框現在是淺底色＋
   藍邊，做一個藍底色白字的版本，這樣圖釘變成白色」）。切換條最後一排。

     淺（light）  底＝路牌藍 10% 混紙卡色、框 1.5、字與圖釘與底線＝路牌藍（5.84:1）
     實（solid）  底＝足額路牌藍、無框、字與圖釘與底線＝紙卡色（7.43:1）

   ⚠ **尾巴兩案都是足額的路牌藍。** 淺的那一案因此是「實心尾巴 ＋ 空心盒子」，
     矩形的框線橫過尾巴根部那一段是藍疊藍，看不出接縫 —— 不必另外處理。
   ⚠ 兩案的白／藍**只換前景與底，字級、位置、底線的算法完全共用**。
   ⚠ 診所那塊名牌一直都是實心綠底白字，不吃這個切換 —— 淺的那一案存在的
     理由就是「和診所一深一淺分得出主次」（第三十輪 (4)）。實的那一案等於
     把這個差別交回給顏色（綠 vs 藍）去分。 */
.map-svg .rlab .tail { fill: var(--map-park); }
/* 全空心那一案：三角形不另外實心畫，交給 .bub 那一圈外框自己收邊。 */
html[data-chip="outline"] .map-svg .rlab .tail { display: none; }
/* ⚠ 這幾條要寫成 .map-svg …（多一階）—— 只寫 .rlab text 的話
   和後面的 `.map-svg text { fill: var(--map-ink) }` 同權重，後者排在後面會贏。 */
.map-svg .rlab text { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
.map-svg .rlab .rl-nm { font-size: 16px; }

html[data-chip="light"]   .map-svg .rlab .bub,
html[data-chip="outline"] .map-svg .rlab .bub {
  fill: color-mix(in srgb, var(--map-park) 10%, var(--card));
  stroke: var(--map-park); stroke-width: 1.5;
}
html[data-chip="light"]   .map-svg .rlab text,
html[data-chip="light"]   .map-svg .rl-pin,
html[data-chip="outline"] .map-svg .rlab text,
html[data-chip="outline"] .map-svg .rl-pin { fill: var(--map-park); }
html[data-chip="light"]   .map-svg .rl-ul,
html[data-chip="outline"] .map-svg .rl-ul  { stroke: var(--map-park); }

html[data-chip="solid"] .map-svg .rlab .bub { fill: var(--map-park); stroke: none; }
html[data-chip="solid"] .map-svg .rlab text,
html[data-chip="solid"] .map-svg .rl-pin { fill: var(--card); }
html[data-chip="solid"] .map-svg .rl-ul  { stroke: var(--card); }
/* 圖釘：**實心那顆**（Font Awesome 的 map-marker，viewBox 384x512），
   = 頁尾地址前面那一顆。2026-08-14 第三十一輪從線條空心換過來，使用者指定。
   注意 和 HERO 窄帶那顆（Lucide 線條版，24 格見方）**是兩個不同的圖示**，
     這一站兩顆都在用，換的時候要看清楚是哪一顆。 */
.map-svg .rl-pin { stroke: none; }
.map-svg .rl-ul  { stroke-width: 1.2; }
.rl-link { cursor: pointer; }
/* 診所的名牌：**實心綠底白字**，和停車場那三塊剛好相反（見標記那一段）。 */
.map-svg .clab .bub, .map-svg .clab .tail { fill: var(--map-mark); }
/* 名牌的一鍵開關（2026-08-14 第三十七輪，使用者要「有和沒有」比一比）。
   ⚠ 用 display 不是 opacity —— 這是「要不要這塊東西」的比較，
     留一塊透明的在那裡會讓 hideCovered 之類的量測誤判。 */
html[data-clab="off"] .map-svg .clab { display: none; }
.map-svg .clab text { fill: var(--card); font-size: 15px; font-weight: 700; letter-spacing: .04em; }
/* ⚠ **診所的名牌一直都在，點到停車場也不收**（2026-08-14 使用者：
   「還是保留芳仁牙醫診所標籤好了」）。
   上一輪做過「點到就整塊淡出」，看過實際畫面之後退回來了 ——
   收掉之後那一刻圖上沒有任何東西寫著終點是誰，路線變成從停車場走向一塊
   無名的綠色。**不要再加回去。** */
/* 有停車場亮著的時候，街名淡下去 —— 不然點狀路線壓在街名上很難辨認
   （2026-08-14 使用者指出）。⚠ 這一條要比 .map-svg .lbl 那條多一階才蓋得過
   它自己的 opacity: var(--lbl-op)。 */
.map-svg .lbl, .map-svg .lbl-s, .map-svg .lbl-xs { transition: opacity .18s ease; }
.map-svg.dim .lbl, .map-svg.dim .lbl-s, .map-svg.dim .lbl-xs { opacity: .28; }
/* **被路線或牌子壓到的那幾個街名直接不見**（2026-08-14 使用者：「點下去有
   虛線路線後，若壓到路名，這個模式下路名可拿掉」）。哪幾個是壓到的
   由 JS 現算（見底下 hideCovered），不是寫死 —— 路線或牌子挪位置就會自己跟著變。
   ⚠ 這一條要排在上面那條 .dim 後面（同權重，後者贏）。 */
.map-svg .lbl.hide, .map-svg .lbl-s.hide, .map-svg .lbl-xs.hide { opacity: 0; }
/* 入口指標：**平常不出現，點到那一塊才出現**（2026-08-14 第二十九輪，使用者：
   「入口其實不用一開始就標示，是點下去才要 —— 壹車房跟合廷有兩條路，
   會不知道要從哪邊進去；永樂站只有一條路，一看就知道，不需要標示。」）。
   ⚠ 這是**資訊分層**，不是為了畫面乾淨：三顆箭頭一直亮著的時候，
     它們和「點我」是同一個視覺重量，反而看不出哪一顆是回答問題的。
   ⚠ 用 `visibility` 不是 `display`：`display:none` 的元素量不到外框，
     底下 hideCovered 那一段會拿不到它的 rect。
   ⚠ 永樂站那顆**留著**，不必特別為它寫規則 —— 它點下去之後會被自己那條
     路線壓到，下面那條 `.hide` 就會把它收掉（2026-08-14 上一輪的機制）。 */
.map-svg .ent { visibility: hidden; opacity: 0; transition: opacity .18s ease; }
.map-svg .lot.on .ent { visibility: visible; opacity: 1; }
.map-svg .lot.on .ent.hide { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .lot rect, .lot path, .lot .pk, .dots, .rlab,
  .map-svg .lbl, .map-svg .lbl-s, .map-svg .lbl-xs { transition: none; }
}

html[data-corner="all"]  .c-edge { display: none; }
html[data-corner="edge"] .c-all  { display: none; }

html[data-mark="plot"] .mark-logo, html[data-mark="plot"] .mark-bean { display: none; }
html[data-mark="logo"] .mark-plot, html[data-mark="logo"] .mark-bean { display: none; }
html[data-mark="bean"] .mark-plot, html[data-mark="bean"] .mark-logo { display: none; }

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans TC",
               system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.85; letter-spacing: .01em;
}
.shell { max-width: var(--shell); margin-inline: auto; padding-inline: var(--pad); }
main { padding-block: 2.4rem 12rem; }
h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 .4rem; letter-spacing: .04em; }
.lead { margin: 0 0 2rem; font-size: .9rem; line-height: 1.9; color: var(--ink-soft); max-width: 46em; }
h2 { font-size: 1.25rem; font-weight: 500; margin: 0 0 1.1rem; letter-spacing: .05em; }

/* ---- 底下這一段是 index.html「診所資訊」那一節的複本，只留這一頁用得到的 ---- */
.info { display: grid; gap: 1.2rem; grid-template-columns: repeat(2, 1fr); }
.info-card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
  padding: 1.1rem 1.2rem 1.2rem; min-width: 0;
}
.info-card h3 {
  display: inline-block; margin: 0 0 .55rem;
  font-size: .76rem; font-weight: 400; letter-spacing: .08em; line-height: 1.6;
  padding: .07rem .65rem; border-radius: 9px;
  background: var(--teal); color: #fff;
}
.info-card p { margin: 0; font-size: .93rem; line-height: 1.8; }
.info-card .big {
  display: inline-block; margin-top: .15rem;
  background: #dbe0e0; border-radius: 10px;
  padding: .3rem .85rem; font-size: 1.2rem; letter-spacing: .04em;
}
.info-card .big a { color: var(--teal); text-decoration: none; }
.info-card a { color: var(--teal); }
.card-map { grid-column: 1 / -1; }
/* ≤720 的地方 .info 收成一欄（同 index.html 的斷點），地圖才不會被擠成
   150px 寬 —— 那個寬度上街名只剩 5.7px，等於整張圖只剩形狀。 */
@media (max-width: 720px) { .info { grid-template-columns: 1fr; } }

/* ---- 地圖本體 ---------------------------------------------------------- */
.map-fig { margin: 0; }
.info-card .map-fig { margin-top: .9rem; }   /* 收在地址卡裡的時候接在地址下面 */
.map-svg { display: block; width: 100%; height: auto; max-width: 480px; font-family: inherit; }
.card-map .map-svg { max-width: 480px; margin-inline: auto; }
.map-svg text { fill: var(--map-ink); font-weight: 400; }
.map-svg .lbl   { font-size: 22px; letter-spacing: .06em; font-weight: 700; opacity: var(--lbl-op, 1); }
.map-svg .lbl-xs{ font-size: 16px; letter-spacing: .02em; font-weight: 700; opacity: var(--lbl-op, 1); }
.map-svg .lbl-s { font-size: 20px; letter-spacing: .04em; font-weight: 700; opacity: var(--lbl-op, 1); }
/* 停車場的 P：**粗體**，比照路上停車標誌的份量（2026-08-14 使用者指定）。
   ⚠⚠ **這個 P 不吃全站的中文字型堆疊，自己指定 Arial/Helvetica**
     （2026-08-14 第三十六輪，使用者：「電腦版停車場的 P 好胖」，手機版沒事）。
     成因是**同一個 `font-weight: 800` 在不同系統落在不同地方**：
     iOS/macOS 的 PingFang TC 最重只到 Semibold，要 800 就給 Semibold；
     Windows 的微軟正黑只有 Regular/Bold，要 800 會**合成假粗體**
     （瀏覽器自己把字塗厚），再加上我們的描邊就腫成一塊。
     P 是拉丁字母，改指定 Arial／Helvetica —— 三個平台都有**真的 Bold**，
     不必合成，粗細因此各平台一致。
   ⚠ 描邊跟著從 2.2 收到 1.6：Arial Bold 本身就比 PingFang Semibold 重，
     維持 2.2 會變成另一種胖。`paint-order: stroke` 的道理不變（見下面）。
   ⚠ 這也更接近路上的停車標誌 —— 那個 P 本來就是無襯線的拉丁字。 */
.map-svg .pk    { font-family: Arial, Helvetica, "Helvetica Neue", sans-serif;
                  font-size: 31px; font-weight: 700; fill: var(--card); letter-spacing: 0; }
.map-svg .pk-s  { font-size: 28px; }                      /* 小一號的 P（頂三站那顆圓比較小） */
.map-svg .pk-nm { font-size: 22px; fill: var(--card); letter-spacing: .06em; }
.map-svg .nm    { font-size: 24px; letter-spacing: .08em; font-weight: 500; }

.map-note { margin-top: .5rem; font-size: .8rem; line-height: 1.7; color: var(--ink-soft); }
.card-map .map-note { max-width: 480px; margin-inline: auto; }
/* 撇清關係那一句自己一段、不加粗也不變色 —— 它是要看得到，不是要跳出來喊。
   ⚠ 不要用 --brick：這張卡上一個紅字都沒有，那顆紅在首頁本來就沒在用了
   （CLAUDE.md 第九節「看診時間本身」那一條）。 */
.mn-first { display: block; margin-bottom: .35rem; }

/* ---- 切換條（定案後整段刪掉）------------------------------------------ */
.sw {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: rgba(25,22,20,.93); color: #fff;
  padding: .55rem var(--pad) .8rem;
  font-size: .78rem; line-height: 1.5;
  max-height: 46vh; overflow-y: auto;
}
.sw div { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; margin-top: .3rem; }
.sw b { font-weight: 400; opacity: .62; width: 4.4em; flex: none; }
.sw button {
  font: inherit; cursor: pointer; padding: .2rem .6rem; border-radius: 8px;
  background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.32);
}
.sw button[aria-pressed="true"] { background: #fff; color: #191614; border-color: #fff; }
</style>
</head>

       其餘（比例、全名）退到第二段。⚠ 不要寫成「特約」「合作」以外的模糊說法，
       也不要順手加上費率、時段或「附近好停車」之類的話 —— 那些都不是我們能保證的。 -->
  <figcaption class="map-note"><span class="mn-first">圖中停車場均為周邊業者自行經營，與本診所無特約或合作關係；收費與計價方式請以各停車場現場標示為準。周邊路段另有畫設的路邊停車格，數量與位置會變動，圖上未逐一標示，請自行就近尋找，並依現場標線與告示停放。</span>點停車場看步行距離與時間（Google 地圖的實際值），以及該場的入口方向。街廓與距離大致依實際比例，標記本身放大以便閱讀。停車場全名：斗六永樂站停車場、合廷停車場、壹車房－中華路停車場。</figcaption>
</figure>
</template>

<!-- ⚠ 切換條與底下這支 JS 都是提案用的，定案後整段刪掉，不要跟著搬進 index.html -->
<div class="sw" id="sw">
  <div><b>畫法</b>
    <button data-k="style" data-v="line">線（路是線・定）</button>
    <button data-k="style" data-v="plate">面（白色的路）</button>
  </div>
  <div><b>放哪</b>
    <button data-k="pos" data-v="card">自成一張卡</button>
    <button data-k="pos" data-v="addr">收在地址卡裡</button>
  </div>
  <div><b>外框</b>
    <button data-k="shape" data-v="round">圓角方</button>
    <button data-k="shape" data-v="blob">有機色塊</button>
    <button data-k="shape" data-v="circle">正圓</button>
  </div>
  <div><b>診所</b>
    <button data-k="mark" data-v="plot">建物範圍（面）</button>
    <button data-k="mark" data-v="logo">圓標誌</button>
    <button data-k="mark" data-v="bean">設計稿的豆子</button>
  </div>
  <div><b>顏色</b>
    <button data-k="hue" data-v="green">一般牙科綠（定）</button>
    <button data-k="hue" data-v="brick">磚紅</button>
    <button data-k="hue" data-v="teal">深綠松</button>
    <button data-k="hue" data-v="moss">苔綠</button>
  </div>
  <div><b>導角</b>
    <button data-k="corner" data-v="edge">只導壓到街區角的（定）</button>
    <button data-k="corner" data-v="all">四角都導</button>
  </div>
  <div><b>街名</b>
    <button data-k="txt" data-v="soft">柔墨（定）</button>
    <button data-k="txt" data-v="ink">墨色</button>
    <button data-k="txt" data-v="fade">刷淡</button>
    <button data-k="txt" data-v="white">白字</button>
  </div>
  <div><b>街廓</b>
    <button data-k="block" data-v="warm">暖</button>
    <button data-k="block" data-v="cool">冷</button>
    <button data-k="block" data-v="deep">深</button>
  </div>
  <div><b>停車場</b>
    <button data-k="park" data-v="sign">路牌藍（定案）</button>
    <button data-k="park" data-v="off">不顯示</button>
  </div>
  <div><b>牌子</b>
    <button data-k="chip" data-v="outline">淺底・空心三角</button>
    <button data-k="chip" data-v="light">淺底・實心三角</button>
    <button data-k="chip" data-v="solid">藍底白字</button>
  </div>
  <div><b>診所名牌</b>
    <button data-k="clab" data-v="on">有</button>
    <button data-k="clab" data-v="off">沒有</button>
  </div>
</div>

<script>
(function () {
  var OPTS = {
    style: ['line', 'plate'],
    pos:   ['card', 'addr'],
    shape: ['round', 'blob', 'circle'],
    mark:  ['plot', 'logo', 'bean'],
    hue:   ['green', 'brick', 'teal', 'moss'],
    txt:   ['soft', 'ink', 'fade', 'white'],
    corner: ['edge', 'all'],
    block: ['warm', 'cool', 'deep'],
    park:  ['sign', 'off'],
    chip:  ['outline', 'light', 'solid'],
    clab:  ['on', 'off']
  };
  var root = document.documentElement;
  var tpl  = document.getElementById('map-tpl');
  var fig  = tpl.content.firstElementChild.cloneNode(true);
  var slot = document.getElementById('map-slot');
  var addr = document.getElementById('card-addr');
  var cardMap = document.getElementById('card-map');

  // 網址參數。⚠ 正規式要寫 [a-z0-9]+ —— 寫成 [a-z]+ 會吃不到帶數字的值，
  // 比對失敗後會悄悄退回預設，等於參數沒作用（CLAUDE.md 第九節，踩過一次）。
  var q = new URLSearchParams(location.search);
  Object.keys(OPTS).forEach(function (k) {
    var v = q.get(k);
    if (v && /^[a-z0-9]+$/.test(v) && OPTS[k].indexOf(v) >= 0) root.dataset[k] = v;
  });

  function apply() {
    // 位置：把同一個 figure 搬過去，不留兩份 DOM（id 才不會重複）
    if (root.dataset.pos === 'addr') { addr.appendChild(fig); cardMap.hidden = true; }
    else { slot.appendChild(fig); cardMap.hidden = false; }

    fig.querySelector('#map-clip')
       .setAttribute('clip-path', 'url(#clip-' + root.dataset.shape + ')');

    document.querySelectorAll('#sw button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(root.dataset[b.dataset.k] === b.dataset.v));
    });

    var p = new URLSearchParams();
    Object.keys(OPTS).forEach(function (k) { p.set(k, root.dataset[k]); });
    history.replaceState(null, '', location.pathname + '?' + p.toString());
  }

  // ---- 停車場的點選：點一下亮起來並帶出路線，再點一下收回 -----------------
  // 桌機另外吃 hover（預覽），滑開就回到「釘住」的那一個。
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var pinned = null, hovered = null;
  // 步行路線的圓點：沿著 .route 的幾何**等距**排。
  // ⚠ 間距是「總長 ÷ 四捨五入後的顆數」，所以每一條的間隔自己會是均勻的，
  //   起點與終點都剛好落一顆 —— 用 stroke-dasharray 做不到這件事（轉角會跳相位）。
  function buildDots() {
    fig.querySelectorAll('.route').forEach(function (path) {
      var g = fig.querySelector('.dots[data-lot="' + path.dataset.lot + '"]');
      if (!g) return;
      while (g.firstChild) g.removeChild(g.firstChild);
      var L = path.getTotalLength(), n = Math.max(2, Math.round(L / 14));
      for (var i = 0; i <= n; i++) {
        var pt = path.getPointAtLength(L * i / n);
        var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', pt.x.toFixed(2));
        c.setAttribute('cy', pt.y.toFixed(2));
        c.setAttribute('r', '3.5');
        g.appendChild(c);
      }
    });
  }
  buildDots();

  // 牌子的矩形與尾巴：用內容的實際外框現量（字級、字型、系統縮放都吃得到）
  // ⚠ 量的是 `.rl-body` 這個群組不是單一個 <text> —— 停車場那三塊現在有
  //   圖釘＋名字＋底線＋距離四樣東西。`getBBox()` 對群組回傳的是**含子元素
  //   transform 的聯集**，所以圖釘那個 scale() 也算得進去。
  // 圖釘原圖是 384x512（實心水滴，= 頁尾那顆）。先定高，寬按 .75 的比例跟著走。
  var PIN_H = 17, PIN_S = PIN_H / 512, PIN_W = 384 * PIN_S;

  // 字面下緣離基線多遠（單位＝該元素的 user unit）。量不到就回 null。
  var CTX = (function () {
    try { return document.createElement('canvas').getContext('2d'); } catch (e) { return null; }
  })();
  function inkDescent(el) {
    if (!CTX) return null;
    var cs = getComputedStyle(el), fs = parseFloat(cs.fontSize);
    if (!fs) return null;
    // 在 400px 上量再等比例縮回去（Blink 在小字級回來的值顆粒很粗）
    CTX.font = cs.fontStyle + ' ' + cs.fontWeight + ' 400px ' + cs.fontFamily;
    var m = CTX.measureText(el.textContent);
    if (typeof m.actualBoundingBoxDescent !== 'number') return null;
    return m.actualBoundingBoxDescent / 400 * fs;
  }
  // 「圓角方 ＋ 一支尾巴」畫成**一條**路徑 —— 這樣整塊只有一圈外框，
  // 描邊不會橫過尾巴根部（2026-08-14 第三十七輪，全空心那一案需要）。
  // ⚠ 走的方向固定是順時針：上邊 →、右邊 ↓、下邊 ←、左邊 ↑。
  //   尾巴插在哪一邊，那一邊的兩個端點就照該方向的順序寫，寫反會扭成蝴蝶結。
  function bubblePath(x, y, w, h, r, dir, tip, bc, bw) {
    var n = function (v) { return (+v).toFixed(2); };
    var x2 = x + w, y2 = y + h, A = 'A' + r + ' ' + r + ' 0 0 1 ';
    var d = 'M' + n(x + r) + ' ' + n(y);
    if (dir === 'up') d += 'H' + n(bc - bw) + 'L' + n(tip.x) + ' ' + n(tip.y) + 'L' + n(bc + bw) + ' ' + n(y);
    d += 'H' + n(x2 - r) + A + n(x2) + ' ' + n(y + r);
    if (dir === 'right') d += 'V' + n(bc - bw) + 'L' + n(tip.x) + ' ' + n(tip.y) + 'L' + n(x2) + ' ' + n(bc + bw);
    d += 'V' + n(y2 - r) + A + n(x2 - r) + ' ' + n(y2);
    if (dir === 'down') d += 'H' + n(bc + bw) + 'L' + n(tip.x) + ' ' + n(tip.y) + 'L' + n(bc - bw) + ' ' + n(y2);
    d += 'H' + n(x + r) + A + n(x) + ' ' + n(y2 - r);
    d += 'V' + n(y + r) + A + n(x + r) + ' ' + n(y) + 'Z';
    return d;
  }

  function sizeLabels() {
    // (1) 先把圖釘與底線擺到名字旁邊／底下 —— 它們的位置要等字量出來才知道
    fig.querySelectorAll('.rl-link').forEach(function (a) {
      var nm = a.querySelector('.rl-nm'), pin = a.querySelector('.rl-pin'), ul = a.querySelector('.rl-ul');
      var b = nm.getBBox();
      // 圖釘：字面中線對齊。⚠ 對的是 bbox 的中線不是基線 ——
      //   圖釘是個對稱的水滴，跟著基線走會整顆偏高。
      pin.setAttribute('transform',
        'translate(' + (b.x - PIN_W - 3).toFixed(2) + ' ' + (b.y + b.height / 2 - PIN_H / 2).toFixed(2) +
        ') scale(' + PIN_S.toFixed(5) + ')');
      // 底線自己畫，不用 text-decoration（各家瀏覽器位置不一致）。
      // ⚠⚠ **y 要對「字面」不是對 bbox**（2026-08-14 使用者：「底線和停車場
      //   名稱好像有點遠，是我的錯覺嗎」—— 不是錯覺）。
      //   SVG 文字的 `getBBox()` 高度是**字型的 ascent＋descent**，
      //   而中文方塊字用不到下伸部，所以 bbox 下緣比字的實際下緣低一截：
      //   Noto Sans TC 的 descent 約 .29em，16px 下就是 4.6 個單位的空白，
      //   再加 2.5 的間隙，底線等於離字 7.1 —— 看起來就是「有點遠」。
      //   改成用 canvas 量**字面**下緣（actualBoundingBoxDescent），
      //   底線落在字面下 1 個單位（16px 下離基線 3.75，原本是 6.0）。
      //   ⚠ 這個字型的字面下緣是 .172em（畫布逐像素掃出來 .157em，對得上）——
      //     中文方塊字大多平底停在基線上，只有像「車」那種豎筆會探下去，
      //     所以**眼睛量到的空隙比數字大**，間隙才要收到 1。
      // ⚠ 要在 400px 上量再等比例縮 —— Blink 回來的值顆粒很粗
      //   （CLAUDE.md 第九節第 9 條，量字面框那一段）。
      var d = inkDescent(nm);
      var uy = (+nm.getAttribute('y')) + (d === null ? b.y + b.height - +nm.getAttribute('y') + 2.5 : d + 1);
      ul.setAttribute('x1', b.x.toFixed(2));
      ul.setAttribute('x2', (b.x + b.width).toFixed(2));
      ul.setAttribute('y1', uy.toFixed(2));
      ul.setAttribute('y2', uy.toFixed(2));
    });
    // (2) 再量整塊內容，套上盒子與尾巴
    fig.querySelectorAll('.rlab, .clab').forEach(function (g) {
      var body = g.querySelector('.rl-body'), bub = g.querySelector('.bub'), tail = g.querySelector('.tail');
      var b = body.getBBox(), padX = 11, padY = 6;
      var bx0 = b.x - padX, by0 = b.y - padY, bw0 = b.width + padX * 2, bh0 = b.height + padY * 2;
      // 尾巴**停在離路線 GAP 的地方**，不要頂到線上（2026-08-14 使用者：
      // 「對話框還是跟路線黏在一起，分開一點」）。朝下或朝右兩種。
      // ⚠ 診所那一塊是 data-gap="0" —— 它的尖端要**進到綠色裡**，不是停在外面。
      var GAP = g.dataset.gap === undefined ? 12 : +g.dataset.gap;
      var dir = g.dataset.dir, tip, bc, bw = g.dataset.bw === undefined ? 7 : +g.dataset.bw;
      if (dir === 'right') {
        tip = { x: +g.dataset.tx - GAP, y: by0 + bh0 / 2 };
        bc = by0 + bh0 / 2;
      } else if (dir === 'up') {
        // 診所的名牌在下面、尖端朝上。⚠ GAP 的符號和朝下那一支相反：
        //   朝下是「尖端比目標高 GAP」，朝上是「尖端比目標低 GAP」。
        // ⚠ 底邊的位置（`data-bx`）和尖端（`data-tx`）**是分開給的**，
        //   兩個不一樣就會長出一支**斜的**尾巴（2026-08-14 使用者：
        //   「現在那個三角是做成往下，我想要左下一點，不要這麼直」）。
        //   沒給 data-bx 就退回正上方。
        tip = { x: +g.dataset.tx, y: +g.dataset.ty + GAP };
        bc = g.dataset.bx === undefined ? tip.x : +g.dataset.bx;
      } else {
        tip = { x: +g.dataset.tx, y: +g.dataset.ty - GAP };
        bc = g.dataset.bx === undefined ? tip.x : +g.dataset.bx;
      }
      bub.setAttribute('d', bubblePath(bx0, by0, bw0, bh0, 6, dir, tip, bc, bw));
      // 尾巴那個三角**另外再畫一次**，疊在盒子上面。
      // ⚠ 為的是「淺底＋實心藍三角」那一案：盒子是空心的、三角是實心的，
      //   兩件事沒辦法用同一條路徑表達。全空心的那一案就把它 display: none。
      if (dir === 'right') {
        tail.setAttribute('d', 'M' + (bx0 + bw0 - 1) + ' ' + (bc - bw) + 'V' + (bc + bw) + 'L' + tip.x + ' ' + tip.y + 'Z');
      } else if (dir === 'up') {
        tail.setAttribute('d', 'M' + (bc - bw) + ' ' + (by0 + 1) + 'H' + (bc + bw) + 'L' + tip.x + ' ' + tip.y + 'Z');
      } else {
        tail.setAttribute('d', 'M' + (bc - bw) + ' ' + (by0 + bh0 - 1) + 'H' + (bc + bw) + 'L' + tip.x + ' ' + tip.y + 'Z');
      }
    });
  }
  // 牌子上的連結：**一定要擋住冒泡** —— 地圖底層有一個「點空白處＝收回」的
  // handler，不擋的話點名字會先把牌子關掉，連結還沒開就沒了。
  fig.querySelectorAll('.rl-link').forEach(function (a) {
    a.addEventListener('click', function (e) { e.stopPropagation(); });
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeLabels);
  sizeLabels();

  // 被亮起來的那條路線／那塊牌子壓到的街名，這個模式下整個藏起來。
  // 兩個外框相交就算壓到（各留 2 個單位的餘裕）。
  function hideCovered(id) {
    var labels = fig.querySelectorAll('.lbl, .lbl-s, .lbl-xs, .ent');
    if (!id) { labels.forEach(function (l) { l.classList.remove('hide'); }); return; }
    // ⚠ 這裡用 getBoundingClientRect() 不是 getBBox()：
    //   `getBBox()` **不吃元素自己的 transform**，而入口箭頭是用
    //   `transform="translate() rotate()"` 擺位置的 —— 用 getBBox 比對，
    //   永樂站那顆的外框會停在原點附近，永遠比對不到（第一版就是這樣，沒作用）。
    //   螢幕座標對所有元素都一致，同一張 SVG 裡比對是安全的。
    var boxes = [];
    ['.dots', '.rlab'].forEach(function (sel) {
      var el = fig.querySelector(sel + '[data-lot="' + id + '"]');
      if (el) boxes.push(el.getBoundingClientRect());
    });
    labels.forEach(function (l) {
      var b = l.getBoundingClientRect();
      var hit = boxes.some(function (o) {
        return !(b.right < o.left - 2 || b.left > o.right + 2 ||
                 b.bottom < o.top - 2 || b.top > o.bottom + 2);
      });
      l.classList.toggle('hide', hit);
    });
  }

  function paintLots() {
    var id = hovered || pinned;
    fig.querySelector('.map-svg').classList.toggle('dim', !!id);
    hideCovered(id);
    fig.querySelectorAll('.lot').forEach(function (g) {
      var on = g.dataset.lot === id;
      g.classList.toggle('on', on);
      g.setAttribute('aria-pressed', String(g.dataset.lot === pinned));
    });
    fig.querySelectorAll('.dots, .rlab').forEach(function (el) {
      el.classList.toggle('on', el.dataset.lot === id);
    });
  }
  fig.querySelectorAll('.lot').forEach(function (g) {
    var id = g.dataset.lot;
    // ⚠ 點完 blur()：不然 Chrome 會把滑鼠點擊也算成 focus-visible，
    //   在停車場外面畫一個框（使用者 2026-08-14 回報）。鍵盤走過來的不受影響。
    g.addEventListener('click', function (e) {
      e.stopPropagation(); pinned = (pinned === id ? null : id); paintLots(); g.blur();
    });
    g.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pinned = (pinned === id ? null : id); paintLots(); }
    });
    if (fine) {
      g.addEventListener('mouseenter', function () { hovered = id; paintLots(); });
      g.addEventListener('mouseleave', function () { hovered = null; paintLots(); });
    }
  });
  // 點地圖的其他地方＝收回。
  // ⚠ 掛在 <figure> 上不是掛在 <svg> 上：SVG 的命中測試是**逐個圖形**做的，
  //   圓角裁切外面那一圈、以及任何沒有圖形畫在上面的位置都收不到事件。
  //   <figure> 是一般的 HTML 盒子，連圖說那幾行字一起算進來，整塊都收得回。
  //   ⚠ 停車場自己的 handler 有 stopPropagation，牌子上那三個連結也有，
  //     所以不會互踩。
  fig.addEventListener('click', function () { pinned = null; paintLots(); });
  paintLots();

  document.getElementById('sw').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    root.dataset[b.dataset.k] = b.dataset.v;
    apply();
  });

  apply();
})();
</script>
</body>
</html>
