     提案：診所資訊要不要放一張「簡易地圖」（2026-08-13）
     --------------------------------------------------------------------------
     兩批來源：

     一、**街廓怎麼排** —— 使用者提供的設計稿截圖（設計者「無事生活 吳曉柔」，
         同一張稿子底下就是診所那排品牌色點）。那張是圓形的示意地圖：白色的路、
         米灰色的街廓、紅色豆子標診所、藍色圓圈標停車場、三角形指「入口」。
         這一頁的街廓、停車場位置、入口方向全部照它。

     二、**版面與標示怎麼做** —— 使用者另外給了三個他覺得可以的樣式：
         ・hihi.funbrunch（IG「周邊停車資訊」）：粗筆觸的路、藍色 P、
           路邊停車格用淺藍長條、店家圖示、**底下一條圖例**
         ・starup.tw 星創牙醫：**路是淺藍灰的線**、底是米色、星號標診所＋名字、
           捷運出口與 U-bike 也標出來、停車場寫出名字
         ・sasugadental.com.tw 流石齒科：淺灰綠街廓＋白色的路、
           **診所是一顆圓形標誌**、停車場 P 圓標＋名字＋入口箭頭、地標圖示

         三個共同的做法，這一頁照做的：
           ① 版面是**方的**（設計稿是圓的，三個參考都不是）
           ② 診所與停車場都標上**名字**，不是一顆無名的色塊
           ③ 街名沿著路排（直的路就直排）
           ④ ~~底下一條圖例~~ —— **2026-08-13 使用者指定拿掉**（見最後一段）
         沒照做的一件：三個參考都標了周邊地標（超商、國小、公園、捷運出口）。
         **這一頁一個都沒有加** —— 設計稿上沒有，我也沒有查證過的資料，
         在地圖上寫錯一家店比不寫嚴重。要加請使用者指定要標哪幾個。

     ⚠ 這一頁是**自己寫的獨立頁**，不是 index.html 的複本（做法同
       /history/clinic-schedule.html）。所以 CLAUDE.md 第八節那四個陷阱
       只剩相對路徑要顧，而這一頁只用到 favicon，已經寫成 ../../。
     ⚠ **沒有掛 assets/counter.js，也沒有任何 data-views-self** —— 提案頁每開一次
       就會讓首頁的計數多一次，那是 2026-08-07 踩過的坑。

     ---- 街廓怎麼來的 ------------------------------------------------------
     照設計稿的拓樸關係重排，不是描圖：

       ・南北向（由西往東）：平和街 → 永樂街 → 永安路
       ・東西向（由北往南）：文化路 → **平和街19巷**（診所街區的北緣）
                             → 平和街12巷（西側）／永安路14巷（東側）
                             → 平和街33巷 → 大同路
       ・診所在**平和街與永樂街之間、19巷與33巷之間**那一個街廓裡，靠永樂街那一側。
         這和地址「永樂街 70 號」對得上 —— 門開在永樂街。
       ・往南依序是大同路、**中華路**（2026-08-13 補，見下面第三段）。
       ・停車場四處，見下面第三段。

     設計稿上「平和街12巷」與「永安路14巷」是兩條**不連續**的巷子，高度也差一點，
     所以這裡也沒有把它們接成同一條橫線。

     ---- 2026-08-13 補：平和街19巷（使用者提供 Google 地圖與街景截圖）--------
     設計稿上沒有畫這一條，但它就是**診所街區的北緣**，少了它那個街廓會大一倍、
     位置會讀錯。使用者給的兩張截圖：街景裡「平和街19巷 Lane 19, Pinghe St.」
     的路牌，以及 Google 地圖上診所（芳仁牙醫診所）那一格的四周。照那張地圖改了三件：

       ① **19巷**：從平和街往東接到永樂街（x 204→408），y 236~258。
          西側的 12 巷是**另一條**（偶數在西、奇數在東），維持原樣不動。
       ② **永安路14巷往下移**：Google 上它比 19 巷低一點（不是高），
          214 → 266，東邊那個 P 跟著移到 (492, 330)。
          ⚠ 那顆 P 的 x 是被「線」那一案逼出來的：line 會把「入口」兩個字
            往右推 36 個單位（見下一段），落在 x 411~441，P 原本在 470
            （左緣 443）只剩 2 個單位的空隙，兩顆東西看起來會黏在一起。
       ③ **診所往東、往南各挪一點**：Google 上那支圖釘貼著永樂街、
          而且離 33 巷比離 19 巷近。圓心 (272,328) → (296,336)。

     ⚠ 這是目前唯一一條**從 Google 地圖補進來、設計稿上沒有**的資訊。
       其餘街廓仍以設計稿為準（兩者的路網一致）。
     ⚠ 「平和街12巷」那個標籤因此往下移到 y 320 —— 原本在 286，
       和「頂三站」那顆停車場的名字（130~196）重疊了 44 個單位。

     ---- 2026-08-13 再補：中華路 ＋ 四處停車場的名字 ----------------------
     使用者：「中華路有一個比較大的停車場，也要畫進來，街區和道路再加進來。」
     來源是他提供的第三張截圖：Google 地圖搜尋「停車場」的衛星圖。

     版面往南長了一段（文化路 96→52、大同路 536→486，騰出中華路那一排街廓）：

       文化路 52 ・ 19巷 216 ・ 12巷 226 ・ 14巷 246 ・ 33巷 404
       ・ 大同路 486 ・ **中華路 574（高 40，是這幾條裡最寬的）**

     ⚠ **垂直方向刻意不照實際比例。** 真實比例上「大同路→中華路」大約是
       「33巷→大同路」的 2.6 倍，照著畫的話診所那個街廓會被壓成一條，
       而整張圖最下面會空出一大塊。這是示意圖（圖說也寫了「非按實際比例」），
       版面以**診所那一格看得清楚**為優先。日後要改成等比例，
       記得同時把診所的圓標誌與名字縮一階，不然塞不下。

     四處停車場（名字都出自那張衛星圖，圖上只寫得下簡稱，全名在圖說那一行）：

       頂三站       19 巷以北那一排街廓、靠平和街        56×46
       斗六永樂站   同一排、靠永樂街                     68×46
       合廷         永樂街以東、14 巷以南                74×46
       壹車房       中華路上、永樂街以東                 **112×42，最大**

     ⚠ **Times 永安店沒有畫** —— 它在永安路以東，超出這張圖的範圍。
       要收進來的話整張圖的東西向要再拉寬一格。

     ---- 兩種畫法（切換條的第一項）----------------------------------------
     同一組街廓幾何，只換兩個變數，不必畫兩份：

       面 plate   底＝街廓色，路＝卡色       流石齒科那一種
       線 line    底＝卡色，路＝--rule       星創牙醫那一種（路變成線，街廓消失）

     ⚠ 兩案的字都站在夠亮的底上：街名是墨色（9.11~11.9:1），
       停車場的 P 與名字是白字站在深藍上（13.5:1）。

     ---- 顏色（一顆都沒有新增）--------------------------------------------
       路／底  --card #f4f4f5 與街廓色互換     街名  --ink #2a2c27
       診所    --teal／--brick／--moss（切換）  停車場 --tile #252d4a（診間地磚）

     ⚠ **街名用 --ink 不是 --ink-soft**，這是量出來的：柔墨 #5c5f57 站在街廓上
       只有 4.20（冷）／4.20（暖）／3.90（深）:1，三案都低於 AA 的 4.5；
       換成墨色是 9.11／9.12／8.46:1。地圖上的字比內文更需要看得清楚。
     ⚠ 診所那顆圓標誌與豆子是**填色的塊、不是字**，不受文字對比度限制；
       名字「芳仁牙醫」則是墨色，站在街廓上 8.46~9.12:1。
     ⚠ 標誌本體直接用站上頁首那條原廠向量（assets/favicon.svg 同一條路徑）。
       ⚠ 但**不要**把 favicon.svg 整個 <img> 進來 —— 那個檔自己帶 <style> 與
         prefers-color-scheme，深色模式會變成另一個綠，和圓底打架。

     街廓三案（括號是路面 vs 街廓的對比，只有「面」用得到）：
       冷 cool  --rule #cdd0d2                 1.41:1  站上既有的線色
       暖 warm  --stool 16% 混進紙色 #d4cfca   1.41:1  最接近設計稿的米灰
       深 deep  --stool 22% 混進紙色 #cfc7c0   1.52:1  路最清楚，整張偏重
     ⚠ **不要用紙色 --paper 當街廓** —— 量過是 1.15:1，路幾乎消失。

     ---- 這一頁要決定的事 --------------------------------------------------
     底下的切換條一項一顆開關，網址也吃參數（?style=plate&mark=logo…）：

       style  畫法：面（街廓）／線（路）
       pos    放哪：自成一張卡（整列）／收在地址卡裡
       shape  外框：圓角方（12px 那一族）／有機色塊（設計稿那一種）／正圓
       mark   診所：建物範圍（面）／圓標誌／設計稿的豆子
       hue    診所那一塊的顏色：磚紅／深綠松／苔綠
       block  街廓底色：暖／冷／深
       park   停車場：地磚深藍／矯正藍／柔墨／不顯示

     ---- 2026-08-13 第三輪：拿掉圖例與入口，圖示改成「面」----------------
     使用者：「不用圖例，入口的字和標示拿掉。參考照片的停車場和診所區域，
     把簡易地圖上的診所和停車場改成像附圖的多邊形圖示。」

       ・**圖例整條刪掉**（`.map-key` 的 HTML／CSS／切換條那一項都拿掉了）。
       ・**入口的三角形與「入口」兩個字都刪掉**。連帶好處：永樂街那一段路面
         空出來了，直排的街名因此從 y142 搬到 y300，
         北邊那兩座停車場的名字才擺得下（原本和街名疊在一起）。
       ・**診所與停車場都改成有面積的塊**（`data-mark="plot"`，新的預設）：
         停車場是場地本身的範圍、裡面壓一個白色的 P；診所是建物範圍、
         裡面壓白色的標誌。圓標誌與設計稿的豆子都留在切換條裡可以對照。
       ・**頂三站從診所那個街廓搬到 19 巷以北**：第四張衛星圖上兩顆 P
         都在文化路與 19 巷之間那一排，一西一東。

     ⚠ **預設顏色因此從深綠松改成磚紅。** 停車場現在也是深色的面，
       深綠松（L\* 29）對地磚深藍（L\* 18）在這個尺寸下分不出來，
       一眼會以為診所也是停車場。設計稿本來就是紅標診所、藍標停車場。
       要換回深綠松請先想清楚怎麼和停車場區分（例如停車場改用柔墨那一案）。

     ---- 2026-08-13 第四輪：改成橫式、往右涵括、路分兩級 -----------------
     使用者：「地圖的尺寸可以變長方形。另外停車場和診所比較集中在中間和右邊，
     所以整個地圖區域可以往右涵括，把診所停車場移到畫面左邊一點的位置。
     道路只要留標示的就好：文化路、平和街19巷、大同路、中華路、平和街、
     永樂街、永安路，其他道路或街巷改細一點且不用標路名。」

       ・**版面 640×560 正方 → 780×560 橫式**（比例 1.39）。
         `.map-svg` 的 max-width 跟著從 460 放到 620。
         ⚠ 同樣的顯示寬度下，viewBox 一個單位變小了，所以街名字級
           26→30、小標 23→26、診所名 27→32。手機 295px 上量到約 11px，
           和改版前一樣。
       ・**整組往左搬 30 個單位**（那一層 translate），畫面右邊因此多露出
         東側 30 個單位 —— 加上版面本來就變寬，**Times 永安店這一輪收進來了**
         （上一版它在框外）。
       ・**路分兩級**：有標名字的粗（32/36，19 巷 20），
         沒標名字的細（12）。細的是 12 巷、14 巷、33 巷，**一律不標路名**。
         它們留著是為了街廓的形狀對，不是為了指路。
       ・**永樂街與永安路之間那一格改窄**：衛星圖上它大約是
         平和街～永樂街那一格的一半（145 : 298），舊版畫成 166 : 204 太寬。

     ⚠ 圓角方以外那兩個外框（有機色塊、正圓）是為 640×640 畫的，
       這一輪用 transform 把它們拉成橫的（blob 乘 1.21875×0.875，
       正圓改成同比例的橢圓）。要再改版面尺寸，這兩個係數要一起換。

     ⚠ 定案之後**切換條與所有 data-* 一起刪掉**，只把選上的那一案搬進 index.html，

<style>
:root {
  --pad: clamp(1.25rem, 3vw, 2.5rem);
  --shell: 1160px;

  --paper: #e2e5e6;
  --card:  #f4f4f5;
  --rule:  #cdd0d2;
  --ink:   #2a2c27;
  --ink-soft: #5c5f57;

  --teal:  #214D48;
  --taupe: #7D5A58;
  --moss:  #5D6D55;
  --brick: #AF4C52;
  --stool: #8d5e3a;
  --tile:  #252d4a;

  /* 地圖自己的值，全部指回上面那些變數 */
  --map-block: #d4cfca;
  --map-bg:    var(--map-block);
  --map-road:  var(--card);
  --map-ink:   var(--ink);
  --map-mark:  var(--teal);
  --map-park:  var(--tile);
}
/* 兩種畫法 ＝ 底與路互換 */
html[data-style="plate"] { --map-bg: var(--map-block); --map-road: var(--card); }
html[data-style="line"]  { --map-bg: var(--card);      --map-road: var(--rule); }

html[data-block="cool"] { --map-block: var(--rule); }   /* #cdd0d2 */
html[data-block="warm"] { --map-block: #d4cfca; }       /* 凳子的褐 16% 混進紙色 */
html[data-block="deep"] { --map-block: #cfc7c0; }       /* 同上，22% */
html[data-hue="brick"]  { --map-mark: var(--brick); }
html[data-hue="teal"]   { --map-mark: var(--teal); }
html[data-hue="moss"]   { --map-mark: var(--moss); }
html[data-park="tile"]  { --map-park: var(--tile); }
html[data-park="ortho"] { --map-park: #4478b5; }        /* 齒顎矯正的套色 */
html[data-park="ink"]   { --map-park: var(--ink-soft); }
html[data-park="off"]   .map-park { display: none; }
/* 三案二不顯示。⚠ 預設是 plot（面），和停車場同一種語彙 */
html[data-mark="plot"] .mark-logo, html[data-mark="plot"] .mark-bean { display: none; }
html[data-mark="logo"] .mark-plot, html[data-mark="logo"] .mark-bean { display: none; }
html[data-mark="bean"] .mark-plot, html[data-mark="bean"] .mark-logo { display: none; }

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans TC",
               system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.85; letter-spacing: .01em;
}
.shell { max-width: var(--shell); margin-inline: auto; padding-inline: var(--pad); }
main { padding-block: 2.4rem 12rem; }
h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 .4rem; letter-spacing: .04em; }
.lead { margin: 0 0 2rem; font-size: .9rem; line-height: 1.9; color: var(--ink-soft); max-width: 46em; }
h2 { font-size: 1.25rem; font-weight: 500; margin: 0 0 1.1rem; letter-spacing: .05em; }

/* ---- 底下這一段是 index.html「診所資訊」那一節的複本，只留這一頁用得到的 ---- */
.info { display: grid; gap: 1.2rem; grid-template-columns: repeat(2, 1fr); }
.info-card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
  padding: 1.1rem 1.2rem 1.2rem; min-width: 0;
}
.info-card h3 {
  display: inline-block; margin: 0 0 .55rem;
  font-size: .76rem; font-weight: 400; letter-spacing: .08em; line-height: 1.6;
  padding: .07rem .65rem; border-radius: 9px;
  background: var(--teal); color: #fff;
}
.info-card p { margin: 0; font-size: .93rem; line-height: 1.8; }
.info-card .big {
  display: inline-block; margin-top: .15rem;
  background: #dbe0e0; border-radius: 10px;
  padding: .3rem .85rem; font-size: 1.2rem; letter-spacing: .04em;
}
.info-card .big a { color: var(--teal); text-decoration: none; }
.info-card a { color: var(--teal); }
.card-map { grid-column: 1 / -1; }
/* ≤720 的地方 .info 收成一欄（同 index.html 的斷點），地圖才不會被擠成
   150px 寬 —— 那個寬度上街名只剩 5.7px，等於整張圖只剩形狀。 */
@media (max-width: 720px) { .info { grid-template-columns: 1fr; } }

/* ---- 地圖本體 ---------------------------------------------------------- */
.map-fig { margin: 0; }
.info-card .map-fig { margin-top: .9rem; }   /* 收在地址卡裡的時候接在地址下面 */
.map-svg { display: block; width: 100%; height: auto; max-width: 620px; font-family: inherit; }
.card-map .map-svg { max-width: 620px; margin-inline: auto; }
.map-svg text { fill: var(--map-ink); font-weight: 400; }
.map-svg .lbl   { font-size: 30px; letter-spacing: .06em; }
.map-svg .lbl-s { font-size: 26px; letter-spacing: .04em; }
.map-svg .pk    { font-size: 34px; fill: var(--card); letter-spacing: 0; }
.map-svg .pk-s  { font-size: 30px; }                      /* 小一號的 P（頂三站那顆圓比較小） */
.map-svg .pk-nm { font-size: 22px; fill: var(--card); letter-spacing: .06em; }
.map-svg .nm    { font-size: 32px; letter-spacing: .08em; font-weight: 500; }

.map-note { margin-top: .5rem; font-size: .8rem; line-height: 1.7; color: var(--ink-soft); }
.card-map .map-note { max-width: 620px; margin-inline: auto; }

/* ---- 切換條（定案後整段刪掉）------------------------------------------ */
.sw {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: rgba(25,22,20,.93); color: #fff;
  padding: .55rem var(--pad) .8rem;
  font-size: .78rem; line-height: 1.5;
  max-height: 46vh; overflow-y: auto;
}
.sw div { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; margin-top: .3rem; }
.sw b { font-weight: 400; opacity: .62; width: 4.4em; flex: none; }
.sw button {
  font: inherit; cursor: pointer; padding: .2rem .6rem; border-radius: 8px;
  background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.32);
}
.sw button[aria-pressed="true"] { background: #fff; color: #191614; border-color: #fff; }
</style>
</head>

<body>
<main class="shell">
  <h1>提案：診所簡易地圖</h1>
  <p class="lead">
    街廓照設計稿，版面與標示照你給的三個樣式：方的版面、診所用圓形標誌加名字、
    街名沿著路排、底下一條圖例。顏色全部取自站上既有的色票，沒有新增任何色值。
    第一列可以切換兩種畫法 ——「面」是流石齒科那一種（白色的路），
    「線」是星創牙醫那一種（路變成淺藍灰的線）。
  </p>

  <h2>診所資訊</h2>
  <div class="info">
    <div class="info-card" id="card-addr">
      <h3>地址</h3>
      <p>雲林縣斗六市永樂街 70 號<br>
        <a href="https://www.google.com/maps/search/?api=1&amp;query=%E8%8A%B3%E4%BB%81%E7%89%99%E9%86%AB%E8%A8%BA%E6%89%80%20%E9%9B%B2%E6%9E%97%E7%B8%A3%E6%96%97%E5%85%AD%E5%B8%82%E6%B0%B8%E6%A8%82%E8%A1%9770%E8%99%9F" rel="noopener">在 Google 地圖開啟</a></p>
    </div>

    <div class="info-card">
      <h3>電話</h3>
      <p class="big"><a href="tel:+88655339369"><data value="05-533-9369">(05)5339-369</data></a></p>
    </div>

    <div class="info-card card-map" id="card-map">
      <h3>簡易地圖</h3>
      <div id="map-slot"></div>
    </div>
  </div>
</main>

<!-- 地圖本體。JS 會照 data-pos 把它搬進「地址卡」或「自己那張卡」。
     viewBox 640×640；街廓、路寬、標記位置全部寫在這裡，改一個數字就整張跟著動。 -->
<template id="map-tpl">
<figure class="map-fig">
  <svg class="map-svg" viewBox="0 0 780 560" role="img" aria-labelledby="mt md">
    <title id="mt">芳仁牙醫診所簡易地圖</title>
    <desc id="md">診所位在永樂街上、平和街與永樂街之間的街廓內，北緣是平和街19巷，再往北是文化路，往南依序是大同路與中華路；附近有五處停車場：19巷以北的頂三站與斗六永樂站、永樂街以東的合廷、永安路以東的 Times 永安店，以及中華路上場地較大的壹車房。</desc>

    <defs>
      <!-- 三種外框。有機色塊那一條是極座標八個點轉成的封閉貝茲曲線：
           四個角的半徑比上下左右大，所以它是一顆會呼吸的圓角方 ——
           和設計稿上那排色點同一種語彙。
           ⚠ 2026-08-13 第四輪版面改成 780×560 的橫式（使用者指定），
             有機色塊與正圓那兩條都是為 640×640 的正方形畫的，
             這裡用 preserveAspectRatio="none" 的縮放把它們拉成橫的
             （寫在 transform 上：780/640 × 560/640）。 -->
      <clipPath id="clip-blob"><path transform="scale(1.21875 0.875)" d="M320 18C398.02 17.76 504.76 34.91 554.76 85.24C604.76 135.57 620.47 242.22 620 320C619.53 397.78 601.93 500.93 551.93 551.93C501.93 602.93 398.02 625.29 320 626C241.98 626.71 133.49 607.17 83.83 556.17C34.16 505.17 21.53 398.25 22 320C22.47 241.75 36.99 136.99 86.65 86.65C136.32 36.32 241.98 18.24 320 18Z"/></clipPath>
      <clipPath id="clip-circle"><ellipse cx="390" cy="280" rx="387" ry="277"/></clipPath>
      <clipPath id="clip-round"><rect x="0" y="0" width="780" height="560" rx="18"/></clipPath>
    </defs>

    <g id="map-clip" clip-path="url(#clip-round)">
      <rect width="780" height="560" fill="var(--map-bg)"/>

      <!-- ⚠ 這一層 translate 是 2026-08-13 第四輪加的：使用者說
           「停車場和診所比較集中在中間和右邊，整個地圖區域可以往右涵括，
             把診所停車場移到畫面左邊一點的位置」。
           往左搬 30 個單位 ＝ 畫面右邊多露出 30 個單位的東側。
           ⚠ 橫的路因此都畫成 x=-60、寬 900（原本 0~780）——
             不加寬的話右緣會禿掉 30 個單位。底色那一塊不在這一層裡。 -->
      <g transform="translate(-30 0)">

      <!-- 路。2026-08-13 第四輪照使用者指定分成兩級：
           **有標名字的畫粗**（文化路／大同路／中華路／平和街／永樂街／永安路，
           以及 19 巷因為要標名字所以走中間的 20），
           **沒標名字的畫細**（12巷／14巷／33巷，高 12，等於粗路的三分之一強）。
           ⚠ 細的那三條**刻意不標路名** —— 使用者：「其他道路或街巷改細一點
             且不用標路名」。它們留著是為了讓街廓的形狀對，不是為了指路。 -->
      <g fill="var(--map-road)">
        <rect x="80"  y="0"   width="32"  height="560"/><!-- 平和街 -->
        <rect x="378" y="0"   width="32"  height="560"/><!-- 永樂街 -->
        <rect x="521" y="0"   width="36"  height="560"/><!-- 永安路 -->
        <rect x="-60" y="44"  width="900" height="32"/> <!-- 文化路 -->
        <rect x="-60" y="424" width="900" height="32"/> <!-- 大同路 -->
        <rect x="-60" y="500" width="900" height="36"/> <!-- 中華路 -->
        <rect x="112" y="186" width="266" height="20"/> <!-- 平和街19巷 -->
        <rect x="-60" y="196" width="172" height="12"/> <!-- 細：平和街12巷 -->
        <rect x="378" y="212" width="462" height="12"/> <!-- 細：永安路14巷 -->
        <rect x="-60" y="352" width="470" height="12"/> <!-- 細：平和街33巷 -->
      </g>

      <!-- 街名。七條，就是使用者指定要留的那幾條。
           橫的寫在路面上，直的沿著路排（一個字一個 tspan，
           不用 writing-mode —— Safari 對 SVG 的直排支援不齊）。 -->
      <text class="lbl" x="250" y="70"  text-anchor="middle">文化路</text>
      <text class="lbl" x="250" y="450" text-anchor="middle">大同路</text>
      <text class="lbl" x="250" y="528" text-anchor="middle">中華路</text>
      <text class="lbl" x="96"  y="280" text-anchor="middle"><tspan x="96">平</tspan><tspan x="96" dy="34">和</tspan><tspan x="96" dy="34">街</tspan></text>
      <text class="lbl" x="394" y="280" text-anchor="middle"><tspan x="394">永</tspan><tspan x="394" dy="34">樂</tspan><tspan x="394" dy="34">街</tspan></text>
      <text class="lbl" x="539" y="130" text-anchor="middle"><tspan x="539">永</tspan><tspan x="539" dy="34">安</tspan><tspan x="539" dy="34">路</tspan></text>
      <!-- 19 巷上下都是停車場與診所，沒有空位，所以字直接壓在巷子上 -->
      <text class="lbl-s" x="245" y="203" text-anchor="middle">平和街19巷</text>

      <!-- 停車場。五處，位置與名字出自使用者提供的 Google 衛星圖。
           畫的是**場地本身的範圍**（面），裡面壓一個白色的 P，名字寫在塊外面。
           ⚠ 塊的大小是有意義的：壹車房最大（使用者說它「比較大」）。
           ⚠ Times 永安店是這一輪才收進來的 —— 版面往右拉寬之後
             （640×640 → 780×560），永安路以東那一格進到畫面裡了。 -->
      <g class="map-park">
        <!-- 頂三站停車場 -->
        <rect x="140" y="92" width="64" height="44" rx="4" fill="var(--map-park)"/>
        <text class="pk pk-s" x="172" y="123" text-anchor="middle">P</text>
        <text class="lbl-s" x="172" y="166" text-anchor="middle">頂三站</text>

        <!-- 斗六永樂站停車場 -->
        <rect x="272" y="92" width="78" height="44" rx="4" fill="var(--map-park)"/>
        <text class="pk pk-s" x="311" y="123" text-anchor="middle">P</text>
        <text class="lbl-s" x="311" y="166" text-anchor="middle">斗六永樂站</text>

        <!-- 合廷停車場 -->
        <rect x="432" y="250" width="74" height="44" rx="4" fill="var(--map-park)"/>
        <text class="pk pk-s" x="469" y="281" text-anchor="middle">P</text>
        <text class="lbl-s" x="469" y="324" text-anchor="middle">合廷</text>

        <!-- Times 永安店停車場（永安路以東） -->
        <rect x="576" y="250" width="80" height="44" rx="4" fill="var(--map-park)"/>
        <text class="pk pk-s" x="616" y="281" text-anchor="middle">P</text>
        <text class="lbl-s" x="616" y="324" text-anchor="middle">Times 永安店</text>

        <!-- 壹車房－中華路停車場（塊最大） -->
        <rect x="414" y="462" width="100" height="32" rx="4" fill="var(--map-park)"/>
        <text class="pk pk-s" x="436" y="487" text-anchor="middle">P</text>
        <text class="lbl-s" x="404" y="487" text-anchor="end">壹車房</text>
      </g>

      <!-- 診所。三案（data-mark）：
           ・plot ＝ 預設：建物範圍的多邊形，裡面壓白色的標誌。
                    和停車場同一種語彙（面），只有顏色不同。
           ・logo ＝ 圓形標誌　・bean ＝ 設計稿上那顆豆子
           名字「芳仁牙醫」三案共用，寫在塊的下面。
           ⚠ 名字置中在 x=292 不是塊的正中（348）—— 置中在塊上會撞到
             直排的「永樂街」（x 379~409），現在兩者之間留 23 個單位。 -->
      <g class="mark-plot">
        <rect x="320" y="244" width="56" height="56" rx="4" fill="var(--map-mark)"/>
        <g transform="translate(325.9 261.1) translate(-232.8729 -333.8286)">
          <path fill="var(--card)" fill-rule="evenodd" d="M 240.117188 354.414062 C 241.84375 355.789062 245.367188 356.175781 248.933594 354.648438 C 253.785156 352.566406 257.820312 353.464844 261.925781 354.910156 C 263.128906 355.332031 267.371094 356.449219 270.015625 354.707031 C 273.160156 352.636719 280.171875 343.027344 275.722656 337.023438 C 272.015625 332.023438 266.25 334.273438 265.015625 334.714844 C 260.597656 336.296875 252.972656 338.09375 243.207031 334.503906 C 241.492188 333.875 235.996094 332.605469 233.613281 337.023438 C 231.050781 341.777344 235.609375 350.816406 240.117188 354.414062 Z M 264.0408 352.2025 C 264.3658 352.1061 264.4877 352.0857 264.8025 352.2025 C 265.0158 352.2838 265.3002 352.2686 265.5135 352.2025 C 266.1939 351.9893 266.8693 350.6436 266.7424 348.9322 C 266.6205 347.2209 262.2127 347.4596 262.2178 348.9322 C 262.2178 350.1053 262.6393 351.6186 263.2232 352.0299 C 263.4721 352.2076 263.6549 352.3143 264.0408 352.2025 Z"/>
        </g>
      </g>

      <g class="mark-logo">
        <circle cx="348" cy="272" r="34" fill="var(--map-mark)"/>
        <g transform="translate(325.9 261.1) translate(-232.8729 -333.8286)">
          <path fill="var(--card)" fill-rule="evenodd" d="M 240.117188 354.414062 C 241.84375 355.789062 245.367188 356.175781 248.933594 354.648438 C 253.785156 352.566406 257.820312 353.464844 261.925781 354.910156 C 263.128906 355.332031 267.371094 356.449219 270.015625 354.707031 C 273.160156 352.636719 280.171875 343.027344 275.722656 337.023438 C 272.015625 332.023438 266.25 334.273438 265.015625 334.714844 C 260.597656 336.296875 252.972656 338.09375 243.207031 334.503906 C 241.492188 333.875 235.996094 332.605469 233.613281 337.023438 C 231.050781 341.777344 235.609375 350.816406 240.117188 354.414062 Z M 264.0408 352.2025 C 264.3658 352.1061 264.4877 352.0857 264.8025 352.2025 C 265.0158 352.2838 265.3002 352.2686 265.5135 352.2025 C 266.1939 351.9893 266.8693 350.6436 266.7424 348.9322 C 266.6205 347.2209 262.2127 347.4596 262.2178 348.9322 C 262.2178 350.1053 262.6393 351.6186 263.2232 352.0299 C 263.4721 352.2076 263.6549 352.3143 264.0408 352.2025 Z"/>
        </g>
      </g>

      <g class="mark-bean">
        <path fill="var(--map-mark)" transform="translate(344 272) scale(.62)"
              d="M62 0C61.76 12.96 48.52 30.52 38.18 38.18C27.85 45.85 12.85 45.88 0 46C-12.85 46.12 -28.89 46.56 -38.89 38.89C-48.89 31.22 -60.35 12.61 -60 0C-59.65 -12.61 -46.77 -28.94 -36.77 -36.77C-26.77 -44.6 -12.73 -46.53 0 -47C12.73 -47.47 29.26 -47.43 39.6 -39.6C49.93 -31.76 62.24 -12.96 62 0Z"/>
        <circle cx="329" cy="261" r="6" fill="var(--card)"/>
      </g>

      <text class="nm" x="292" y="336" text-anchor="middle">芳仁牙醫</text>
      </g><!-- /translate -->
    </g>
  </svg>

  <figcaption class="map-note">示意圖，非按實際比例。停車場全名：頂三站停車場、斗六永樂站停車場、合廷停車場、Times 永安店、壹車房－中華路停車場。</figcaption>
</figure>
</template>

<!-- ⚠ 切換條與底下這支 JS 都是提案用的，定案後整段刪掉，不要跟著搬進 index.html -->
<div class="sw" id="sw">
  <div><b>畫法</b>
    <button data-k="style" data-v="plate">面（白色的路）</button>
    <button data-k="style" data-v="line">線（路是線）</button>
  </div>
  <div><b>放哪</b>
    <button data-k="pos" data-v="card">自成一張卡</button>
    <button data-k="pos" data-v="addr">收在地址卡裡</button>
  </div>
  <div><b>外框</b>
    <button data-k="shape" data-v="round">圓角方</button>
    <button data-k="shape" data-v="blob">有機色塊</button>
    <button data-k="shape" data-v="circle">正圓</button>
  </div>
  <div><b>診所</b>
    <button data-k="mark" data-v="plot">建物範圍（面）</button>
    <button data-k="mark" data-v="logo">圓標誌</button>
    <button data-k="mark" data-v="bean">設計稿的豆子</button>
  </div>
  <div><b>顏色</b>
    <button data-k="hue" data-v="brick">磚紅</button>
    <button data-k="hue" data-v="teal">深綠松</button>
    <button data-k="hue" data-v="moss">苔綠</button>
  </div>
  <div><b>街廓</b>
    <button data-k="block" data-v="warm">暖</button>
    <button data-k="block" data-v="cool">冷</button>
    <button data-k="block" data-v="deep">深</button>
  </div>
  <div><b>停車場</b>
    <button data-k="park" data-v="tile">地磚深藍</button>
    <button data-k="park" data-v="ortho">矯正藍</button>
    <button data-k="park" data-v="ink">柔墨</button>
    <button data-k="park" data-v="off">不顯示</button>
  </div>
</div>

<script>
(function () {
  var OPTS = {
    style: ['plate', 'line'],
    pos:   ['card', 'addr'],
    shape: ['round', 'blob', 'circle'],
    mark:  ['plot', 'logo', 'bean'],
    hue:   ['brick', 'teal', 'moss'],
    block: ['warm', 'cool', 'deep'],
    park:  ['tile', 'ortho', 'ink', 'off']
  };
  var root = document.documentElement;
  var tpl  = document.getElementById('map-tpl');
  var fig  = tpl.content.firstElementChild.cloneNode(true);
  var slot = document.getElementById('map-slot');
  var addr = document.getElementById('card-addr');
  var cardMap = document.getElementById('card-map');

  // 網址參數。⚠ 正規式要寫 [a-z0-9]+ —— 寫成 [a-z]+ 會吃不到帶數字的值，
  // 比對失敗後會悄悄退回預設，等於參數沒作用（CLAUDE.md 第九節，踩過一次）。
  var q = new URLSearchParams(location.search);
  Object.keys(OPTS).forEach(function (k) {
    var v = q.get(k);
    if (v && /^[a-z0-9]+$/.test(v) && OPTS[k].indexOf(v) >= 0) root.dataset[k] = v;
  });

  function apply() {
    // 位置：把同一個 figure 搬過去，不留兩份 DOM（id 才不會重複）
    if (root.dataset.pos === 'addr') { addr.appendChild(fig); cardMap.hidden = true; }
    else { slot.appendChild(fig); cardMap.hidden = false; }

    fig.querySelector('#map-clip')
       .setAttribute('clip-path', 'url(#clip-' + root.dataset.shape + ')');

    document.querySelectorAll('#sw button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(root.dataset[b.dataset.k] === b.dataset.v));
    });

    var p = new URLSearchParams();
    Object.keys(OPTS).forEach(function (k) { p.set(k, root.dataset[k]); });
    history.replaceState(null, '', location.pathname + '?' + p.toString());
  }

  document.getElementById('sw').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    root.dataset[b.dataset.k] = b.dataset.v;
    apply();
  });

  apply();
})();
</script>
</body>
</html>
