:root {

/* ---- 切換條（定案後整段刪掉）------------------------------------------ */
.sw {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: rgba(25,22,20,.93); color: #fff;
  padding: .55rem var(--pad) .8rem;
  font-size: .78rem; line-height: 1.5;
  max-height: 46vh; overflow-y: auto;
}
.sw div { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; margin-top: .3rem; }
.sw b { font-weight: 400; opacity: .62; width: 4.4em; flex: none; }
.sw button {
  font: inherit; cursor: pointer; padding: .2rem .6rem; border-radius: 8px;
  background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.32);
}
.sw button[aria-pressed="true"] { background: #fff; color: #191614; border-color: #fff; }
</style>

<body>
<main class="shell">
  <h1>提案：診所簡易地圖</h1>
  <p class="lead">
    街廓照設計稿，版面與標示照你給的三個樣式：方的版面、診所用圓形標誌加名字、
    街名沿著路排、底下一條圖例。顏色全部取自站上既有的色票，沒有新增任何色值。
    第一列可以切換兩種畫法 ——「面」是流石齒科那一種（白色的路），
    「線」是星創牙醫那一種（路變成淺藍灰的線）。
  </p>

  <h2>診所資訊</h2>

    <div class="info-card" id="card-addr">
      <h3>地址</h3>
      <p>雲林縣斗六市永樂街 70 號<br>
        <a href="https://www.google.com/maps/search/?api=1&amp;query=%E8%8A%B3%E4%BB%81%E7%89%99%E9%86%AB%E8%A8%BA%E6%89%80%20%E9%9B%B2%E6%9E%97%E7%B8%A3%E6%96%97%E5%85%AD%E5%B8%82%E6%B0%B8%E6%A8%82%E8%A1%9770%E8%99%9F" rel="noopener">在 Google 地圖開啟</a></p>
    </div>

    <div class="info-card">
      <h3>電話</h3>
      <p class="big"><a href="tel:+88655339369"><data value="05-533-9369">(05)5339-369</data></a></p>
    </div>

    <div class="info-card card-map" id="card-map">
      <h3>簡易地圖</h3>
      <div id="map-slot"></div>
    </div>
  </div>
</main>

<!-- ⚠ 切換條與底下這支 JS 都是提案用的，定案後整段刪掉，不要跟著搬進 index.html -->
<div class="sw" id="sw">
  <div><b>畫法</b>
    <button data-k="style" data-v="plate">面（白色的路）</button>
    <button data-k="style" data-v="line">線（路是線）</button>
  </div>
  <div><b>放哪</b>
    <button data-k="pos" data-v="card">自成一張卡</button>
    <button data-k="pos" data-v="addr">收在地址卡裡</button>
  </div>
  <div><b>外框</b>
    <button data-k="shape" data-v="round">圓角方</button>
    <button data-k="shape" data-v="blob">有機色塊</button>
    <button data-k="shape" data-v="circle">正圓</button>
  </div>
  <div><b>診所</b>
    <button data-k="mark" data-v="plot">建物範圍（面）</button>
    <button data-k="mark" data-v="logo">圓標誌</button>
    <button data-k="mark" data-v="bean">設計稿的豆子</button>
  </div>
  <div><b>顏色</b>
    <button data-k="hue" data-v="brick">磚紅</button>
    <button data-k="hue" data-v="teal">深綠松</button>
    <button data-k="hue" data-v="moss">苔綠</button>
  </div>
  <div><b>導角</b>
    <button data-k="corner" data-v="edge">只導壓到街區角的（定）</button>
    <button data-k="corner" data-v="all">四角都導</button>
  </div>
  <div><b>街名</b>
    <button data-k="txt" data-v="soft">柔墨（定）</button>
    <button data-k="txt" data-v="ink">墨色</button>
    <button data-k="txt" data-v="fade">刷淡</button>
    <button data-k="txt" data-v="white">白字</button>
  </div>
  <div><b>街廓</b>
    <button data-k="block" data-v="warm">暖</button>
    <button data-k="block" data-v="cool">冷</button>
    <button data-k="block" data-v="deep">深</button>
  </div>
  <div><b>停車場</b>
    <button data-k="park" data-v="tile">地磚深藍</button>
    <button data-k="park" data-v="ortho">矯正藍</button>
    <button data-k="park" data-v="ink">柔墨</button>
    <button data-k="park" data-v="off">不顯示</button>
  </div>
</div>

<script>
(function () {
  var OPTS = {
    style: ['plate', 'line'],
    pos:   ['card', 'addr'],
    shape: ['round', 'blob', 'circle'],
    mark:  ['plot', 'logo', 'bean'],
    hue:   ['brick', 'teal', 'moss'],
    txt:   ['soft', 'ink', 'fade', 'white'],
    corner: ['edge', 'all'],
    block: ['warm', 'cool', 'deep'],
    park:  ['tile', 'ortho', 'ink', 'off']
  };
  var root = document.documentElement;
  var tpl  = document.getElementById('map-tpl');
  var fig  = tpl.content.firstElementChild.cloneNode(true);
  var slot = document.getElementById('map-slot');
  var addr = document.getElementById('card-addr');
  var cardMap = document.getElementById('card-map');

  // 網址參數。⚠ 正規式要寫 [a-z0-9]+ —— 寫成 [a-z]+ 會吃不到帶數字的值，
  // 比對失敗後會悄悄退回預設，等於參數沒作用（CLAUDE.md 第九節，踩過一次）。
  var q = new URLSearchParams(location.search);
  Object.keys(OPTS).forEach(function (k) {
    var v = q.get(k);
    if (v && /^[a-z0-9]+$/.test(v) && OPTS[k].indexOf(v) >= 0) root.dataset[k] = v;
  });

  function apply() {
    // 位置：把同一個 figure 搬過去，不留兩份 DOM（id 才不會重複）
    if (root.dataset.pos === 'addr') { addr.appendChild(fig); cardMap.hidden = true; }
    else { slot.appendChild(fig); cardMap.hidden = false; }

    fig.querySelector('#map-clip')
       .setAttribute('clip-path', 'url(#clip-' + root.dataset.shape + ')');

    document.querySelectorAll('#sw button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(root.dataset[b.dataset.k] === b.dataset.v));
    });

    var p = new URLSearchParams();
    Object.keys(OPTS).forEach(function (k) { p.set(k, root.dataset[k]); });
    history.replaceState(null, '', location.pathname + '?' + p.toString());
  }

  document.getElementById('sw').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    root.dataset[b.dataset.k] = b.dataset.v;
    apply();
  });

  apply();
})();
</script>
</body>
</html>
