<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>提案：門口的停車參考圖｜芳仁牙醫</title>
<style>
/* ==========================================================================
   門口那張停車參考圖（提案）
   ⚠ 這一段是這張海報自己的樣式；底下那一大段是從 index.html 原封不動抽出來的
     地圖樣式。兩者的分界寫在中間那一行註解。
   ========================================================================== */
:root {
  --paper: #e2e5e6; --card: #f4f4f5; --rule: #cdd0d2;
  --ink: #2a2c27; --ink-soft: #5c5f57; --brick: #AF4C52;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 1.2rem .8rem 14rem; background: #d8dbdd; color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}

/* ==========================================================================
   2026-08-23：這張紙的用途換了 —— 從「停車參考圖」變成**門口的紅線提醒**。
   ⚠ 預設是 **A4 橫**（使用者指定）；直式那一組留著當退路。
   ⚠ 抬頭的「停車資訊 ＋ 診所名稱」與頁尾的地址電話都拿掉了：
     這張紙貼在自家門口，看的人就站在門口。
   ========================================================================== */

/* A4 直式（210×297mm）—— 退路。螢幕上用同一個比例縮到版面寬度。 */
.sheet {
  width: min(100%, 210mm); aspect-ratio: 210 / 297; margin: 0 auto;
  background: var(--card); color: var(--ink);
  padding: 9mm 10mm 8mm; display: flex; flex-direction: column;
  box-shadow: 0 1px 2px rgba(42,44,39,.07), 0 4px 10px rgba(42,44,39,.09);
  container-type: inline-size;
}
/* A4 橫式：地圖擺左、提醒擺右（抬頭 2026-08-23 拿掉了）。
   ⚠ 橫式如果沿用直式那種「上下堆疊」，抬頭＋清單＋圖說會把高度吃光，
     地圖只剩一條（踩過，第一版就是這樣）。 */
body[data-size="l"] .sheet { aspect-ratio: 297 / 210; width: min(100%, 297mm); }

/* ---- 抬頭：一句話講完，這是整張紙唯一要人一眼看到的東西 ---- */
.nt-head { border-bottom: .3cqw solid var(--brick); padding-bottom: 1.4cqw; }
.nt-head b { display: block; font-size: 7.2cqw; line-height: 1.15;
             letter-spacing: .04em; color: var(--brick); }
.nt-head em { display: block; margin-top: .9cqw; font-style: normal;
              font-size: 3.6cqw; letter-spacing: .06em; color: var(--ink); }
body[data-size="l"] .nt-head b  { font-size: 5.2cqw; }
body[data-size="l"] .nt-head em { font-size: 2.5cqw; }

/* ---- 底下：橫式兩欄、直式一欄 ---- */
.nt-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
body[data-size="l"] .nt-main {
  /* ⚠ 收尾那一句拿掉之後右欄變短，左欄再給寬一點讓地圖長大 ——
     地圖是**寬度受限**的（它比欄位矮），欄位變寬它才會變大。
     ⚠ 再往上加右欄就會開始折行（「走幾步就有停車場…」是最長的一句）。 */
  display: grid; grid-template-columns: 1.22fr 1fr; column-gap: 3.4cqw;
  align-items: stretch; overflow: hidden;
}
.nt-side { display: flex; flex-direction: column; justify-content: center; }

.sh-map { flex: 1; display: grid; place-items: center; margin: 2.4cqw 0 0; min-height: 0; overflow: hidden; }
.sh-map .map-fig { width: 100%; height: 100%; display: grid; place-items: center; }
/* ⚠⚠ 地圖的尺寸**由 JS 現算**（見 door-map-script 的 fit()）：viewBox 會隨著
   轉向重算，紙張又有直橫兩種，純 CSS 很難兩邊都「盡量大又不溢出」——
   A4 橫那一版就是這樣被裁成只剩最上面一條（max-height 沒有夾住 width:100%）。
   這裡只留「不要自己撐開」的保險。 */
.sh-map .map-svg { max-width: 100%; max-height: 100%; }
/* 圖說（周邊路段另有畫設…）畫在地圖上的那一份不畫 —— 同樣的兩句話改放右欄。 */
.sh-map .map-note { display: none; }

/* ---- 三句提醒 ---- */
.nt-points { margin: 2.6cqw 0 0; padding: 0; list-style: none;
             display: grid; gap: 1.5cqw; }
.nt-points li { position: relative; padding-left: 2.4cqw;
                font-size: 3.6cqw; line-height: 1.6; letter-spacing: .01em; }
.nt-points li::before { content: ""; position: absolute; left: 0; top: .62em;
                        width: 1.1cqw; height: 1.1cqw; border-radius: 50%;
                        background: var(--ink-soft); }
/* ⚠ 強調的那幾個字加 nowrap：不加的話換行會落在詞中間（「門／口」、
   「直接開／單」都出現過），紅字被切成兩截就不像一個詞了。
   加了之後斷點自然落到它前面，整個詞留在同一行。 */
.nt-points b { color: var(--brick); font-weight: 700; white-space: nowrap; }
body[data-size="l"] .nt-points { margin-top: 0; gap: 1.1cqw; }
body[data-size="l"] .nt-points li { font-size: 2.6cqw; padding-left: 2cqw; line-height: 1.7; }
body[data-size="l"] .nt-points li::before { width: .95cqw; height: .95cqw; }

/* ---- 三個停車場：一行一個，字要大到站在門口就讀得到 ---- */
.sh-lots { display: grid; gap: 1.6cqw; margin: 3cqw 0 0; padding: 0; list-style: none; }
.sh-lots li { display: grid; grid-template-columns: 10cqw 1fr auto; align-items: baseline; gap: 2cqw;
              font-size: 4.2cqw; line-height: 1.4; }
/* ⚠ 「P1」放不進圓形，改成圓角方（和地圖上色塊裡的字同一個代號）。 */
.sh-lots .no { width: 10cqw; height: 6.4cqw; border-radius: 1.6cqw; background: #365685; color: var(--card);
               display: grid; place-items: center; font-size: 3.9cqw; font-weight: 700; align-self: center;
               font-family: Arial, Helvetica, sans-serif; letter-spacing: .02em; }
.sh-lots .nm { font-weight: 700; letter-spacing: .02em; }
.sh-lots .du { color: var(--ink-soft); font-size: 3.8cqw; white-space: nowrap; }
/* ⚠⚠ 橫式的右欄只有紙寬的四成多，「壹車房－中華路停車場」＋距離排一行會折行
   （使用者的截圖上就折了）。改成**兩行**：名字一行、距離退到第二行靠左，
   號碼牌跨兩行置中。 */
body[data-size="l"] .sh-lots { gap: 1.1cqw; margin-top: 2.2cqw; }
body[data-size="l"] .sh-lots li { grid-template-columns: 6.1cqw 1fr; row-gap: .2cqw; font-size: 2.85cqw; }
body[data-size="l"] .sh-lots .no { width: 6.1cqw; height: 4cqw; border-radius: 1cqw;
                                   font-size: 2.5cqw; grid-row: 1 / span 2; }
body[data-size="l"] .sh-lots .du { grid-column: 2; font-size: 2.3cqw; }

.sh-note { margin: 2.2cqw 0 0; font-size: 2.9cqw; line-height: 1.6; color: var(--ink-soft); }
body[data-size="l"] .sh-note { font-size: 2cqw; margin-top: 1.8cqw; }

/* ---- 收尾：整張紙唯一一句「我們」的話，用診所的綠 ---- */
.nt-close { margin: 3.4cqw 0 0; font-size: 4cqw; letter-spacing: .06em;
            color: var(--map-mark, #3f654a); font-weight: 700; }
body[data-size="l"] .nt-close { font-size: 2.5cqw; margin-top: 2.2cqw; }

/* 印出來的時候：整頁只留紙張本身 */
@page { size: A4 landscape; margin: 0; }
@media print {
  body { background: #fff; padding: 0; }
  .pv-bar { display: none !important; }
  .sheet { width: 297mm; height: 210mm; aspect-ratio: auto; box-shadow: none; }
}

/* ---- 切換條（提案用，定案時整段刪掉） ---- */
.pv-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 999;
  background: rgba(244,244,245,.94); backdrop-filter: blur(8px) saturate(1.1);
  border-top: 1px solid var(--rule); padding: .5rem .7rem calc(.5rem + env(safe-area-inset-bottom));
  font-size: 12px; line-height: 1.4; max-height: 46vh; overflow: auto;
}
.pv-row { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; margin-bottom: .34rem; }
.pv-row:last-child { margin-bottom: 0; }
.pv-lab { width: 3.4em; flex: none; color: var(--ink-soft); }
.pv-bar button { font: inherit; padding: .28rem .5rem; border-radius: 8px; cursor: pointer;
                 border: 1px solid var(--rule); background: #fff; color: var(--ink); }
.pv-bar button[aria-pressed="true"] { background: #3f654a; border-color: #3f654a; color: #fff; }
.pv-panel { margin-top: .4rem; padding-top: .4rem; border-top: 1px dashed var(--rule);
            color: var(--ink-soft); font-size: 11.5px; }
.pv-panel b { color: var(--ink); }

/* ---- 地圖本身的幾件事：這一頁是靜態的，三個停車場全部亮著 ---- */
.sh-map .lot { pointer-events: none; }
.sh-map .dots, .sh-map .rlab { opacity: 1; }
.sh-map .map-svg.dim .lbl, .sh-map .map-svg.dim .lbl-s, .sh-map .map-svg.dim .lbl-xs { opacity: 1; }
.sh-map .lbl.hide, .sh-map .lbl-s.hide, .sh-map .lbl-xs.hide { opacity: 1; }
/* ⚠⚠ 「您在這裡」與號碼牌的字色**一定要用 CSS 寫**，不能只寫 fill 屬性 ——
   index.html 那段地圖樣式裡有一條 `.map-svg text { fill: var(--map-ink) }`，
   **CSS 規則贏過 presentation attribute**，所以寫在標籤上的 fill="#f4f4f5"
   會被那條蓋掉，字就變成街名的柔墨色（實測 rgb(92,95,87)）。
   font-weight 同理（那條寫了 400）。 */
/* ⚠ 「現在位置」現在是 text 元素本身（不是群組），選擇器要跟著改 —— 
   寫成 `.you text` 會選不到，字就會掉回街名的柔墨色。 */
.sh-map .map-svg text.you { fill: var(--card); font-weight: 700; letter-spacing: .06em; }
/* 街名壓在點狀路線上會亂 —— 補一圈和路面同色的描邊（做法同停車場那個 P：
   paint-order: stroke 讓描邊先畫、字後畫，字腔不會被吃掉）。 */
.sh-map .map-svg .lbl { paint-order: stroke; stroke: var(--map-road); stroke-width: 5; stroke-linejoin: round; }
/* ⚠⚠ 停車場的代號：站上那個 P 靠 1.6 的同色描邊加粗，換成「P1／P2／P3」
   兩個字之後看起來又粗又擠（使用者回報兩次）。三件事一起改才夠：
     ① 描邊從 1.6 收到 **0.8**（第三輪整個關掉，使用者說太細了）—— ⚠⚠ **選擇器要寫到 `.lot` 那一層**：
        站上那條是 `.map-svg .lot .pk`（三個 class），寫 `.sh-map .map-svg .pk`
        權重一模一樣、又排在前面，描邊**根本沒有被關掉**（實測 computed
        strokeWidth 還是 1.6px）。這就是使用者說「還是太粗」的真正成因 ——
        字重明明已經是 400 了，粗的是那圈 1.6 的同色描邊。
     ② **字重 700 → 400** —— Arial 只有 Regular 與 Bold 兩支，
        CSS 的字重匹配對 400~500 會往下找，所以寫 500 也還是 Regular，
        真正只有 400（細）與 700（粗）兩格可選，中間沒有東西。
     ③ 補一點字距（.02em）—— 粗體收掉之後兩個字元會顯得黏在一起。
   ⚠ 站上那顆單獨的 P 一個字都沒動，這一段只作用在海報上。 */
.sh-map .map-svg .lot .pk { stroke-width: .8; font-weight: 400; letter-spacing: .02em; }
/* 指北針。⚠ 線寬要對得上針的粗細（半寬 7.3 個單位），3 太粗。
   ⚠⚠ **這是內描邊**：線寬開兩倍（2.2 ＝ 看得到的 1.1 的兩倍），
     外側那一半由 JS 掛的 clip-path 切掉 —— 所以空心那半的外緣和實心那半
     逐點相同，尖端收成乾淨的一點。一般的描邊會往外長半個線寬，
     兩半在尖端接不起來，而且銳角的 miter 會再戳出一根刺（使用者看到的那一絲絲）。
   ⚠ 因為外側已經被切掉，linejoin 寫什麼都不影響外緣。
   字級由 JS 的 NSW.fs 寫在元素上，這裡不再定。 */
.sh-map .nsw .nsw-solid  { fill: var(--ink-soft); }
.sh-map .nsw .nsw-hollow { fill: none; stroke: var(--ink-soft); stroke-width: 2.2;
                           stroke-linejoin: miter; stroke-miterlimit: 12; }
/* ⚠ 針身加粗之後，空心那半的輪廓要跟著加一點才不會顯得比實心那半輕
   （2.5 ÷ 2 ＝ 看得到的 1.25）。 */
.sh-map .nsw .nsw-hollow { stroke-width: 2.5; }
.sh-map .map-svg .nsw text { fill: var(--ink-soft); font-weight: 700; letter-spacing: 0; }

/* ---- 以下整段是從 index.html 抽出來的地圖樣式，一個字都沒改 ---- */
/* ==========================================================================
   位置與周邊停車（2026-08-14 定案上線）
   --------------------------------------------------------------------------
   四十二輪的推導、每一個落選案的數字、踩過的坑，全部在
   /history/clinic-simple-map.html。要還原提案頁（有切換條的那一版）：
     git show <定案前最後一個 commit>:preview/clinic-simple-map/index.html > /tmp/x.html

   定案的那一組：線的畫法／圓角方外框／面的診所標記／一般牙科綠 #3f654a／
   停車場路牌藍 #365685（只給「點到」那一態）／牌子淺底藍字空心三角／
   街名柔墨／只導壓到街廓角的那幾角。切換條與所有 data-* 都已經刪掉。
   ========================================================================== */
:root {
  /* 地圖自己的值，全部指回站上既有的變數 —— 只有路牌藍是這一輪新增的 */
  --map-bg:    var(--card);       /* 街廓 */
  --map-road:  var(--rule);       /* 路面 */
  --map-ink:   var(--ink-soft);   /* 街名 */
  --map-mark:  #3f654a;           /* 診所 ＝ 一般牙科的套色 */
  --map-park:  #365685;           /* 停車場「點到」那一態 ＝ 路牌藍 */
  --lbl-op: 1;
}
/* 一般牙科・創辦醫師那一支的套色（PALETTE.md 第六之十一節第七小節）。
   ⚠ 這顆也是主畫面圖示在用的綠 —— 站上「牙科本身」的顏色就是它。
   ⚠ 它和停車場的地磚深藍 #252d4a 差 22 個 L*、色相也不同（綠 vs 藍），
     所以兩種深色塊分得出來；當初改用磚紅就是怕深綠松 #214D48 分不出來，
     那顆比這顆暗一階。 */
/* 停車場的藍 ＝ **路牌藍 `#365685`**（2026-08-14 使用者從五階裡挑的，見上面第
   二十七、二十八輪）。L* 36.2，亮度最接近台灣路牌的 #0058a8（37.5）。
   落選：地磚深藍 #252d4a（太深）、深藍二 #2d4065、中藍 #314b75、
        矯正藍 #4478b5（太淺，而且點到看不出來）。
   ⚠ 它**只出現在「點到」那一態**，平常那三塊是柔墨，見下面 `.lot` 那一段。 */
/* 停車場：平常淺墨，點到（或滑鼠停著）才變成停車場的藍並帶出路線。 */
/* ⚠ 點下去那一瞬間的黑影是 iOS 自己畫的，已經在下面 `.map-fig` 那一條關掉了
     （2026-08-17）。**不要在這裡再寫一次**，那個屬性會繼承。 */
.lot { cursor: pointer; }
/* 熄滅時是**柔墨 `--ink-soft`，不是淡一階的藍**（2026-08-14 第二十八輪定案，
   使用者：「路牌藍好，但只有點到的才要變色，其他不用。」）。
   ⚠ **藍是「點到」的意思，不是「停車場」的意思** —— 三塊都上藍的話，
     藍就只剩深淺兩階可以表達點沒點到，那正是前一輪量到越淺落差越小的死路。
     改成灰底之後，點下去是**換色相**（灰→藍），不必再靠亮度。
   ⚠ 兩態的亮度**幾乎一樣**（柔墨 L star 39.8、路牌藍 36.2，對比只有 1.14），
     所以整塊不會忽明忽暗地跳，只有顏色變 —— 這是刻意的。
   ⚠ **P 兩態都是白的**（熄滅 4.18、路牌藍上 7.43），不必再像淡藍那一版
     熄滅時翻成深藍。
   ⚠⚠ **熄滅態是柔墨混 80% 卡色（#7a7d77），不是足額的柔墨**
     （2026-08-14 第三十輪，使用者：「停車場沒點的時候這個深灰色有點太搶眼了，
     會覺得跟診所在互相搶戲」）。足額柔墨 #5c5f57 對路面 4.20:1，
     和診所那塊綠（4.70:1）幾乎一樣重，三塊灰又比一塊綠多 —— 灰反而贏了。
     混到 80% 之後對路面剩 2.70:1，明顯退到第二層，而白 P 還有 4.18:1。
   ⚠ **不能再更淡**：白 P 的下限（大字粗體）是 3:1，混到 70% 只剩 3.41、
     65% 只剩 3.10、60% 就破線。要更淡就得把 P 改成深色，那和「像路上的停車標誌那樣反白」
     的指定衝突。
   ⚠ 這一輪同時把診所加了一塊實心綠名牌 —— 層次是**兩件事一起做**才成立的，
     只調灰不加名牌的話，圖上會變成三塊淡灰加一塊綠、誰都不突出。 */
.lot rect, .lot path { fill: color-mix(in srgb, var(--ink-soft) 80%, var(--card)); transition: fill .16s ease; }
.lot.on rect, .lot.on path { fill: var(--map-park); }
/* 入口指標：**導航 App 那種箭頭**（尖頭 ＋ 尾端內凹的實心四邊形，
   使用者指定「像 Apple 地圖那顆」）。2026-08-14 從「角形（＞）」換掉 ——
   角形在這個尺寸下看不出朝哪邊。填色，所以跟著 `.lot path` 一起深淺變化，
   只要不另外指定 fill 就好。方向用 `rotate()` 給：0＝朝北、180＝朝南、-90＝朝西。 */
/* P 一律白色反白，比照路上的停車標誌（使用者指定）。
   ⚠ **再粗一階靠的是描邊，不是 font-weight**（2026-08-14 第三十輪，使用者：
     「P 還可以再更粗一點，現在這個還是有一點細」）。這一站**不載任何網頁字型**，
     中文吃系統字：iOS/macOS 的 PingFang TC 最重只到 Semibold，
     Windows 的微軟正黑只有 Regular/Bold —— 寫 `font-weight: 900` 在那些機器上
     一個像素都不會變。
   ⚠ `paint-order: stroke` 是關鍵：描邊先畫、填色後畫蓋在上面，
     所以只有**外側那一半**留得下來 —— 字往外長 1.1，**字腔（P 的那個洞）
     不會被吃掉**。不寫 paint-order 的話描邊蓋在填色上，洞會縮成一條縫。 */
.map-svg .lot .pk {
  fill: var(--card); stroke: var(--card); stroke-width: 1.6;
  paint-order: stroke; stroke-linejoin: round;
}
/* 對焦框。⚠ **滑鼠點下去不可以出現**（2026-08-14 使用者：「電腦版點下去
   停車場有奇怪的框框」）。`:focus-visible` 本來就是為了這件事，但**帶
   `tabindex` 的非原生可聚焦元素，Chrome 用滑鼠點也會判定成 focus-visible**
   —— 這三塊 `<g role="button" tabindex="0">` 正是那種。
   所以點完之後主動 `blur()`（見下面的 JS）：滑鼠使用者不留焦點，
   用 Tab 走過來的還是會亮框（那不是 click 來的）。 */
.lot:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* 步行路線：Google 那種點狀線。dasharray 的 0.1 ＋ round 端點 ＝ 圓點。 */
/* ⚠ 路線**不畫線**，它只是「幾何來源」：底下的 JS 沿著它等距排圓點。
   原本用 stroke-dasharray 排點，轉角會把相位打亂，看起來就是間隔不一致、
   靠近診所那一段還會像歪掉（2026-08-14 使用者指出兩次）。 */
.route { fill: none; stroke: none; }
.dots { opacity: 0; transition: opacity .18s ease; }
.dots circle { fill: var(--map-park); }
.rlab { opacity: 0; pointer-events: none; transition: opacity .18s ease; }
.dots.on, .rlab.on { opacity: 1; }
.rlab.on { pointer-events: auto; }
/* 牌子的兩案（2026-08-14 第三十四輪，使用者：「停車場的對話框現在是淺底色＋
   藍邊，做一個藍底色白字的版本，這樣圖釘變成白色」）。切換條最後一排。

     淺（light）  底＝路牌藍 10% 混紙卡色、框 1.5、字與圖釘與底線＝路牌藍（5.84:1）
     實（solid）  底＝足額路牌藍、無框、字與圖釘與底線＝紙卡色（7.43:1）

   ⚠ **尾巴兩案都是足額的路牌藍。** 淺的那一案因此是「實心尾巴 ＋ 空心盒子」，
     矩形的框線橫過尾巴根部那一段是藍疊藍，看不出接縫 —— 不必另外處理。
   ⚠ 兩案的白／藍**只換前景與底，字級、位置、底線的算法完全共用**。
   ⚠ 診所那塊名牌一直都是實心綠底白字，不吃這個切換 —— 淺的那一案存在的
     理由就是「和診所一深一淺分得出主次」（第三十輪 (4)）。實的那一案等於
     把這個差別交回給顏色（綠 vs 藍）去分。 */
/* ⚠ 這幾條要寫成 .map-svg …（多一階）—— 只寫 .rlab text 的話
   和後面的 `.map-svg text { fill: var(--map-ink) }` 同權重，後者排在後面會贏。 */
.map-svg .rlab text { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
.map-svg .rlab .rl-nm { font-size: 16px; }

.map-svg .rlab .bub {
  fill: color-mix(in srgb, var(--map-park) 10%, var(--card));
  stroke: var(--map-park); stroke-width: 1.5;
}
.map-svg .rlab text, .map-svg .rl-pin { fill: var(--map-park); }
.map-svg .rl-ul { stroke: var(--map-park); }

.rl-link { cursor: pointer; }
/* 診所的標記：綠塊寫「芳仁牙醫」＋ 站在上面的一顆圖釘（2026-08-21 定案，
   十輪的推導與每一條尺的落選格在 /history/clinic-map-pin.html）。
   ⚠ 顏色一顆都沒新增：綠 ＝ 一般牙科的套色 --map-mark、字與圈 ＝ 紙卡色 --card、
     影子 ＝ 站上卡片陰影那一支 --ink。同一塊綠上仍然只有一個白。
   ⚠ 這一段取代了 2026-08-14~15 那個「綠底白字的對話框（.clab）」——
     那一塊連同它的圖釘、底線、尾巴與 data-* 都已經刪掉，不要再加回來。 */
.cm-link { cursor: pointer; }
.map-svg .cm-plot  { fill: var(--map-mark); }
.map-svg .cm-solid { fill: var(--map-mark); }
.map-svg .cm-disc  { fill: var(--card); }
.map-svg .cm-logo  { fill: var(--map-mark); }
/* 影子那十六層。⚠ 每層的濃度很低，疊起來才是一整片 ——
   總濃度是 1−(1−α)^層數，不是 α×層數，改層數就要重算 α。 */
.map-svg .cm-sh use { fill: var(--ink); opacity: .026; }
/* 綠塊裡那四個字。⚠ 選擇器要兩階（0,2,0）才蓋得過 `.map-svg text { fill: var(--map-ink) }`。
   ⚠ 字級 20 時那四個字寬 83.7 個單位、綠塊 96，兩邊各剩 6 —— 這是量過的上限，
     要再放大就得連綠塊一起改。手機不另外放大（整張圖在手機是裁窄放大的，字跟著大）。 */
.map-svg .cm-nm { fill: var(--card); font-size: 20px; font-weight: 700; letter-spacing: .04em; }
.map-svg .cm-ul { stroke: var(--card); stroke-width: 1.2; }
/* 有停車場亮著的時候，街名淡下去 —— 不然點狀路線壓在街名上很難辨認
   （2026-08-14 使用者指出）。⚠ 這一條要比 .map-svg .lbl 那條多一階才蓋得過
   它自己的 opacity: var(--lbl-op)。 */
.map-svg .lbl, .map-svg .lbl-s, .map-svg .lbl-xs { transition: opacity .18s ease; }
.map-svg.dim .lbl, .map-svg.dim .lbl-s, .map-svg.dim .lbl-xs { opacity: .28; }
/* **被路線或牌子壓到的那幾個街名直接不見**（2026-08-14 使用者：「點下去有
   虛線路線後，若壓到路名，這個模式下路名可拿掉」）。哪幾個是壓到的
   由 JS 現算（見底下 hideCovered），不是寫死 —— 路線或牌子挪位置就會自己跟著變。
   ⚠ 這一條要排在上面那條 .dim 後面（同權重，後者贏）。 */
.map-svg .lbl.hide, .map-svg .lbl-s.hide, .map-svg .lbl-xs.hide { opacity: 0; }
/* 入口指標：**平常不出現，點到那一塊才出現**（2026-08-14 第二十九輪，使用者：
   「入口其實不用一開始就標示，是點下去才要 —— 壹車房跟合廷有兩條路，
   會不知道要從哪邊進去；永樂站只有一條路，一看就知道，不需要標示。」）。
   ⚠ 這是**資訊分層**，不是為了畫面乾淨：三顆箭頭一直亮著的時候，
     它們和「點我」是同一個視覺重量，反而看不出哪一顆是回答問題的。
   ⚠ 用 `visibility` 不是 `display`：`display:none` 的元素量不到外框，
     底下 hideCovered 那一段會拿不到它的 rect。
   ⚠ 永樂站那顆**留著**，不必特別為它寫規則 —— 它點下去之後會被自己那條
     路線壓到，下面那條 `.hide` 就會把它收掉（2026-08-14 上一輪的機制）。 */
.map-svg .ent { visibility: hidden; opacity: 0; transition: opacity .18s ease; }
.map-svg .lot.on .ent { visibility: visible; opacity: 1; }
.map-svg .lot.on .ent.hide { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .lot rect, .lot path, .lot .pk, .dots, .rlab,
  .map-svg .lbl, .map-svg .lbl-s, .map-svg .lbl-xs { transition: none; }
}


.card-map { grid-column: 1 / -1; }
/* 標籤**整個比照「開診時段」**（2026-08-14 使用者兩輪指定：先是「套色跟看診
   時段一樣」，再來「標籤格式要比照開診時段」）。所以連幾何一起抄，不只顏色：

     套色      實心 `#5f5d5c` ＋ 白字。⚠ **不是新顏色** —— 就是首頁「全部」與
               門診表「開診時段」在用的那一階（`[data-spec="all"]`）。
     字級      .88rem（門診表那排 2026-08-13 抬過的值，不是基底的 .8rem）
     圓角      12px（`.hours-filter button`，不是 `.info-card h3` 的 9px）
     字距      normal（`.info-card h3` 原本有 .08em，這裡要拿掉）
     左右內距  .7rem

   ⚠⚠ **上下內距一定要寫 `calc((34px - 1.6em - 2px) / 2)`，不要換算成 px。**
     34 是那一排藥丸的塊高、1.6 是 line-height、1em 是**自己當下的字級**、
     2 是上下框線。寫死之後字級一改塊高就被頂開 —— 這條規則 index.html 裡
     也有（CLAUDE.md 第九節「手機的可讀性與橫捲標記」那一條）。
   ⚠ 它仍然是 `<h3>` 卡片標題，不是可以按的鈕 —— 抄的是外觀，不是行為。 */
.card-map h3 {
  font-size: .88rem; line-height: 1.6; letter-spacing: normal;
  padding: calc((34px - 1.6em - 2px) / 2) .7rem;
  border-radius: 12px;
  background: #5f5d5c; color: #fff; border: 1px solid #5f5d5c;
}

/* ---- 地圖本體 ---------------------------------------------------------- */
/* ⚠⚠ **整張地圖要關掉 iOS 的點擊高亮**（2026-08-17，使用者的螢幕錄影：
     「停車場切換的時候會很快速短暫的出現黑影」）。那片黑影**不是這一站的
     任何一條規則畫的**，是 iOS Safari 的 `-webkit-tap-highlight-color`
     （預設是半透明的黑）。1126×2436、60fps 的錄影逐幀量過：
     ・四次切換（斗六永樂站／合廷／壹車房）**每一次都有**，位置各自跟著
       被點的那一塊走，**5 幀（約 83ms）**之後淡掉 —— 正是「很快速短暫」。
     ・色塊右邊那一條實測從 200.6 掉到 **142.0**（差 58 階，≈ 黑 29%）。
   ⚠⚠ **它蓋的是 `<g class="lot">` 的外框，所以會比看得到的方塊大一圈** ——
     入口箭頭 `.ent` 也在那個群組裡（而且是 `visibility: hidden` 不是
     `display: none`，見上面那一段，所以一直算在外框內），黑影因此往箭頭
     那一側凸出去一塊。畫面上讀起來就是「方塊旁邊多出一塊黑影」，
     不是方塊自己變深。
   ⚠ **不是** `:focus-visible` 那圈外框（那是 2px 的線，而且點完就 `blur()` 了），
     也**不是** `.lot rect` 換色那條過場（那條只換色相，兩態亮度差 1.14）。
   ⚠ 寫在 `.map-fig` 上是因為這個屬性**會繼承** —— 三顆停車場、牌子上那三個
     連結、以及「點空白處＝收回」的那一層（handler 就掛在這個 `<figure>` 上）
     一次全部涵蓋，它們的黑影是同一件事、同一個成因。
   ⚠ 回饋不會因此不見：點下去色塊換色、路線與牌子帶出來，本來就看得見。
   ⚠ 這一站已經有一顆這樣做了 —— 「回到最上面」那顆 `.btt`，做法相同。 */
.map-fig { margin: 0; -webkit-tap-highlight-color: transparent; }
/* ⚠ 這一層只有手機用得到（見樣式表最後那一段：裁掉左右）。
   電腦版與 iPad 是 `display: contents` —— 它不產生任何盒子，SVG 等於直接
   掛在 <figure> 底下，和 2026-08-15 之前逐像素相同。 */
.map-win { display: contents; }
.map-svg { display: block; width: 100%; height: auto; max-width: 480px; font-family: inherit; }
.card-map .map-svg { margin-inline: auto; }
.map-svg text { fill: var(--map-ink); font-weight: 400; }
.map-svg .lbl   { font-size: 22px; letter-spacing: .06em; font-weight: 700; opacity: var(--lbl-op, 1); }
.map-svg .lbl-xs{ font-size: 16px; letter-spacing: .02em; font-weight: 700; opacity: var(--lbl-op, 1); }
.map-svg .lbl-s { font-size: 20px; letter-spacing: .04em; font-weight: 700; opacity: var(--lbl-op, 1); }
/* 停車場的 P：**粗體**，比照路上停車標誌的份量（2026-08-14 使用者指定）。
   ⚠⚠ **這個 P 不吃全站的中文字型堆疊，自己指定 Arial/Helvetica**
     （2026-08-14 第三十六輪，使用者：「電腦版停車場的 P 好胖」，手機版沒事）。
     成因是**同一個 `font-weight: 800` 在不同系統落在不同地方**：
     iOS/macOS 的 PingFang TC 最重只到 Semibold，要 800 就給 Semibold；
     Windows 的微軟正黑只有 Regular/Bold，要 800 會**合成假粗體**
     （瀏覽器自己把字塗厚），再加上我們的描邊就腫成一塊。
     P 是拉丁字母，改指定 Arial／Helvetica —— 三個平台都有**真的 Bold**，
     不必合成，粗細因此各平台一致。
   ⚠ 描邊跟著從 2.2 收到 1.6：Arial Bold 本身就比 PingFang Semibold 重，
     維持 2.2 會變成另一種胖。`paint-order: stroke` 的道理不變（見下面）。
   ⚠ 這也更接近路上的停車標誌 —— 那個 P 本來就是無襯線的拉丁字。 */
.map-svg .pk    { font-family: Arial, Helvetica, "Helvetica Neue", sans-serif;
                  font-size: 31px; font-weight: 700; fill: var(--card); letter-spacing: 0; }
.map-svg .pk-s  { font-size: 28px; }                      /* 小一號的 P（頂三站那顆圓比較小） */
.map-svg .pk-nm { font-size: 22px; fill: var(--card); letter-spacing: .06em; }
.map-svg .nm    { font-size: 24px; letter-spacing: .08em; font-weight: 500; }

.map-note { margin-top: .5rem; font-size: .8rem; line-height: 1.7; color: var(--ink-soft); }
.card-map .map-note { max-width: 480px; margin-inline: auto; }
/* 撇清關係那一句自己一段、不加粗也不變色 —— 它是要看得到，不是要跳出來喊。
   ⚠ 不要用 --brick：這張卡上一個紅字都沒有，那顆紅在首頁本來就沒在用了
   （CLAUDE.md 第九節「看診時間本身」那一條）。 */
.mn-first { display: block; margin-bottom: .35rem; }
</style>

<body data-orient="w" data-size="l" data-lotcolor="blue" data-ns="b" data-nw="b">

<!-- ==========================================================================
     門口的告示（A4 橫）。⚠⚠ 2026-08-23 用途整個換掉了：
     原本是「停車參考圖」，使用者說明實情之後改成**紅線提醒**——
     門口那一段劃了紅線，以前多半柔性勸導，前幾天警察到場直接開單。
     ⚠ 抬頭那塊「停車資訊 ＋ 診所名稱」與頁尾的地址電話**都拿掉了**
       （使用者指定）：這張紙貼在自家門口，看的人就站在門口，不必自我介紹。
     ⚠ 「車主在拖吊車來之前出現就不會被拖吊」**刻意不寫** ——
       那等於教人賭一把，而這張紙的目的正好相反。
     ========================================================================== -->
<div class="sheet">
  <!-- ⚠⚠ 抬頭（「門口這一段是紅線／最近有警察到現場直接開單」）2026-08-23
       由使用者拿掉 —— 這張紙就貼在那一段紅線旁邊，標題只是把四點提醒又講一次。
       樣式 .nt-head 還留在樣式表裡，要放回來把這一段補回去就好。 -->
  <div class="nt-main">
    <div class="sh-map">
<figure class="map-fig">
            <!-- ⚠ preserveAspectRatio 是 slice（2026-08-15）：手機那一段 CSS 給了它一個比
                   viewBox 更瘦的 aspect-ratio，slice 就會**裁掉左右兩側**、讓中間那塊放大。
                   viewBox 本身一個字都沒動 —— 那張圖排了四十二輪，不要動它的座標。
                   電腦版與 iPad 沒有設 aspect-ratio，盒子的比例 ＝ viewBox 的比例，
                   這時 slice 和 meet 完全等價，所以那兩邊不受影響。 -->
              <div class="map-win">
              <!-- ⚠⚠ 這張圖的名字用 `aria-label` 給，**不要用 `<title>`**（2026-08-21）。
                     `<title>` 同時是無障礙名稱**和**桌機的原生提示框 —— 滑鼠停在圖上任何
                     沒有自己 `<title>` 的地方（含三塊牌子），就會跳出「芳仁牙醫診所簡易地圖」
                     那個框。使用者：「為什麼會出現這個附註框」。
                     改成 aria-label 之後螢幕閱讀器照樣讀得到，畫面上不再跳框。
                   ⚠ `<desc>` 不會變成提示框，所以留著，用 `aria-describedby` 接上去。
                   ⚠ 底下三塊停車場色塊（`g.lot`）自己的 `<title>` **是刻意留的** ——
                     名字從圖上拿掉之後，滑鼠停著是唯一看得到全名與步行時間的地方。 -->
              <svg class="map-svg" viewBox="0 0 560 620" role="img"
                   aria-label="芳仁牙醫診所簡易地圖" aria-describedby="md">
              <desc id="md">診所位在永樂街與平和街19巷交會的那一角，門面朝永樂街；街區北接文化路，往南依序是平和街33巷、大同路與中華路。附近三處停車場：19巷北邊那條平行巷上的斗六永樂站、永安路上的合廷，以及中華路上的壹車房。</desc>

              <defs>
                <!-- 外框：圓角方（三案裡選上的那一個，另兩案是有機色塊與正圓）。 -->
                <clipPath id="clip-round"><rect x="0" y="0" width="560" height="620" rx="18"/></clipPath>

                <!-- 診所那顆圖釘的釘身（2026-08-21 定案，推導在 /history/clinic-map-pin.html）。
                     放在 defs 裡是因為影子要拿同一條路徑疊十六層 —— 用 <use> 引用，
                     不要把這串座標抄十七遍。
                     幾何全部是算出來的（頭的半徑 R＝24.48、尖端離圓心 1.55R、
                     腰身 30 度、尖端圓角 .06R），演算法與四條尺的落選格見那一頁。 -->
                <path id="cm-body" d="M-12.24 -16.74A24.48 24.48 0 1 1 12.24 -16.74L1.21 -0.64A1.47 1.47 0 0 1 -1.21 -0.64Z"/>
              </defs>

              <g id="map-clip" clip-path="url(#clip-round)"><g id="geo">
                <rect width="560" height="620" fill="var(--map-road)"/>

                <!-- ⚠⚠ 2026-08-14 第九輪**畫法整個反過來**：底色鋪的是**路**，
                     街廓一塊一塊畫上去 —— 使用者：「每個街區導一點點圓角」。
                     街廓是路與路之間的空白，沒有自己的形狀，所以圓角只能用畫的。
                     rx=4（2026-08-14 使用者指定從 6 收到 4；畫到 480px 寬時約 3.4px）。

<script>
/* 位置與周邊停車：點停車場帶出步行路線與時間。推導見 /history/clinic-simple-map.html */
(function () {
  var fig = document.querySelector('.map-fig');
  if (!fig) return;

  // ---- 停車場的點選：一次總有一個亮著，點另一個就換過去 -------------------
  // 桌機另外吃 hover（預覽），滑開就回到「釘住」的那一個。
  //
  // ⚠⚠ **開頁就先亮壹車房，而且沒有「全部熄滅」那一態**
  //   （2026-08-14 使用者：「現在的顯示是全部都是深灰色，我想改成直接顯示
  //   壹車房，然後彼此間可以互相點選」）。
  //   ・原本開頁是三塊都熄滅，等使用者發現可以點。那一態當開場沒有回答任何
  //     問題 —— 圖上只有三塊灰，路線與距離全部藏著。所以改成開頁就先亮一個。
  //   ・**但「全部熄滅」那一態要留著**（第四十二輪使用者當場退回我拿掉它的做法：
  //     「全部熄滅不要拿掉啊，如果點這個圖片的停車場以外的地方，還是可以變成
  //     全部，還是比較知道道路的資訊」）—— 亮著的時候街名會淡下去、還會被
  //     路線壓掉幾個，要看清楚路名就得有一個「什麼都沒選」的狀態。
  //   ・所以：點一塊 ＝ 換到那一塊（**不是點第二下就收回**），
  //     點停車場以外的地方 ＝ 全部熄滅、街名回到滿的。
  //   ⚠ 預設是**壹車房**（使用者指定），不是最近的永樂站（50 公尺）。
  //     要換預設就改 DEFAULT_LOT 這一個字母。
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var DEFAULT_LOT = 'c';
  var pinned = DEFAULT_LOT, hovered = null;
  // 步行路線的圓點：**一段一段排，不是沿著整條路徑排**。
  //
  // ⚠⚠ 這裡改過兩次，第二次是 2026-08-14 使用者放大手機截圖看出來的
  //   （「那個藍色點沒有對齊，歪歪斜斜的」）：
  //     第一版 stroke-dasharray —— 轉角會把相位打亂，間隔看起來不一致。
  //     第二版 getPointAtLength 沿**整條**路徑等距排 —— 間隔是勻的，
  //       但**轉角不保證剛好落一顆**：點會跨過轉角，於是轉角附近出現
  //       兩顆斜著並排的點，看起來就是「歪掉」。
  //     現在：把折線拆成一段一段，每一段自己算 `n = round(長度/14)`，
  //       所以**每個轉角一定剛好一顆**，而且同一段之內完全等距。
  //   ⚠ 代價是不同段的間距可能差幾個百分點 —— 那個看不出來，
  //     轉角的雙點看得出來。**不要改回沿整條路徑排。**
  // ⚠ 直接從 `d` 屬性把折線的頂點抓出來（這三條都是 M ＋ 幾個 L，沒有曲線）。
  function buildDots() {
    fig.querySelectorAll('.route').forEach(function (path) {
      var g = fig.querySelector('.dots[data-lot="' + path.dataset.lot + '"]');
      if (!g) return;
      while (g.firstChild) g.removeChild(g.firstChild);
      var nums = (path.getAttribute('d').match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
      var P = [];
      for (var i = 0; i + 1 < nums.length; i += 2) P.push({ x: nums[i], y: nums[i + 1] });
      if (P.length < 2) return;
      var pts = [P[0]];
      for (var s = 1; s < P.length; s++) {
        var a = P[s - 1], b = P[s];
        var len = Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y));
        var n = Math.max(1, Math.round(len / 14));
        for (var k = 1; k <= n; k++) {
          pts.push({ x: a.x + (b.x - a.x) * k / n, y: a.y + (b.y - a.y) * k / n });
        }
      }
      pts.forEach(function (pt) {
        var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', pt.x.toFixed(2));
        c.setAttribute('cy', pt.y.toFixed(2));
        c.setAttribute('r', '3.5');
        g.appendChild(c);
      });
    });
  }
  buildDots();

  // 牌子的矩形與尾巴：用內容的實際外框現量（字級、字型、系統縮放都吃得到）
  // ⚠ 量的是 `.rl-body` 這個群組不是單一個 <text> —— 停車場那三塊現在有
  //   圖釘＋名字＋底線＋距離四樣東西。`getBBox()` 對群組回傳的是**含子元素
  //   transform 的聯集**，所以圖釘那個 scale() 也算得進去。
  // 圖釘原圖是 384x512（實心水滴，= 頁尾那顆）。先定高，寬按 .75 的比例跟著走。
  // ⚠⚠ **高與間距都是「名字字級的倍數」，不是寫死的單位**（2026-08-15 使用者：
  //   「那個芳仁牙醫診所圖釘，那個相對距離跟停車場好像不太一樣」——量出來是真的）。
  //   成因：停車場那三塊的名字是 16px，診所那塊是 15px（`.clab text` 自己一條），
  //   而圖釘的高 17 與間距 3 原本是寫死的 —— 同樣的絕對值配上小一號的字，
  //   相對量就大了 6.7%（1.1332em vs 1.0624em、0.2002em vs 0.1876em）。
  // ⚠ 兩個比值**定義在停車場那三塊上**（17/16、3/16），所以那三顆一個單位都沒動；
  //   會跟著變的只有診所那一顆（17 → 15.94、間距 3 → 2.81）。
  // ⚠ 盒子用圖釘自己的 **viewBox 384×512**，不要改成 `getBBox()` 量出來的
  //   ink box（實測 384×510.675，水滴尖端是圓的）—— 那會讓停車場那三顆一起長 0.26%。
  //
  // ⚠ 2026-08-21：診所那一塊名牌換成圖釘之後，這裡**只剩停車場那三塊**在用。
  //   原本它有自己的 `data-pin-k`（圖釘縮到 92%）與 `data-ink-gap`（間距改成對字面量）
  //   兩個覆寫，已經連同那一塊一起刪掉；那一輪的推導留在 /history/clinic-simple-map.html。
  var PIN_EM = 17 / 16, GAP_EM = 3 / 16, PIN_VB_W = 384, PIN_VB_H = 512;

  // 字面下緣離基線多遠（單位＝該元素的 user unit）。量不到就回 null。
  var CTX = (function () {
    try { return document.createElement('canvas').getContext('2d'); } catch (e) { return null; }
  })();
  function inkDescent(el) {
    if (!CTX) return null;
    var cs = getComputedStyle(el), fs = parseFloat(cs.fontSize);
    if (!fs) return null;
    // 在 400px 上量再等比例縮回去（Blink 在小字級回來的值顆粒很粗）
    CTX.font = cs.fontStyle + ' ' + cs.fontWeight + ' 400px ' + cs.fontFamily;
    var m = CTX.measureText(el.textContent);
    if (typeof m.actualBoundingBoxDescent !== 'number') return null;
    return m.actualBoundingBoxDescent / 400 * fs;
  }
  // ⚠ 2026-08-21 拿掉了 inkLeft()（量第一個字的左側空白）—— 它只有診所那塊
  //   名牌的 `data-ink-gap` 在用，那一塊已經換成圖釘了。要看當初為什麼需要它，
  //   見 /history/clinic-simple-map.html。
  // 「圓角方 ＋ 一支尾巴」畫成**一條**路徑 —— 這樣整塊只有一圈外框，
  // 描邊不會橫過尾巴根部（2026-08-14 第三十七輪，全空心那一案需要）。
  // ⚠ 走的方向固定是順時針：上邊 →、右邊 ↓、下邊 ←、左邊 ↑。
  //   尾巴插在哪一邊，那一邊的兩個端點就照該方向的順序寫，寫反會扭成蝴蝶結。
  function bubblePath(x, y, w, h, r, dir, tip, bc, bw) {
    var n = function (v) { return (+v).toFixed(2); };
    var x2 = x + w, y2 = y + h, A = 'A' + r + ' ' + r + ' 0 0 1 ';
    var d = 'M' + n(x + r) + ' ' + n(y);
    if (dir === 'up') d += 'H' + n(bc - bw) + 'L' + n(tip.x) + ' ' + n(tip.y) + 'L' + n(bc + bw) + ' ' + n(y);
    d += 'H' + n(x2 - r) + A + n(x2) + ' ' + n(y + r);
    if (dir === 'right') d += 'V' + n(bc - bw) + 'L' + n(tip.x) + ' ' + n(tip.y) + 'L' + n(x2) + ' ' + n(bc + bw);
    d += 'V' + n(y2 - r) + A + n(x2 - r) + ' ' + n(y2);
    if (dir === 'down') d += 'H' + n(bc + bw) + 'L' + n(tip.x) + ' ' + n(tip.y) + 'L' + n(bc - bw) + ' ' + n(y2);
    d += 'H' + n(x + r) + A + n(x) + ' ' + n(y2 - r);
    d += 'V' + n(y + r) + A + n(x + r) + ' ' + n(y) + 'Z';
    return d;
  }

  function sizeLabels() {
    // (1) 先把圖釘與底線擺到名字旁邊／底下 —— 它們的位置要等字量出來才知道
    fig.querySelectorAll('.rl-link').forEach(function (a) {
      var nm = a.querySelector('.rl-nm'), pin = a.querySelector('.rl-pin'), ul = a.querySelector('.rl-ul');
      var b = nm.getBBox();
      // 圖釘：字面中線對齊。⚠ 對的是 bbox 的中線不是基線 ——
      //   圖釘是個對稱的水滴，跟著基線走會整顆偏高。
      // ⚠ 高與間距跟著**這一塊自己的字級**走（見上面 PIN_EM／GAP_EM 那一段）。
      var fs = parseFloat(getComputedStyle(nm).fontSize) || 16;
      var ph = PIN_EM * fs, ps = ph / PIN_VB_H, pw = PIN_VB_W * ps;
      var gap = GAP_EM * fs;
      pin.setAttribute('transform',
        'translate(' + (b.x - pw - gap).toFixed(2) + ' ' + (b.y + b.height / 2 - ph / 2).toFixed(2) +
        ') scale(' + ps.toFixed(5) + ')');
      // 底線自己畫，不用 text-decoration（各家瀏覽器位置不一致）。
      // ⚠⚠ **y 要對「字面」不是對 bbox**（2026-08-14 使用者：「底線和停車場
      //   名稱好像有點遠，是我的錯覺嗎」—— 不是錯覺）。
      //   SVG 文字的 `getBBox()` 高度是**字型的 ascent＋descent**，
      //   而中文方塊字用不到下伸部，所以 bbox 下緣比字的實際下緣低一截：
      //   Noto Sans TC 的 descent 約 .29em，16px 下就是 4.6 個單位的空白，
      //   再加 2.5 的間隙，底線等於離字 7.1 —— 看起來就是「有點遠」。
      //   改成用 canvas 量**字面**下緣（actualBoundingBoxDescent），
      //   底線落在字面下 2.2 個單位（16px 下離基線 4.95）。
      //   ⚠ **這個數字來回調過兩次，不要再憑感覺動**：
      //     bbox＋2.5 ＝ 離基線 6.0 → 使用者「有點遠」；
      //     字面＋1   ＝ 離基線 3.75 → 使用者「幾乎黏在一起」；

      //   牌子的字放大之後使用者回報「超連結的底線和文字間隔都處理一下，

  //   圓角裁切外面那一圈、以及任何沒有圖形畫在上面的位置都收不到事件。
  //   <figure> 是一般的 HTML 盒子，連圖說那幾行字一起算進來，整塊都收得回。

  fig.addEventListener('click', function () { pinned = null; paintLots(); });

       第一版 1:2（寬 28 高 56）——「太大了 而且比例不對 也不夠精緻」

     所以**寬高比改成一條尺**（NS_W 那四格，針長固定 38、只換半寬），
     讓使用者自己指一格，不要再由我猜。網址 ?ns=a|b|c|d。

     等比例算出來 —— **比例因此鎖死在 1:2.0**，不會又跑回「太長」或「太胖」。
     ⚠ 針長一改缺口也跟著按比例縮，不然底下那兩隻腳會變成兩根刺。 */

  var NS_H = { a: 42, b: 36, c: 31, d: 26 };         /* 整組大小（＝針長），比例固定 */

  var nswTy = nswA;                                   /* 字的錨點：**和尖端同一個水平** */

    var U = str.match(/[0-9A-Za-z]+|[\s\S]/g) || [];

    /* ⚠⚠ viewBox 要照**轉過去之後**的內容重算 —— 沿用 0 0 560 620 的話，

       空的街廓，海報上等於浪費紙。做法：把「有內容的範圍」（平和街~永安路、
       文化路~中華路：94~487 × 21~587）四個角轉過去，取外框再各留 8 個單位。 */
    var C = [[94, 21], [487, 21], [487, 587], [94, 587]].map(function (p) { return rot(p[0], p[1], th); });
    var mx0 = Math.min.apply(null, C.map(function (p) { return p.x; })) - 8;
    var mx1 = Math.max.apply(null, C.map(function (p) { return p.x; })) + 8;
    var my0 = Math.min.apply(null, C.map(function (p) { return p.y; })) - 8;
    var my1 = Math.max.apply(null, C.map(function (p) { return p.y; })) + 8;

    LANES.forEach(function (st, i) {

    var nx1 = Math.max.apply(null, nsA.map(function (q) { return q.x; }));
    var ny0 = Math.min.apply(null, nsA.map(function (q) { return q.y; }));

    var nsTop = my0 - 18;                             /* 帶子的下緣：離街廓 18 個單位 */
    var nsx = mx1 - nx1 - 20, nsy = nsTop - ny1;

      (th ? ' rotate(' + th + ')' : ''));

    upright(nswTxt, th, 0, nswA - NSW.gap);

    vy0 = Math.min(vy0, nsy + ny0 - 6);
    svg.setAttribute('viewBox', [vx0, vy0, vx1 - vx0, vy1 - vy0]

  /* 地圖在版面裡「盡量大又不溢出」：照 viewBox 的比例和容器的盒子現算。
     ⚠ 不要交給 CSS —— viewBox 會隨轉向重算、紙張又有直橫兩種，

    var k = Math.min(w / vb[2], h / vb[3]);
    svg.style.width = (vb[2] * k).toFixed(1) + 'px';
    svg.style.height = (vb[3] * k).toFixed(1) + 'px';

  /* ---- 海報化：三條路線各走各的、三個停車場全部亮著、對話框不畫 ---------- */
  function rebuildDots() {
    var keep = [], a = svg.querySelector('.dots[data-lot="a"]');
    ['a', 'b', 'c'].forEach(function (k) {
      var g = svg.querySelector('.dots[data-lot="' + k + '"]');
      if (g) while (g.firstChild) g.removeChild(g.firstChild);
      var r = svg.querySelector('.route[data-lot="' + k + '"]');
      if (r) r.setAttribute('d', 'M0 0');            /* 路線本身不畫，只是幾何來源 */
    });
    ROUTE_SEGS.forEach(function (seg) {
      var p0 = seg[0], p1 = seg[1];
      var len = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      var n = Math.max(1, Math.round(len / DOT_GAP));
      for (var i = 0; i <= n; i++) {
        var x = p0[0] + (p1[0] - p0[0]) * i / n, y = p0[1] + (p1[1] - p0[1]) * i / n;
        /* ⚠ 交會處會有兩段各放一顆，靠這一條濾掉 —— 這就是使用者說的
           「圓點有點重複」。 */
        var tooClose = keep.some(function (q) { return Math.hypot(q[0] - x, q[1] - y) < DOT_MIN; });
        if (!tooClose) keep.push([x, y]);
      }
    });
    keep.forEach(function (q) {
      add('circle', { cx: q[0].toFixed(2), cy: q[1].toFixed(2), r: 3.5 }, a);
    });
  }

  function poster() {
    svg.classList.remove('dim');
    svg.querySelectorAll('.lbl, .lbl-s, .lbl-xs, .ent').forEach(function (l) { l.classList.remove('hide'); });
    svg.querySelectorAll('.dots').forEach(function (d) { d.classList.add('on'); });
    svg.querySelectorAll('.rlab').forEach(function (r) { r.style.display = 'none'; });
    /* 巷名只留「平和街19巷」（見上面 LANES 那一段）。 */
    Array.prototype.forEach.call(lblXs, function (t, i) {
      t.style.display = (LANES[i] && LANES[i].off) ? 'none' : '';
    });
    /* ⚠ P3（斗六永樂站）不畫入口箭頭 —— 使用者指定；那一場從巷子進去只有一條路，
       站上那段註解本來就寫著「一看就知道，不需要標示」。 */
    svg.querySelectorAll('.ent').forEach(function (e) { e.style.visibility = 'visible'; });
    var entA = svg.querySelector('.lot[data-lot="a"] .ent');
    if (entA) entA.style.visibility = 'hidden';
    /* 綠塊裡原本那四個字與底線不畫，改成「現在位置」。 */
    ['.cm-nm', '.cm-ul'].forEach(function (sel) {
      var el = svg.querySelector(sel); if (el) el.style.display = 'none';
    });
    var blue = body.dataset.lotcolor !== 'grey';
    svg.querySelectorAll('.lot').forEach(function (g) { g.classList.toggle('on', blue); });
    you.style.display = body.dataset.you === 'off' ? 'none' : '';
    rebuildDots();
  }

  function measure(th, w, h) {
    var p = document.getElementById('pvPanel');
    var vb = svg.getAttribute('viewBox').split(' ').map(Number);
    var r = svg.getBoundingClientRect(), k = r.width / vb[2];
    var names = { w: '西（正對診所）', e: '東（站門口往外看）', n: '北', s: '南' };
    var sheet = document.querySelector('.sheet').getBoundingClientRect();
    var yb = you.getBBox(), pl = { w: w, h: h };
    p.innerHTML =
      '朝上：<b>' + names[body.dataset.orient] + '</b>（轉 ' + th + '°）　' +
      '紙張 ' + (body.dataset.size === 'l' ? 'A4 橫' : 'A4 直') +
      '　地圖 1 單位 ＝ ' + k.toFixed(3) + 'px<br>' +
      '綠塊轉過來是 <b>' + pl.w.toFixed(0) + '×' + pl.h.toFixed(0) + '</b> 個單位，' +
      '「現在位置」佔 ' + yb.width.toFixed(0) + '×' + yb.height.toFixed(0) +
      (yb.width < pl.w - 4 && yb.height < pl.h - 4 ? '　<b>整塊在綠色裡</b>' : '　<span style="color:#89202d">超出綠塊</span>') + '<br>' +
      '街名字級 ' + (22 * k).toFixed(1) + 'px　停車場代號：' +
      LOTS.map(function (L) {
        return L.tag + ' ' + (L.fs || 0).toFixed(1) + 'px（色塊 ' + (L.bw || 0).toFixed(0) + '×' +
               (L.bh || 0).toFixed(0) + '，字寬 ' + (L.w || 0).toFixed(0) + '，兩邊各留 ' +
               (((L.bw || 0) - (L.w || 0)) / 2).toFixed(0) + '）';
      }).join('、');
  }

  document.querySelectorAll('.pv-bar button[data-k]').forEach(function (b) {
    b.addEventListener('click', function () {
      body.dataset[b.dataset.k] = b.dataset.v;
      document.querySelectorAll('.pv-bar button[data-k]').forEach(function (x) {
        x.setAttribute('aria-pressed', String(body.dataset[x.dataset.k] === x.dataset.v));
      });
      poster(); paint();
    });
  });
  ['orient', 'size', 'lotcolor', 'you', 'ns', 'nw'].forEach(function (k) {
    var m = new RegExp('[?&]' + (k === 'lotcolor' ? 'lot' : k) + '=([a-z0-9]+)').exec(location.search);
    if (m) body.dataset[k] = m[1];
  });
  document.querySelectorAll('.pv-bar button[data-k]').forEach(function (x) {
    x.setAttribute('aria-pressed', String(body.dataset[x.dataset.k] === x.dataset.v));
  });

  function go() { poster(); paint(); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go);
  addEventListener('load', function () { setTimeout(go, 60); });
  addEventListener('resize', go);
  go();
})();

</script>
</body>
</html>
