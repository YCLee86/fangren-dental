<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>綁定完成的那一則・六案（芳仁牙醫診所）</title>
<!--
  提案頁：LINE 官方帳號「完成綁定」之後送出的那一則，六個版本。
  推導與定稿全文在 drafts/channels/README.md 第十九節，
  舊的逐輪紀錄在 drafts/line-auto-reply/README.md 第十四、二十、二十四節。

  ⚠ 這一頁模擬的是**病人的畫面**，不是後台。
  ⚠⚠ 字級一律寫**固定 px**（2026-09-03 招呼卡那一輪的教訓，channels/README 第 18-2 節）：
     LINE Flex 的 size 是固定 px（xxs 11／xs 13／sm 14／md 16／lg 19／xl 22／xxl 27），
     不是比例。寫成 rem 的話每一行都比 LINE 實際的小 1~2.7px，
     **提案頁一旦和真實算繪對不上，上面做的每一個判斷都是假的。**
  ⚠⚠ 但**純文字泡泡**那一側沒有這張表：聊天室的字級跟著使用者手機的「字體大小」設定走。
     這一頁用 16px（＝ Flex 的 md）畫，那是**假設，還沒用實機截圖校過**。
     所以 line-auto-reply/README 第 24-4 節那張「泡泡高 328px／39%」是用 13.76px 量的，
     偏小 —— 這一頁印出來的數字會比它大，那不是這一頁算錯。

  ⚠ 六案的差別是**結構**不是換字：
     Ⓐ 定稿（確認→功能→規則→沒有專人）　Ⓑ 同一份內容做成圖卡
     Ⓒ 有標籤的出口清單（＝自動回應那一則的排法）　Ⓓ 規則放到最前面
     Ⓔ 綁定之後這個帳號會做的三件事（國泰世華／玉山那一種）　Ⓕ 最短
  ⚠⚠ 事實查核紅線：這個帳號**沒有專人即時回覆訊息**，六案都不可以出現
     「有問題隨時問」那一類的承諾；國定假日休不休診**還沒問到**，所以只寫「週一至週五」。
  ⚠ class 一律 pv- 前綴（撞名的教訓見 CLAUDE.md 第八節）。
-->
<style>
:root{
  --paper:#e2e5e6; --card:#f4f4f5; --rule:#cdd0d2;
  --ink:#2a2c27; --ink-soft:#5c5f57; --green:#3f654a; --deep:#2c5238;
  /* LINE 那一側的顏色（別人的介面，不進 PALETTE.md） */
  --li-bg:#e9edf1; --li-in:#ffffff; --li-head:#ffffff; --li-meta:#8b96a1; --li-ink:#14181c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.7;padding-bottom:200px}
.pv-wrap{max-width:430px;margin:0 auto;padding:14px 14px 0}
h1{font-size:1rem;font-weight:700;letter-spacing:.02em}
.pv-sub{font-size:.78rem;color:var(--ink-soft);margin:.35rem 0 .9rem}
.pv-sub b{color:var(--ink)}

/* ---- 手機外框 ＋ LINE 聊天室 ---------------------------------------- */
.pv-phone{border:1px solid var(--rule);border-radius:14px;overflow:hidden;
  background:var(--li-bg);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.pv-head{background:var(--li-head);display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-bottom:1px solid #e3e6ea}
.pv-head .b{font-size:.9rem;font-weight:700;color:var(--li-ink)}
.pv-head .av{width:26px;height:26px;border-radius:50%;background:var(--deep)}
.pv-head .x{margin-left:auto;color:var(--li-meta);font-size:1rem;letter-spacing:.14em}
.pv-chat{padding:12px 8px 16px;display:flex;flex-direction:column;gap:10px}
/* ⚠⚠ 圖卡在 LINE 上是**固定 268px**，這個框放不下的話，上面量到的每一個數字都是假的
   —— 第一版在 390 的螢幕上只給了 243.4px（可用寬度因此少 25px，折行判斷全部偏鬆）。
   成因是我們比真手機多吃了兩層內距：頁面的 14 ＋ 聊天室的 11，左右合計 50px。
   真的 LINE 只留約 11px 的邊 ＋ 40px 頭像。所以窄螢幕讓手機框貼齊頁面兩邊，
   聊天室的內距也收到 8 —— 390 上因此還剩 300px 給卡片。
   ⚠ 320 以下仍然放不下（只剩 230），面板會現場報出來，不要當成沒事。 */
@media (max-width: 429px) {
  .pv-phone{margin-inline:-14px;border-radius:0;border-left-width:0;border-right-width:0}
}
.pv-day{align-self:center;background:rgba(0,0,0,.16);color:#fff;font-size:11px;
  padding:2px 11px;border-radius:11px}
.pv-sys{align-self:center;color:var(--li-meta);font-size:11px;text-align:center}

.pv-msg{display:flex;gap:7px;align-items:flex-end;max-width:100%}
.pv-msg.me{flex-direction:row-reverse;align-self:flex-end}
.pv-av{width:30px;height:30px;border-radius:50%;flex:none;background:var(--deep)}
/* ⚠⚠ 寬度限制要下在**這個盒子**上，不能下在裡面的泡泡上：泡泡的父層是 flex 項目、
   寬度是 shrink-to-fit（不定值），百分比的 max-width 對它解不出來，
   量出來的「可用寬度」會塌成 160px（實際是 244）—— 而且畫面看起來只是「泡泡有點窄」，
   不報錯。整頁的折行判斷會因此全部誤判。 */
#pv-slot{min-width:0;max-width:min(268px,72%)}
/* ⚠ 圖卡是**固定 268px**（Flex 的 mega），泡泡是**跟著字縮**（shrink-to-fit）——
   兩種需求不一樣，不能共用一條規則：卡片寫 width:100% 掛在 auto 寬的父層上，
   會退回 shrink-to-fit，量出來的可用寬度是假的（實測 240 變成 210）。 */
#pv-slot.card{flex:0 1 268px;max-width:268px}
.pv-msg.me .pv-av{visibility:hidden}
.pv-t{font-size:11px;color:var(--li-meta);flex:none;padding-bottom:2px}

/* ⚠⚠ 純文字泡泡的字級：LINE 聊天室跟著手機的「字體大小」設定走，
   這裡用 16px（＝ Flex 的 md）當基準，**是假設，要用實機截圖校一次**。 */
.pv-bub{background:var(--li-in);border-radius:15px;padding:9px 12px;
  font-size:16px;line-height:1.6;color:var(--li-ink);white-space:pre-wrap;
  max-width:100%;box-shadow:0 1px 1px rgba(0,0,0,.05);word-break:break-word}
.pv-msg.me .pv-bub{background:#6de67b}
.pv-bub .tel{color:#2b6cb0;text-decoration:underline}

/* ---- Ⓑ 圖卡（Flex Message）：卡片 268px、內距 14px，和招呼卡同一套 ---- */
.pv-hc{width:100%;border-radius:14px;overflow:hidden;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* 頭圖：Flex 的 hero，size:full ＋ aspectRatio 2:1 ＝ 卡片滿寬、高度是寬的一半。
   ⚠ width/height 屬性一定要寫（＋這裡的 aspect-ratio）—— 不寫的話圖還沒下載完
   高度是 0，量測面板會報出一個比實際矮 134px 的卡片。 */
.pv-hc .hero{display:block;width:100%;height:auto;aspect-ratio:2/1;object-fit:cover;
  background:#faf7e6}
.pv-hc .b{padding:14px 14px 0}
.pv-hc .t{font-size:16px;line-height:1.55;font-weight:700;letter-spacing:.01em;
  white-space:pre-line}
.pv-hc .d{font-size:14px;line-height:1.75;color:var(--ink-soft);margin-top:8px;
  white-space:pre-line}
.pv-hc hr{border:0;border-top:1px solid var(--rule);margin:14px 0 0}
.pv-hc .f{padding:0 14px 14px}
.pv-hc .say{font-size:14px;line-height:1.75;margin-top:14px;white-space:pre-line}
.pv-hc .btn{display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:9px;padding:11px 12px;margin-top:8px;background:var(--green);color:#fff;
  font-size:16px;font-weight:700;letter-spacing:.02em}
/* ⚠ 這一顆**不需要圖示**，所以用 Flex 原生的 `button` 就夠了 —— 招呼卡那兩顆做成
   「可點的盒子」是因為要加 logo（Flex 的 button 只有 label、不支援圖示）。 */
/* 24 小時那一段的四種強調（只有圖卡做得到；純文字泡泡那一側只能靠空行與記號）。
   ⚠ 四種在 Flex 上都做得出來：加粗＝text.weight bold、換色＝text.color、
     淡底方塊＝一個有 backgroundColor ＋ cornerRadius ＋ paddingAll 的 box。
   ⚠ 磚紅 #AF4C52 是站上既有的 --brick（PALETTE 第一節），**它對紙只有 4.17，
     只能待在卡上** —— 這裡的底正是卡色，面板會現場量給你看。 */
.pv-hc .d.w-b{color:var(--li-ink);font-weight:700}
.pv-hc .d.w-bc{color:#AF4C52;font-weight:700}
.pv-hc .d.w-box{color:var(--li-ink);font-weight:700;background:rgba(175,76,82,.09);
  border-radius:8px;padding:10px 12px;margin-top:12px}
/* 改約那一段的淡底方塊（2026-09-04 使用者：「這一段也用淡底方塊好了　可以用不同顏色的淡底嗎」）。
   ⚠ 可以 —— Flex 的 box 就是一個 backgroundColor，想要什麼顏色都行。
     四格全部取自站上既有的色（PALETTE 第一節），**沒有新增任何顏色**：
       紙灰＝--paper 直接鋪（站上頁面的底色）
       品牌綠＝一般牙科的套色 #3f654a 九分之一濃
       深綠松＝全站連結色 #214D48 九分之一濃
       淡藍＝矯正那一支 #4478b5 十六分之一濃
       同上面＝和 24 小時那一塊一樣的磚紅
   ⚠⚠ **淡藍取的是矯正的套色，不是官方色票那支藍 `--blue #3C596B`** —— 量過，
     官方那支在這個濃度只有 **C\* 2.5**（和品牌綠 2.7 一樣），眼睛讀到的是「深一點的灰」
     不是藍；矯正那一支是 **C\* 6.3**，全站唯一在淡底還讀得出色相的藍。
     **代價：它是齒顎矯正的套色。** 這一張卡和科別無關，撞不到，但要知道。
   ⚠⚠ **深綠松那一格拿掉了** —— .16 時 L\*86.2・C\*2.5，和品牌綠（87.6／2.7）
     只差 1.4 階，等於同一格（同上面那條「差不出來的尺比沒有尺還糟」）。
   ⚠⚠ **綠與深綠松是 .16 不是 .09，那不是漏改成一致** —— 量過：在這張卡上（卡色 #f4f4f5）
     九分之一濃的綠 L*91.4、深綠松 90.6、紙灰 90.7、磚紅 91.7，**四個全部落在 1.1 階之內**，
     彩度也小到看不出來，等於四格長得一模一樣、這把尺沒有意義。
     要真的讀得出「這是綠的」就得到 .16（L*87.6／86.2）。
     **代價寫在說明裡：那樣它會比上面那塊磚紅重約 4 階。**
   ⚠ 兩塊都用方塊之後，中間那條分隔線就多餘了（兩塊自己就分開了），
     所以有 warn 的那一案不畫 hr。 */
.pv-hc .say.sbox{border-radius:8px;padding:10px 12px;margin-top:12px}
.pv-hc .say.s-pa{background:var(--paper)}
.pv-hc .say.s-gr{background:rgba(63,101,74,.16)}
.pv-hc .say.s-bl{background:rgba(68,120,181,.16)}
.pv-hc .say.s-br{background:rgba(175,76,82,.09)}
.pv-hc .fine{font-size:13px;line-height:1.75;color:var(--ink-soft);margin-top:11px;
  white-space:pre-line}

/* ---- 量測面板 -------------------------------------------------------- */
.pv-cap{font-size:.74rem;color:var(--ink-soft);margin:9px 2px 0}
.pv-panel{margin:12px 0 0;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);padding:9px 11px;font-size:.73rem;line-height:1.85;
  color:var(--ink-soft)}
.pv-panel b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.pv-panel .ok{color:var(--deep);font-weight:700}
.pv-panel .no{color:#a33;font-weight:700}
.pv-panel hr{border:0;border-top:1px solid var(--rule);margin:7px 0}
.pv-note{font-size:.73rem;color:var(--ink-soft);margin:12px 0 0;
  border-left:3px solid var(--rule);padding-left:10px}
.pv-note b{color:var(--ink)}
.pv-note code{font-size:.94em;overflow-wrap:anywhere}

/* ---- 切換條 ---------------------------------------------------------- */
.pv-bar{position:fixed;left:0;right:0;bottom:0;z-index:9;
  background:rgba(226,229,230,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--rule);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.pv-bar .in{max-width:430px;margin:0 auto}
.pv-bar .lb{font-size:.68rem;color:var(--ink-soft);margin:0 0 4px}
.pv-bar .row{display:flex;gap:5px;flex-wrap:wrap}
.pv-bar button{flex:1 1 0;min-width:52px;font:inherit;font-size:.74rem;line-height:1.25;
  padding:7px 4px;border:1px solid var(--deep);border-radius:8px;background:transparent;
  color:var(--deep);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pv-bar button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.pv-bar .row2{margin-top:6px}
.pv-bar .row2 button{flex:1 1 0}
</style>
</head>
<body>
<div class="pv-wrap">
  <h1>綁定完成的那一則</h1>
  <p class="pv-sub">病人在綁定頁按完成之後，聊天室裡會出現的那一則。
  <b>八案</b>，差的是<b>結構</b>不是字。底下那條可以切。<br>
  <b>Ⓖ／Ⓗ 是你 2026-09-04 自己整理的那一份</b>（同一份內容，一個純文字、一個圖卡）。</p>

  <div class="pv-phone">
    <div class="pv-head"><span class="av"></span><span class="b">芳仁牙醫診所</span><span class="x">⋯</span></div>
    <div class="pv-chat">
      <div class="pv-day">今天</div>
      <div class="pv-msg me"><span class="pv-av"></span>
        <div class="pv-bub" id="pv-mine">✅ 綁定成功！</div>
        <span class="pv-t">14:07</span></div>
      <div class="pv-msg"><span class="pv-av"></span>
        <div id="pv-slot"></div>
        <span class="pv-t">14:07</span></div>
      <div class="pv-sys">此官方帳號正在自動回覆訊息</div>
    </div>
  </div>
  <p class="pv-cap">↑ 綠色那一則是<b>廠商系統以病人的身分送出的</b>「綁定成功」，
  下面那一則才是我們寫的。⚠ 近似，不是 LINE 自己的算繪。</p>

  <div class="pv-panel" id="pv-panel"></div>
  <p class="pv-note" id="pv-note"></p>
</div>

<div class="pv-bar">
  <div class="in">
    <p class="lb" id="pv-lb">版本</p>
    <div class="row" id="pv-vrow"></div>
    <div class="row row2" id="pv-hrow"></div>
    <div class="row row2" id="pv-erow"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ⚠⚠ 斷行一律用 \n 自己指定，不要交給自動換行（line-auto-reply/README 第 24-3 節）：
     六個寬度量過，自動斷會把詞劈開、或讓末行只剩一兩個字。
     規則：每一行不超過 14 個全形字寬（半形算 0.5）。
     ⚠ 電話一定要自己一行 —— 和別的字擠在一起時，折行會把 05- 和 5339369 拆開，
       LINE 就認不出那是號碼、不會變成可以撥的連結。
     ⚠⚠ {T}（提醒的時間怎麼講）2026-09-04 定案「看診前 48 小時」（使用者：「改成前48小時」），
       切換條上那一排（2 天／48 小時）已經收掉、值寫死在 T_LABEL。
       這也讓它和 2026-09-03 定案的招呼圖卡對上了（那一張寫的就是「看診前 48 小時」）。
     ⚠⚠ 這個 48 小時和「約診要改或取消，請在看診日的**兩天前**」是**兩個不同的數字**：
       前者是系統什麼時候提醒，後者是診所收改約的期限（而且不含假日）。
       看起來不一致，但不要順手改成一致 —— 改了就是在改診所的規定。 */

  var V = {
    a: {
      name: "Ⓐ 定稿", kind: "text",
      note: "2026-09-02 定稿那一版（line-auto-reply/README 第 24-2 節「貳」）逐字，只把時間的說法接上切換條。順序是使用者自己列的：綁定拿到什麼 → 改約的最晚時限 → 沒有專人。",
      text:
        "綁定完成了。\n\n" +
        "看診前 {T}這裡會提醒你。\n" +
        "想看自己的約診，\n" +
        "點下面選單的「約診查詢」。\n" +
        "家人的約診也可以綁在一起。\n\n" +
        "約診要改或取消，\n" +
        "請在看診日的兩天前，\n" +
        "不含假日，打電話告訴診所：\n" +
        "05-5339369\n\n" +
        "這裡沒有專人即時回覆訊息，\n" +
        "有狀況請在開診時間打給診所。"
    },
    b: {
      name: "Ⓑ 圖卡", kind: "card",
      hero: "hero-bind.jpg",
      note: "同一份內容做成 Flex 圖卡，和 2026-09-03 定案的招呼卡同一套（卡 268px、內距 14px、分隔線），上面加了 2026-09-03 定案的頭圖〈創造亞當〉診間版（1024×512，2:1，size:full）。⚠⚠ <b>2026-09-04 把那顆實心綠的「撥打電話」按鈕拿掉了</b>（你：「診所電話在這裡不要做成按鈕，因為那只是一個說明，做成按鈕的用意是要讓人點下去」）—— 號碼回到說明句裡、自己一行。這也和招呼卡一致（那一張本來就刻意沒有撥電話的按鈕）。⚠⚠ 要先問廠商：關鍵字回應送不送得出 Flex Message。",
      title: "綁定完成了",
      desc: "看診前 {T}會在這裡提醒你\n想看自己的約診，點下面選單的\n「約診查詢」\n家人的約診也可以綁在一起",
      say: "約診要改或取消，請在看診日的\n兩天前（不含假日）打電話\n05-5339369",
      fine: "週一至週五開診時間都有人接\n這裡沒有專人即時回覆訊息"
    },
    c: {
      name: "Ⓒ 出口清單", kind: "text",
      note: "早安美芝城／星宇航空那一種：標籤自己一行、內容縮排兩層（channels/README 第十一節）。好處是**和自動回應那一則排法一致** —— 病人在這個帳號上看到的每一則都長同一個樣子。",
      text:
        "綁定完成了。\n" +
        "看診前 {T}，\n這裡會提醒你的約診。\n\n" +
        "改約或取消　05-5339369\n" +
        "　看診日的兩天前，不含假日\n" +

    /* ⚠ 2026-09-04 起圖卡沒有電話按鈕了，號碼在說明句裡 —— 要掃整張卡不是只掃按鈕 */
    var hasTel = fill(v.kind === "text" ? textOf(v)
      : [v.say, v.btn || "", v.fine].join("\n")).indexOf("05-5339369") >= 0;

    /* 紅線掃描（和 drafts/channels/check-welcome.mjs 同一張表）：
       這個帳號沒有專人即時回覆訊息，所以不可以出現「有人可以問」那一類的承諾。 */
    var LIE = ["隨時問", "都可以問", "問到", "有人回", "馬上回", "找得到人", "有專人"];
    var whole = v.kind === "text" ? fill(textOf(v))
      : [v.title, v.desc, v.desc2 || "", v.warn || "", v.say, v.btn || "", v.fine].map(fill).join("\n");
    /* ⚠⚠ 掃之前要先把**否定形**拿掉：六案每一案都寫著「這裡沒有專人即時回覆訊息」，
       而那句話裡面就含著「有專人」—— 第一版整頁誤報「說謊」，正好報在守得最好的那一句上。
       （drafts/channels/check-welcome.mjs 那張表有同一個洞，只是招呼卡沒寫到這句話。） */
    var scan = whole.replace(/沒有專人/g, "\uff3f").replace(/無專人/g, "\uff3f");
    var lied = LIE.filter(function (w) { return scan.indexOf(w) >= 0; });

    /* 強調那一段的對比度：圖卡才量得到（純文字那一側顏色是 LINE 給的，我們動不了）。
       ⚠ 底要用**合成後**的顏色 —— 淡底方塊是半透明的磚紅疊在卡色上，
         直接讀 rgba 會算錯。 */
    function lum(c) {
      var m = c.match(/[\d.]+/g).map(Number), a = m.length > 3 ? m[3] : 1;
      return { r: m[0], g: m[1], b: m[2], a: a };
    }
    function rel(c) {
      return [c.r, c.g, c.b].map(function (x) {
        x /= 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4);
      }).reduce(function (a, x, i) { return a + x * [.2126, .7152, .0722][i]; }, 0);
    }
    function ratio(fg, bg) {
      var a = rel(fg) + .05, b2 = rel(bg) + .05;
      return a > b2 ? a / b2 : b2 / a;
    }
    function boxCt(el) {
      if (!el) return null;
      var cs2 = getComputedStyle(el), card = lum(getComputedStyle(body).backgroundColor);
      var wb = lum(cs2.backgroundColor), fg = lum(cs2.color);
      var bg = wb.a === 0 ? card : {
        r: wb.r * wb.a + card.r * (1 - wb.a),
        g: wb.g * wb.a + card.g * (1 - wb.a),
        b: wb.b * wb.a + card.b * (1 - wb.a)
      };
      return ratio(fg, bg);
    }
    var warnCt = boxCt(body.querySelector(".d[class*=' w-'], .d[class^='w-']"));
    var sayCt = boxCt(body.querySelector(".say.sbox"));

    document.getElementById("pv-panel").innerHTML =
      "<b>" + v.name + "</b>　<span>" + (v.kind === "text" ? "純文字泡泡" : "Flex 圖卡（268px）") + "</span>"
      + (v.kind === "card"
          ? "<br>卡片實寬 " + (cardW >= 267.5
              ? "<span class='ok'>268px（＝LINE 的真值）</span>"
              : "<span class='no'>" + cardW.toFixed(0) + "px —— 這個螢幕放不下 268，"
                + "下面的折行判斷偏鬆 " + (268 - cardW).toFixed(0) + "px</span>")
          : "")
      + "<br>高 <b>" + h.toFixed(0) + "px</b>　佔你這一屏 <b>" + (h / vh * 100).toFixed(0) + "%</b>"
      + "　字數 <b>" + whole.replace(/\s/g, "").length + "</b>"
      + (v.hero
          ? "<br>頭圖 " + (hr === "y"
              ? "<b>" + hh.toFixed(0) + "px</b>（占這張卡 <b>" + (hh / h * 100).toFixed(0)
                + "%</b>，文字那半 <b>" + (h - hh).toFixed(0) + "px</b>）"
              : "<span>沒放 —— 放了會長 " + (avail + 28).toFixed(0) + " × 0.5 ≈ 134px</span>")
          : "")
      + "<br>自己斷 <b>" + sp.length + " 行</b>，你這台畫出 <b>" + ls.length + " 行</b>"
      + (over > 0 ? "（多的 " + over + " 行是被再折一次的）" : "<span class='ok'>（一行都沒被再折）</span>")
      + "<br>孤字 "
      + (orphan.length
          ? "<span class='no'>" + orphan.length + " 行：「"
            + orphan.map(function (o) { return o.s; }).join("」「") + "」</span>"
          : "<span class='ok'>沒有</span>")
      + "<br>最寬的一行 <b>" + wide.toFixed(0) + "px</b>／可用到 <b>" + avail.toFixed(0) + "px</b>"
      + " <span>（" + widest.slice(0, 12) + "）</span>"
      + "<br>電話沒被折斷 " + (!hasTel ? "<span class='no'>這一案沒有電話</span>"
          : telOwn ? "<span class='ok'>是（撥得下去）</span>"
                   : "<span class='no'>否 —— 折開了，LINE 認不出那是號碼</span>")
      + (warnCt !== null
          ? "<br>強調那三行的對比 <b>" + warnCt.toFixed(2) + "</b>"
            + (warnCt >= 4.5 ? " <span class='ok'>過 AA</span>"
                             : " <span class='no'>低於站上的 4.5</span>")
          : "")
      + (sayCt !== null
          ? "　改約那一塊 <b>" + sayCt.toFixed(2) + "</b>"
            + (sayCt >= 4.5 ? " <span class='ok'>過 AA</span>"
                            : " <span class='no'>低於 4.5</span>")
          : "")
      + "<br>沒有專人那件事 "
      + (lied.length ? "<span class='no'>出現「" + lied.join("、") + "」</span>"
                     : "<span class='ok'>守住了</span>")
      + "<hr>" + v.note;

    document.getElementById("pv-note").innerHTML =
      "⚠⚠ <b>這一則卡在廠商</b>：現在綁定完那一刻，廠商的系統會**以病人的身分**把"
      + "「✅ 09xxxxxxxx 綁定成功！」寫進聊天室（上面那顆綠泡泡），觸發的是<b>自動回應</b> —— "
      + "自動回應對「病人送出任何訊息」都會回。<b>號碼每個人不一樣，關鍵字回應是完全一致比對，抓不到。</b>"
      + "所以要有這一則專屬的，得請廠商把那句話改成<b>不含號碼的固定字串</b>（或改由官方帳號推播）。"
      + "改不了的話，這一則只能和<b>自動回應共用同一則</b>，那就不能寫「綁定完成了」"
      + "（打字問事情的人會一頭霧水）。"
      + "<br>⚠⚠ <b>頭圖只有 Ⓑ 放得了</b>：LINE 的純文字訊息裡放不了圖，"
      + "其餘五案要有圖就得變成<b>兩則</b>（一張圖訊息 ＋ 一則文字），"
      + "而綁定完成這一刻連發兩則太吵。所以「要圖」等於「要圖卡」。"
      + "<br>⚠ 頭圖 <code>hero-bind.jpg</code> 是 <b>1024×512（2:1）</b>，"
      + "從 Gemini 出的 1376×768 上下各裁 40 列來的（<code>node drafts/bind-done-hero-crop.mjs</code>）。"
      + "<b>不是 1040×520</b> —— LINE 對 Flex 的 <code>image</code> 寫著上限 1024×1024，"
      + "<b>招呼圖卡那張 1040×520 要回去重切</b>。"
      + "<br>⚠⚠ 上線前圖要放到 <code>https://fangren.net/assets/line/hero-bind.jpg</code>（Flex 只吃 HTTPS 的網址）——"
      + "<b>那個資料夾還不存在</b>，<code>tools/dist.mjs</code> 也還沒有它（CLAUDE.md 第十一之七節第 3 項）。"
      + "<br>⚠⚠ <b>時間的說法 2026-09-04 定案「看診前 48 小時」</b>（你：「改成前48小時」），"
      + "切換條上那一排（2 天／48 小時）已經收掉、值寫死在這一頁裡。"
      + "<br>⚠⚠ <b>但招呼圖卡目前仍然寫「看診前2天發送提醒通知喔～」</b>（<code>welcome-card.json</code>，"
      + "那一則是你自己逐字寫的、2026-09-03 已定案），所以現在<b>兩則不一樣</b>。"
      + "要統一的話動的是你自己寫的那一句，<b>沒有你點頭我不會改</b>。"
      + "兩者是同一個時間點，只是講法不同。"
      + "<br>⚠⚠ <b>不寫「不克前往，預約改期」那顆按鈕</b>：提醒卡上那顆按下去只是系統顯示取消，"
      + "而且按的當下已經違反「兩天前」的協議。三則一律把改約指向<b>電話</b>。"
      + "也<b>不寫「不要按那顆」</b> —— 否定句只會讓它更醒目。"
      + "<br>⚠⚠ <b>Ⓖ／Ⓗ 的改約那一句 2026-09-04 換成你的寫法</b>（逐字）："
      + "「約診更改或取消，最晚請於看診日前 2 天（不含假日）、於診所開診時段來電變更」。"
      + "它比原本那句好在兩件事：<b>「最晚」把期限講死了</b>（原本的「請在…2 天前」讀起來像建議），"
      + "以及<b>拿掉「週一至週五」改成「開診時段」</b> —— 站上門診表底下寫的是"
      + "「國定假日與各科特別門診請來電確認」、<b>不是休診</b>，國定假日到底休不休診還沒問到，"
      + "寫「開診時段」就不必替診所把那一題答掉。"
      + "<br>⚠ 其餘六案（Ⓐ Ⓒ Ⓓ Ⓔ Ⓕ Ⓑ）仍然是舊寫法「週一至週五開診時間都有人接」，"
      + "<b>那是刻意沒動</b>：它們是不同結構的候選，等你挑完哪一案再統一。"
      + "<br>⚠ 電話一律 <code>05-5339369</code>（2026-08-27 全站定案的寫法）。"
      + "<br>⚠⚠ <b>2026-09-04：兩張圖卡的電話按鈕都拿掉了</b>（你：「那只是一個說明，"
      + "做成按鈕的用意是要讓人點下去」），號碼回到說明句裡、<b>自己一行</b>。"
      + "自己一行是硬條件 —— 和別的字擠在一起時，折行會把 <code>05-</code> 和 "
      + "<code>5339369</code> 拆開。"
      + "<br>⚠⚠ 但要知道一件事：<b>純文字訊息（Ⓖ）LINE 會自動把號碼變成可以撥的</b>"
      + "（上面那一案的藍底線就是），<b>Flex 圖卡裡的文字不會</b>。所以 Ⓑ／Ⓗ 的號碼"
      + "現在<b>看起來、也就是一行字</b>。要它仍然撥得下去，就在那一行掛一個 "
      + "<code>tel:+88655339369</code> 的 action —— <b>外觀完全不變</b>，只是點得下去。"
      + "<b>要不要掛，你說。</b>"
      + "<br>⚠⚠ <b>圖卡那一側 2026-09-04 定案「淡底方塊」</b>（你：「上面的淡底方塊我比較喜歡」），"
      + "已經收成寫死的值、從切換條上拿掉（落選：不強調／加粗／加粗＋磚紅）。"
      + "面板仍然現場量那三行的對比（<b>14.42</b>，底是半透明磚紅疊在卡色上、要用合成後的顏色算）。"
      + "<br>⚠⚠ <b>改約那一段也做成淡底方塊了</b>（你：「這一段也用淡底方塊好了」），"
      + "而且<b>可以換顏色</b> —— Flex 的 box 就是一個 backgroundColor，想要什麼色都行。"
      + "底下那一排四格全部取自站上既有的色，<b>沒有新增任何顏色</b>。"
      + "<br>⚠⚠ <b>但綠與淡藍是 .16 不是 .09 —— 這件事要先講。</b>"
      + "量過：在這張卡上（卡色 <code>#f4f4f5</code>）九分之一濃的<b>綠 L*91.4／深綠松 90.6／"
      + "紙灰 90.7／磚紅 91.7</b>，<b>四個全部落在 1.1 階之內</b>，彩度也小到看不出來 —— "
      + "等於四格長得一模一樣，那把尺就沒有意義。要真的讀得出「這是綠的」得到 <b>.16</b>"
      + "（L*87.6）。<b>代價：那樣它會比上面那塊磚紅重約 4 階。</b>"
      + "想要兩塊等重就選<b>紙灰</b>或<b>同上面</b>。"
      + "<br>⚠⚠ <b>2026-09-04：加了淡藍那一格，深綠松那一格拿掉了。</b>"
      + "拿掉是因為它 .16 量出來是 <b>L*86.2・彩度 2.5</b>，和品牌綠的 <b>87.6・2.7</b> "
      + "幾乎一樣 —— <b>兩格分不出來，等於白佔一格</b>。"
      + "<br>⚠⚠ 淡藍<b>不能用官方色票那支藍</b> <code>#3C596B</code>：它自己就偏灰，"
      + "淡到 .16 彩度只剩 <b>2.5</b>，讀起來是「比較深的灰」不是藍。"
      + "定案取的是<b>齒顎矯正那支套色</b> <code>#4478b5</code>（.16 → 彩度 <b>6.3</b>，"
      + "站上唯一淡開之後還讀得出是藍的）。<b>已知取捨：它是矯正的顏色</b> —— "
      + "但這一則不在站上、也不在任何科別的頁面裡，不會和標記撞在一起。"
      + "<br>⚠ 四格的字對底都在 <b>10.2~11.4</b>，沒有一格卡到可讀性。"
      + "<br>⚠⚠ <b>2026-09-04：數字前後那幾個半形空格拿掉了</b>（你：「數字…的全形空格太大」）——"
      + "現在是「看診前48小時」「若24小時內無回應」「看診日前2天」，"
      + "<b>和你自己寫過來的那一份逐字相同</b>。"
      + "同一輪把「（不含假日）」的<b>全形括號換成半形</b> <code>(不含假日)</code>："
      + "全形括號自己就佔一個全形字寬、而且左右各留一半的空，一組就吃掉約 <b>19px</b>。"
      + "<br>⚠⚠ <b>Ⓗ 那兩段之間的空行也收掉了</b>（你：「查看之後的約診 和 看診48小時發送訊息 的間隔也很大」）——"
      + "原本是同一段裡打一個 <code>\\n\\n</code>（<b>24.5px</b>），改成拆成兩段、"
      + "由段落自己的上外距接（<b>8px</b>），省下 16.5px。Flex 那邊就是兩個 "
      + "<code>text</code> 加一個 <code>margin</code>，不是一個 text 裡打兩個換行。"
      + "<br>⚠ <b>Ⓖ（純文字）那一段沒有動</b> —— 純文字訊息沒有段落間距這種東西，"
      + "唯一能拉開兩段的就是空行。"
      + "<br>⚠ <b>中間那條分隔線拿掉了</b>：兩塊都變成方塊之後，它們自己就分開了，"
      + "再加一條線是多一個分隔。<b>要留著跟我說。</b>"
      + "<br>⚠⚠ <b>純文字泡泡那一側還沒定案，那一排還在</b> —— 它<b>做不出方塊</b>："
      + "LINE 的純文字訊息<b>沒有粗體、也沒有顏色</b>，能用的只有「空一行」與「加一個記號」。"
      + "所以切到 Ⓖ 才會看到那一排，切到 Ⓗ 不會。"
      + "<br>⚠ <b>「怎麼確認」那一題等 48 小時提醒那一頁</b>：版型與確認的按鈕在那邊定，"
      + "定完再回來決定這一則要不要多寫一句。"
      + "<br>⚠⚠ <b>更正（2026-09-03 稍晚）：那句「390 的手機只給 219px」是這一頁自己量錯的。</b>"
      + "為了讓圖卡能是真的 268px，這一頁的手機框在窄螢幕改成貼齊頁面兩邊（原本多吃了 25px 的內距）——"
      + "重量之後泡泡的上限是 <b>244px</b>（＝ 268 扣掉左右內距 24），"
      + "所以 <b>Ⓐ（定稿逐字）在 430／393／390／375 都不會折</b>，它最寬那一行是 224px、還剩 20px。"
      + "<b>360 上會折一行「所。」</b>（那個寬度的上限掉到 224，只差 0.3px），320 上六案都會折。"
      + "<br>⚠ <b>但「一行 13~14 個全形字」這條還是留著</b>：16px 下 244px 放得下 15 個字，"
      + "可是 LINE 的字級跟著<b>使用者手機的字體大小設定</b>走，設大一階（約 18~19px）"
      + "14 個字就變成 252~266px、照樣折。Ⓒ~Ⓕ 是照 13 個字斷的，那是給那一階留的餘裕。"
      + "<br>⚠⚠ 純文字那五案畫在 <b>16px</b> 上，那是<b>假設</b> —— LINE 聊天室的字級跟著使用者手機的"
      + "「字體大小」設定走，沒有 Flex 那張固定 px 的表。要定案前<b>用實機截圖校一次</b>。"
      + "（Ⓑ 圖卡那一案是照 Flex 的表畫的：md 16／sm 14／xs 13。）";
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-v], button[data-h], button[data-e], button[data-s]");
    if (!b) return;
    if (b.dataset.v) cur = b.dataset.v;
    else if (b.dataset.h) hr = b.dataset.h;
    else if (b.dataset.e) em = b.dataset.e;
    else sb = b.dataset.s;
    history.replaceState(null, "", "?v=" + cur + "&h=" + hr + "&e=" + em + "&s=" + sb);
    render();
  });
  window.addEventListener("resize", measure);
  render();
})();
</script>
