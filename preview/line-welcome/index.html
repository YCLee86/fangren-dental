<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>招呼圖卡</title>
<!--
  加入好友的招呼圖卡（LINE Flex Message）。JSON 在 drafts/channels/welcome-card.json。

  ✅ 2026-09-03 文案由使用者定稿（逐字）：
      歡迎加入芳仁牙醫的官方LINE
      下面有一排選單／診所的資訊都在裡面
      綁定芳仁牙醫LINE／看診前2天發送提醒通知喔~　(加logo)點這裡綁定
      家人或朋友要找牙醫／歡迎把芳仁傳過去　(加logo) 介紹芳仁給朋友

  ⚠⚠ 「加 logo」這件事逼出一個結構改動：**LINE Flex 的 `button` 只有 label，
    不支援圖示**。所以兩顆按鈕都改成**可點的 box**（box 掛 action），裡面 image ＋ text。
    代價是失去按鈕內建的按壓效果，換來完全的排版控制。
  ⚠ logo 要**兩顆不同顏色**（白／深階綠）：透明底的暗綠疊在綠底上會看不見。
    由 drafts/channels/mark-png.mjs 產生。
  ⚠⚠ 2026-09-03 稍晚：**兩顆是兩個不同的形狀**（使用者：「介紹芳仁給朋友的 logo
    選 shape_r2c3」）—— 綁定那顆是 index.html 頁首那一條（長寬比 2.029），
    介紹那顆是 brand/shapes/shape-r2c3.svg（細長那一顆，3.081）。
    **Flex 的 `size` 給的是寬度**，所以兩顆不能都寫 34px（細長那顆只會有 11px 高）。
    三格看過：52（＝等高，比白那顆重）／**47（定案，兩顆讀起來一樣大）**／42（＝等墨面積，比字還矮）。

  ⚠ 兩處照站上慣例補的，不是改他的字：
    ・「官方 LINE」中間加半形空格（站上一律這樣寫）
    ・「喔～」用全形波浪
  ⚠ 「看診前 2 天」＝ 機器那邊的 48 小時，只是換成講話的說法，時間點沒有動。

  ⚠ 字級一律寫固定 px —— LINE Flex 的 size 就是固定 px
    （xxs 11／xs 13／sm 14／md 16／lg 19／xl 22）。
  ⚠⚠ 事實查核：這個帳號**沒有專人即時回覆訊息**，所以卡片上不可以出現
    「有問題隨時問」那一類的承諾。check-welcome.mjs 有一道掃描擋著。
-->
<style>
:root{--paper:#e2e5e6;--card:#f4f4f5;--ink:#2a2c27;--ink-soft:#5c5f57;--rule:#cdd0d2;
  --green:#3f654a;--deep:#2c5238;--chat:#e9edf1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding:18px 16px 40px}
h1{font-size:1.12rem;margin:0 0 6px;letter-spacing:.01em}
.lede{color:var(--ink-soft);font-size:.86rem;margin:0 0 16px}
.lede b{color:var(--ink)}

.chat{background:var(--chat);border-radius:12px;padding:12px 10px}
.chat .day{text-align:center;font-size:.66rem;color:#7b8794;margin-bottom:9px}
.row{display:flex;gap:8px;align-items:flex-start}
/* ⚠⚠ min-width:0 不能刪：按鈕標籤是 nowrap，卡片的 min-content 會被撐大，
   flex 項目預設 min-width:auto，360 寬會多水平捲動。
   ⚠ 但不要加 flex:1 —— 加了卡片會塌掉，量出來的可用寬度整組是假的。 */
.row > div{min-width:0}
.av{flex:none;width:26px;height:26px;border-radius:50%;background:var(--deep)}

.hc{width:268px;max-width:100%;border-radius:14px;overflow:hidden;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hc .hero{display:block;width:100%}
.hc .b{padding:14px 14px 0}
.hc .sp{font-style:normal;font-size:9px}
.hc .hi{margin:0;white-space:pre-line;font-size:16px;line-height:1.55;font-weight:700;letter-spacing:.01em}
.hc .menu{margin:8px 0 0;white-space:pre-line;font-size:14px;line-height:1.75;color:var(--ink-soft)}
.hc hr{border:0;border-top:1px solid var(--rule);margin:14px 0 0}
.hc .f{padding:0 14px 14px}
.hc .say{margin:14px 0 0;white-space:pre-line;font-size:14px;line-height:1.75}
/* ⚠⚠ 按鈕上要放 logo，而 LINE Flex 的 `button` **只有 label、不支援圖示**。
   所以按鈕做成一個**可點的 box**（box 掛 action），裡面 image ＋ text。
   代價是失去按鈕內建的按壓效果，換來完全的排版控制。 */
.hc .btn{display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:9px;padding:11px 12px;margin-top:8px;overflow:hidden}
/* ⚠ 兩顆 logo 的**寬度不一樣**（形狀不一樣、要一樣大）——
   這裡的值要和 welcome-card.json 的 `size` 逐字相同，check-welcome.mjs 會比對 */
.hc .btn img{flex:none;display:block}
.hc .btn.fill img{width:34px}
.hc .btn.line img{width:34px}
.hc .btn span{font-size:16px;line-height:1.3;font-weight:700;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .btn.fill{background:var(--green);color:#fff}
.hc .btn.line{border:1px solid var(--deep);color:var(--deep);background:transparent}

.cap{font-size:.78rem;color:var(--ink-soft);margin:9px 2px 0}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:10px 12px;font-size:.78rem;line-height:1.85;margin-top:14px}
.panel b{color:var(--ink);font-variant-numeric:tabular-nums}
.panel .k{color:var(--ink-soft)}
.panel .no{color:#a33;font-weight:700}
.panel .ok{color:var(--deep);font-weight:700}
.note{border-left:3px solid var(--rule);padding-left:11px;color:var(--ink-soft);
  font-size:.79rem;margin-top:13px}
.note code{font-size:.94em;overflow-wrap:anywhere;word-break:break-all}
</style>
</head>
<body>
<h1>招呼圖卡</h1>
<p class="lede"><b>已定案</b>（2026-09-03）。這一頁留著當<b>規格頁</b> ——
之後要和其他 LINE 的功能頁一起彙總給廠商看。<br>
兩顆按鈕都有 <b>logo</b>：Flex 的按鈕不支援圖示，所以改成<b>可點的盒子</b>（圖示＋文字）。</p>

<div class="chat">
  <div class="day">今天</div>
  <div class="row"><div class="av"></div><div id="card"></div></div>
</div>
<p class="cap">↑ 聊天室裡的真實大小（卡片 268px 寬）。⚠ 近似，不是 LINE 自己的算繪。</p>

<div class="panel" id="panel"></div>
<p class="note" id="note"></p>

<script>
(function () {
  "use strict";
  var SHARE = "https://line.me/R/nv/recommendOA/@445rpiiv";
  /* ⚠⚠ 斷行用 \n **自己指定**，不要交給瀏覽器。量過五個寬度，自動斷行會斷出
     「…的官／方 LINE」（把一個詞劈開）、「…LINE／裡」「…傳給／他」（末行剩一個字）。
     LINE Flex 的 text 只要 wrap:true 就吃 \n，兩邊做法一樣。
   ⚠ 斷在哪就把那個逗號拿掉 —— 換行已經是停頓了，再加逗號是停兩次。 */
  var MENU  = "下面有一排選單\n診所的資訊都在裡面";
  var SAY_BIND  = '綁定芳仁牙醫<i class="sp"> </i>LINE\n看診前 2 天發送提醒通知喔～';
  var SAY_SHARE = "家人或朋友要找牙醫\n歡迎把芳仁傳過去";

/* ⚠ 「官方 LINE」中間那個空格**縮成 9px**（使用者：「LINE 前面的空格短小一點」）。
   量到：半形空格 3.89px → 縮到 9px 之後 2.52px（窄 35%）。
   ⚠⚠ 用的是**普通的半形空格 ＋ 把它縮小**，不是 U+2009／U+200A 那種細空格 ——
     細空格要看系統字型有沒有那個字，沒有就可能變成豆腐字；縮小普通空格的最壞
     情況只是「維持現在的寬度」，不會壞掉。Flex 那邊對應的是 span 的 size。 */
  var HI = '歡迎加入芳仁牙醫的官方<i class="sp"> </i>LINE';

  function render() {
    document.getElementById("card").innerHTML =
      '<div class="hc">' +
      '<img class="hero" src="../line-hello/hero-current.jpg" alt="">' +
      '<div class="b">' +
      '<p class="hi" id="hi">' + HI + '</p>' +
      '<p class="menu" id="menu">' + MENU + '</p>' +
      '<hr>' +
      '</div>' +
      '<div class="f">' +
      '<p class="say" id="s1">' + SAY_BIND + '</p>' +
      '<span class="btn fill" id="b1"><img src="mark-white.png" alt=""><span>點這裡綁定</span></span>' +
      '<p class="say" id="s2">' + SAY_SHARE + '</p>' +
      '<span class="btn line" id="b2"><img src="mark-green.png" alt=""><span>介紹芳仁給朋友</span></span>' +
      '</div></div>';
    /* ⚠ 剛用 innerHTML 生出來的圖還沒載完，`complete` 是 false ——
       墨面積那一段會靜靜地印不出來（踩過）。載好再量一次。 */
    [].forEach.call(document.querySelectorAll("#b1 img, #b2 img"), function (im) {
      if (!im.complete) im.addEventListener("load", measure, { once: true });
    });
    measure();
  }

  /* ⚠ 量的是「這段字自己想要多寬」（丟進不換行的量尺），不是它現在多寬 */
  function wants(text, sample) {
    var s = document.createElement("span");
    s.textContent = text;
    s.style.cssText = "position:absolute;left:-9999px;top:0;white-space:nowrap;font:" +
      getComputedStyle(sample).font;
    document.body.appendChild(s);
    var w = s.getBoundingClientRect().width;
    s.remove();
    return w;
  }
  /* 逐字量 top 分組 —— 這樣才知道折成幾行、最後一行剩幾個字（會不會落單） */
  /* ⚠ 這一段要**走遍所有文字節點**，不能只看 firstChild —— 「官方 LINE」中間夾了一個
     <i class="sp">，只量第一個節點的話會漏掉後半，行數就算錯了。 */
  function lines(sel) {
    var el = document.querySelector(sel);
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), tns = [], n;
    while ((n = walker.nextNode())) tns.push(n);
    var r = document.createRange(), g = {};
    tns.forEach(function (tn) {
      var txt = tn.textContent;
      for (var k = 0; k < txt.length; k++) {
        r.setStart(tn, k); r.setEnd(tn, k + 1);
        var rect = r.getBoundingClientRect();
        if (rect.height && txt[k] !== "\n" && txt[k] !== " ") {
          var t = Math.round(rect.top); (g[t] = g[t] || []).push(txt[k]);
        }
      }
    });
    var keys = Object.keys(g).map(Number).sort(function (a, b) { return a - b; });
    return { n: keys.length, last: g[keys[keys.length - 1]].join("") };
  }

  /* ⚠⚠ 「有點大有點粗」量出來是**墨量**不是厚度：兩顆形狀的「厚度 ÷ 高度」
     幾乎一樣（白 85.8%、綠 86.3%），差的是它鋪了多長。所以面板印的是**墨面積**。 */
  function mass() {
    var i1 = document.querySelector("#b1 img"), i2 = document.querySelector("#b2 img");
    if (!i1.complete || !i2.complete) return "";
    var r1 = i1.getBoundingClientRect(), r2 = i2.getBoundingClientRect();
    var a1 = inkFrac(i1, "white") * r1.width * r1.height;
    var a2 = inkFrac(i2, "green") * r2.width * r2.height;
    var pct = a2 / a1 * 100;
    var t = document.querySelector("#b2 span").getBoundingClientRect();
    return "<br><span class='k'>綁定那顆</span> <b>" + r1.width.toFixed(0) + "×"
      + r1.height.toFixed(1) + "</b>　<span class='k'>介紹那顆</span> <b>"
      + r2.width.toFixed(0) + "×" + r2.height.toFixed(1) + "</b>"
      /* ⚠ 這一行**不下對錯判斷**：34px 是使用者看過四格之後選的最小那一格，
         等重的其實是 42px。印數字就好，不要標紅（同兒牙填色白字 3.22 那一類）。 */
      + "<br><span class='k'>介紹那顆的墨是綁定那顆的</span> <b>" + pct.toFixed(0) + "%</b>"
      + "　<span class='k'>它的高 ÷ 字的墨高</span> <b>"
      + (r2.height / 16.25 * 100).toFixed(0) + "%</b>"
      + " <span class='k'>（四格裡最小的那一格，你選的；等重的是 42px）</span>";
  }

  function measure() {
    var b1 = document.getElementById("b1"), b2 = document.getElementById("b2");
    var cs = getComputedStyle(b1);
    var avail = b1.getBoundingClientRect().width
              - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var w1 = wants("點這裡綁定", b1.querySelector("span"));
    var w2 = wants("介紹芳仁給朋友", b2.querySelector("span"));
    var ico = b1.querySelector("img").getBoundingClientRect().width;
    var hi = lines("#hi"), mn = lines("#menu"), s1 = lines("#s1"), s2 = lines("#s2");
    var card = document.querySelector(".hc").getBoundingClientRect();
    var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    function ln(name, o) {
      var orphan = o.n > 1 && o.last.length <= 3;
      return "<br><span class='k'>" + name + "</span> <b>" + o.n + " 行</b>"
        + (orphan ? " <span class='no'>末行只剩「" + o.last + "」，落單</span>"
                  : " <span class='ok'>斷得乾淨</span>");
    }
    document.getElementById("panel").innerHTML =
      "<span class='k'>按鈕可用</span> <b>" + avail.toFixed(0) + "px</b>"
      + " <span class='k'>（扣掉 logo " + ico.toFixed(0) + "px 與間距 8px 之後，字只剩 "
      + (avail - ico - 8).toFixed(0) + "px）</span>"
      + "<br><span class='k'>點這裡綁定</span> <b>" + w1.toFixed(0) + "px</b>"
      + "　<span class='k'>介紹芳仁給朋友</span> <b>" + w2.toFixed(0) + "px</b> "
      + (Math.max(w1, w2) > avail - ico - 8 ? "<span class='no'>放不下</span>"
                                            : "<span class='ok'>都放得下</span>")
      + ln("開場", hi) + ln("選單那句", mn) + ln("綁定那句", s1) + ln("介紹那句", s2)
      + "<br><span class='k'>整張卡</span> <b>" + card.height.toFixed(0) + "px</b>"
      + "　<span class='k'>佔你這一屏</span> <b>" + (card.height / vh * 100).toFixed(0) + "%</b>"
      + mass();
    document.getElementById("note").innerHTML =
      "⚠⚠ <b>按鈕上的 logo 不能用 Flex 的 <code>button</code></b> —— 它只有一個 label，"
      + "不支援圖示。所以兩顆按鈕都做成<b>可點的 box</b>（box 掛 action），裡面 image ＋ text。"
      + "代價是失去按鈕內建的按壓效果，換來完全的排版控制。"
      + "<br>⚠ <b>logo 要兩顆不同顏色</b>：白的疊在實心綠按鈕上、深階綠的疊在外框按鈕上。"
      + "透明底的暗綠疊在綠底上會看不見，不能只做一顆。"
      + "<b>綁定</b>那顆是站上頁首那一條（和 assets/logo.png 同一條，長寬比 2.03）、"
      + "<b>介紹</b>那顆是你選的 <code>brand/shapes/shape-r2c3</code>（細長那一顆，3.08）。"
      + "<br>⚠⚠ 你說<b>「有點大有點粗」</b>，量出來是<b>墨量</b>不是厚度 —— "
      + "兩顆形狀的「厚度 ÷ 高度」幾乎一樣（白 85.8%、綠 86.3%），"
      + "差在<b>它鋪了多長</b>：47px 那一格的墨是綁定那顆的 <b>123%</b>。"
      + "四格比過（47／42／38／34），你選<b>最小那一格 34px</b> —— <b>定案</b>，切換條已拿掉。"
      + "⚠ 它和綁定那顆<b>同寬</b>，但形狀比較長，所以只有 <b>11.0px 高</b>、墨是它的 <b>64%</b>；"
      + "等重的那一格其實是 42px。<b>這是你看過數字之後選的，不是漏調。</b>"
      + "<br>⚠ Flex 的 <code>size</code> 給的是<b>寬度</b>不是高度，所以兩顆不能寫同一個數字。"
      + "<br>⚠ 「LINE」前面那個空格<b>縮小了</b>：半形空格 3.89px → <b>2.52px</b>（窄 35%）。"
      + "做法是<b>普通的半形空格 ＋ 把它縮到 9px</b>，不是 U+2009／U+200A 那種細空格 —— "
      + "細空格要看系統字型有沒有那個字，沒有會變豆腐；縮小普通空格的最壞情況只是"
      + "「維持原本的寬度」，不會壞掉。Flex 那邊對應的是 span 的 size，兩句都改成 span。"
      + "<br>⚠ 空格本身是照站上慣例補的（站上一律寫「官方 LINE」「 Google」）；"
      + "你打的是「官方LINE」。"
      + "<br>⚠ 「喔～」用<b>全形</b>波浪，和站上其他中文標點一致。"
      + "<br>⚠ 「看診前 2 天」和機器那邊的 <b>48 小時</b>是同一件事，"
      + "只是換成講話的說法 —— 提醒的時間點沒有動。"
      + "<br>⚠⚠ <b>撥打電話那顆按鈕仍然沒有</b>（你三次整理的清單裡都沒有它）。"
      + "電話在選單的「診所資訊」與帳號主頁上。"
      + "<br>⚠⚠ 兩顆按鈕的網址都還拿不到：「介紹芳仁給朋友」要用推薦官方帳號的深連結"
      + "（<code>" + SHARE + "</code>，<b>沒有實測過</b>）；「點這裡綁定」的網址是廠商系統產的。";
  }

  /* 墨佔多少（不透明像素的比例）—— 線上是同源，直接量；
     ⚠ 本機用 file:// 開的話 canvas 會被 taint（SecurityError），退回 mark-png.mjs 印過的值。 */
  var INK = { white: .797, green: .778 };
  function inkFrac(img, key) {
    try {
      var cv = document.createElement("canvas");
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      cv.getContext("2d").drawImage(img, 0, 0);
      var d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data, n = 0;
      for (var i = 3; i < d.length; i += 4) if (d[i] > 127) n++;
      return n / (cv.width * cv.height);
    } catch (e) { return INK[key]; }
  }

  render();
  window.addEventListener("resize", render);
})();
</script>
</body>
</html>
