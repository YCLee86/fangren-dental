<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>招呼圖卡</title>
<!--
  加入好友的招呼圖卡（LINE Flex Message）。Flex 的 JSON 在
  drafts/channels/welcome-card.json，頭圖是 /preview/line-hello/ 定案的那一張。

  ⚠⚠⚠ 2026-09-03 第一版被退回，三件都成立：
    「你們要整合啊　灰底裡的字好小　整個好醜　怎麼可能一串字都塞在按鈕裡」
    ① **不該給選項。** 內容他已經給了，把它做成一張像樣的卡是我的事，
       不是列三種走法讓他挑。給選項是把我的工作退回去給他。
    ② **灰底裡的字真的太小，而且是我的提案頁在說謊。**
       LINE Flex 的字級是**固定的 px**（xxs 11／xs 13／sm 14／md 16／lg 19），
       我卻寫成 rem 的比例（.72rem＝11.5px 之類），每一行都畫得比 LINE 實際的小
       1~2.7px。**提案頁一旦和真實算繪對不上，上面做的每一個判斷都是假的。**
    ③ **一串字本來就不該塞進按鈕。** LINE 的按鈕標籤是單行、放不下就截掉。
       他寫「完成綁定。看診前48小時發送提醒通知喔～　按鈕連結」時，
       那句話是**要說的話**，「按鈕連結」才是按鈕 —— 我讀成整句都是按鈕的字。

  這一版的做法：那句話是**內文**（內文會自動換行，多長都行），按鈕只留「完成綁定」，
  而且**那句話就貼在那顆按鈕的正上方** —— 所以按鈕的順序和他寫的相反
  （綁定在上、介紹在下）。理由是那句話是在講綁定，兩者要相鄰才讀得順。

  ⚠ 灰底的方塊整個拿掉了：卡是 #F4F4F5、方塊是 #E2E5E6，兩個差 14 階，
    在 268px 的卡上讀起來就是一塊糊糊的髒。改成一條 1px 的分隔線，乾淨得多。
  ⚠ 撥打電話那顆按鈕沒有了（他整理的清單裡沒有它）。電話仍在選單的「診所資訊」
    與帳號主頁上。這一項要他點頭。
  ⚠ 這裡仍是近似，不是 LINE 自己的算繪 —— 但字級已經照 Flex 的固定 px 對過。
-->
<style>
:root{--paper:#e2e5e6;--card:#f4f4f5;--ink:#2a2c27;--ink-soft:#5c5f57;--rule:#cdd0d2;
  --green:#3f654a;--deep:#2c5238;--chat:#e9edf1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding:18px 16px 40px}
h1{font-size:1.12rem;margin:0 0 6px;letter-spacing:.01em}
.lede{color:var(--ink-soft);font-size:.86rem;margin:0 0 16px}
.lede b{color:var(--ink)}

.chat{background:var(--chat);border-radius:12px;padding:12px 10px}
.chat .day{text-align:center;font-size:.66rem;color:#7b8794;margin-bottom:9px}
.row{display:flex;gap:8px;align-items:flex-start}
/* ⚠⚠ 這個 min-width:0 不能刪：按鈕的標籤是 nowrap，卡片的 min-content 會被撐大，
   而 flex 項目預設 min-width:auto —— 360 寬會多 26px 水平捲動（320 上 66px）。
   overflow:hidden 只管畫面上裁掉，不會讓 min-content 變小。
   ⚠ 但不要順手加 flex:1，加了卡片會塌成 150px，量出來的可用寬度整組是假的。 */
.row > div{min-width:0}
.av{flex:none;width:26px;height:26px;border-radius:50%;background:var(--deep)}

/* ⚠⚠ 字級一律寫**固定 px**，不要寫 rem —— LINE Flex 的 size 就是固定 px：
   xxs 11／xs 13／sm 14／md 16／lg 19／xl 22。寫成 rem 的比例就會和實際對不上。 */
.hc{width:268px;max-width:100%;border-radius:14px;overflow:hidden;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hc .hero{display:block;width:100%}
.hc .b{padding:14px 14px 0}
.hc .hi{margin:0;font-size:19px;line-height:1.35;font-weight:700;letter-spacing:.02em}
.hc .lead{margin:6px 0 0;font-size:14px;line-height:1.7}
.hc hr{border:0;border-top:1px solid var(--rule);margin:15px 0 0}
.hc .lb{margin:13px 0 0;font-size:13px;line-height:1.5;color:var(--ink-soft);letter-spacing:.06em}
.hc .list{margin:3px 0 0;font-size:14px;line-height:1.8;font-weight:700}
.hc .say{margin:15px 0 0;font-size:14px;line-height:1.8}
.hc .f{padding:14px 14px 14px}
/* 按鈕：標籤 16px、單行；內距 12px 是 Flex 的預設 */
.hc .btn{display:block;border-radius:9px;padding:11px 12px;font-size:16px;line-height:1.3;
  font-weight:700;text-align:center;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .btn + .btn{margin-top:8px}
.hc .btn.fill{background:var(--green);color:#fff}
.hc .btn.line{border:1px solid var(--deep);color:var(--deep);background:transparent}

.cap{font-size:.78rem;color:var(--ink-soft);margin:9px 2px 0}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:10px 12px;font-size:.78rem;line-height:1.85;margin-top:14px}
.panel b{color:var(--ink);font-variant-numeric:tabular-nums}
.panel .k{color:var(--ink-soft)}
.panel .no{color:#a33;font-weight:700}
.panel .ok{color:var(--deep);font-weight:700}
.note{border-left:3px solid var(--rule);padding-left:11px;color:var(--ink-soft);
  font-size:.79rem;margin-top:13px}
.note code{font-size:.94em;overflow-wrap:anywhere;word-break:break-all}
</style>
</head>
<body>
<h1>招呼圖卡</h1>
<p class="lede">整合成一張了。那句話是<b>內文</b>、按鈕只留「完成綁定」，
灰底方塊換成分隔線，字級改成照 LINE Flex 的<b>固定 px</b>。</p>

<div class="chat">
  <div class="day">今天</div>
  <div class="row"><div class="av"></div><div id="card"></div></div>
</div>
<p class="cap">↑ 聊天室裡的真實大小（卡片 268px 寬）。⚠ 近似，不是 LINE 自己的算繪。</p>

<div class="panel" id="panel"></div>
<p class="note" id="note"></p>

<script>
(function () {
  "use strict";
  var SHARE = "https://line.me/R/nv/recommendOA/@445rpiiv";
  /* ⚠ 你寫的是「完成綁定。看診前48小時發送提醒通知喔～」，這裡把「完成綁定。」拿掉了
     —— 正下方那顆按鈕就叫「完成綁定」，寫在文字裡是說兩遍。
     順帶也解掉排版：留著的話 268 上會斷成「…發送提醒通」／「知喔～」，
     320 上更慘（「～」自己一行）。 */
  var SAY = "看診前 48 小時發送提醒通知喔～";

  document.getElementById("card").innerHTML =
    '<div class="hc">' +
    '<img class="hero" src="../line-hello/hero-current.jpg" alt="">' +
    '<div class="b">' +
    '<p class="hi">你好</p>' +
    '<p class="lead">歡迎加入芳仁牙醫診所的官方 LINE</p>' +
    '<hr>' +
    '<p class="lb">選單功能簡介</p>' +
    '<p class="list">約診查詢・診所資訊・診療項目<br>醫師介紹・衛教資訊</p>' +
    '<p class="say">' + SAY + '</p>' +
    '</div>' +
    '<div class="f">' +
    '<span class="btn fill" id="b1">完成綁定</span>' +
    '<span class="btn line" id="b2">介紹芳仁給朋友</span>' +
    '</div></div>';

  /* ⚠ 量的是「標籤自己想要多寬」（丟進一個不換行、不裁切的量尺），
     不是按鈕現在多寬 —— 按鈕已經把它截掉了，量按鈕永遠剛好等於可用寬度。 */
  function wants(text, sample) {
    var s = document.createElement("span");
    s.textContent = text;
    s.style.cssText = "position:absolute;left:-9999px;top:0;white-space:nowrap;font:" +
      getComputedStyle(sample).font;
    document.body.appendChild(s);
    var w = s.getBoundingClientRect().width;
    s.remove();
    return w;
  }

  function measure() {
    var b1 = document.getElementById("b1"), b2 = document.getElementById("b2");
    var cs = getComputedStyle(b1);
    var avail = b1.getBoundingClientRect().width
              - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var w1 = wants("完成綁定", b1), w2 = wants("介紹芳仁給朋友", b2);
    var whole = wants(SAY, b1);          /* 那句話如果硬塞進按鈕會多寬 */
    var card = document.querySelector(".hc").getBoundingClientRect().height;
    var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    function row(name, w) {
      return "<br><span class='k'>" + name + "</span> <b>" + w.toFixed(0) + "px</b> "
        + (w > avail ? "<span class='no'>放不下</span>"
                     : "<span class='ok'>放得下</span><span class='k'>（還剩 "
                       + (avail - w).toFixed(0) + "px）</span>");
    }
    document.getElementById("panel").innerHTML =
      "<span class='k'>按鈕能給的寬度</span> <b>" + avail.toFixed(0) + "px</b>"
      + " <span class='k'>（卡片 " + document.querySelector(".hc").getBoundingClientRect().width.toFixed(0)
      + " − 卡片內距 28 − 按鈕內距 24）</span>"
      + row("完成綁定", w1) + row("介紹芳仁給朋友", w2)
      + "<br><span class='k'>那句話如果塞進按鈕</span> <b>" + whole.toFixed(0) + "px</b> "
      + "<span class='no'>放不下（超出 " + (whole - avail).toFixed(0) + "px）</span>"
      + " <span class='k'>← 所以它是內文，不是按鈕的字</span>"
      + "<br><span class='k'>整張卡</span> <b>" + card.toFixed(0) + "px</b>"
      + "　<span class='k'>佔你這一屏</span> <b>" + (card / vh * 100).toFixed(0) + "%</b>";
    document.getElementById("note").innerHTML =
      "⚠⚠ <b>字級改成照 LINE Flex 的固定 px。</b> 之前我把它寫成 rem 的比例，"
      + "每一行都畫得比 LINE 實際的小 1~2.7px（你好小 2.7、選單那一串小 1.8、"
      + "「選單功能簡介」小 1.5）——<b>提案頁一旦和真實算繪對不上，上面做的判斷都是假的</b>。"
      + "現在：你好 19px、內文 14px、標籤 13px、按鈕 16px。"
      + "<br>⚠ <b>灰底方塊拿掉了。</b> 卡是 #F4F4F5、方塊是 #E2E5E6，只差 14 階，"
      + "在 268px 的卡上就是一塊糊糊的髒。換成一條 1px 分隔線。"
      + "<br>⚠ <b>那句話拿掉了開頭的「完成綁定。」</b> —— 正下方那顆按鈕就叫「完成綁定」，"
      + "寫在文字裡是說兩遍；留著的話 268 上還會斷成「…發送提醒通／知喔～」。"
      + "<br>⚠ <b>按鈕的順序和你寫的相反</b>（綁定在上、介紹在下）：那句話是在講綁定，"
      + "所以它要貼在那顆按鈕的正上方，兩件事才讀得順。"
      + "<br>⚠⚠ <b>撥打電話那顆按鈕沒有了</b> —— 你整理的清單裡沒有它。電話仍然在"
      + "選單的「診所資訊」與帳號主頁上，不是消失。這一項要你點頭。"
      + "<br>⚠⚠ <b>兩顆按鈕的網址都還拿不到。</b>「介紹芳仁給朋友」要用推薦官方帳號的"
      + "深連結（<code>" + SHARE + "</code>），<b>沒有實測過</b>，要請廠商在自己的帳號上"
      + "按一次；「完成綁定」的網址是廠商系統產的，只有他們有。";
  }
  measure();
  window.addEventListener("resize", measure);
})();
</script>
</body>
</html>
