<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>招呼圖卡的頭圖 —— 芳仁／哩厚</title>
<!--
  提案頁：加入好友那張圖卡的頭圖。
  ✅ 裁切 2026-09-03 定案 Ⓒ3b（x 934~7614、y 403~3743），其餘八案已刪，推導在
     drafts/line-hello/README.md 第八節。
  ✅✅ 2026-09-03 全部定案（使用者：「我喜歡這個版本，以這個版本為主」）：
     裁切 Ⓒ3b、超橢圓 2.6、沒有缺口、玻璃「中」、行高 1.34、框 415×349、
     尾巴 .78π／根 62／長 70／指著一樓飾邊 (395, 397)、字體 **Zen Maru Gothic 900**。
  ⚠ 他指的是哪一版是**逐像素比對他的截圖**得到的，不是憑印象猜的 —— 推導在
     drafts/line-hello/README.md 第十六節。
  ⚠ 切換條已經拿掉。這一頁現在是**定案的規格頁**，不是提案頁。
-->
<style>
:root{--paper:#e2e5e6;--card:#f4f4f5;--ink:#2a2c27;--ink-soft:#5c5f57;--rule:#cdd0d2;
  --green:#3f654a;--deep:#2c5238}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding:18px 16px 168px}
h1{font-size:1.12rem;margin:0 0 6px;letter-spacing:.01em}
.lede{color:var(--ink-soft);font-size:.86rem;margin:0 0 16px}
.lede b{color:var(--ink)}
.big{border-radius:12px;overflow:hidden;background:#000;line-height:0;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.big img{width:100%;display:block}
.cap{font-size:.78rem;color:var(--ink-soft);margin:7px 2px 16px}
.chat{background:#e9edf1;border-radius:12px;padding:12px 10px}
.chat .day{text-align:center;font-size:.66rem;color:#7b8794;margin-bottom:9px}
/* ⚠ 卡片左邊還有 34px 的頭像位，max-width 要把它扣掉，不然 320 上會多 8px 水平捲動 */
.hc{width:268px;max-width:calc(100% - 34px);border-radius:14px;overflow:hidden;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.08);margin-left:34px;position:relative}
.hc::before{content:"";position:absolute;left:-34px;top:0;width:26px;height:26px;
  border-radius:50%;background:var(--deep)}
.hc .hero{display:block;width:100%}
.hc .b{padding:14px 14px 12px}
.hc .sp{font-style:normal;font-size:9px}
.hc .hi{margin:0;font-size:16px;line-height:1.55;font-weight:700}
.hc .more{margin:8px 0 0;font-size:12px;color:var(--ink-soft)}
.hc .more a{color:var(--deep)}
.hc h4{margin:0;font-size:.92rem;font-weight:700}
.hc .loc{font-size:.66rem;color:var(--ink-soft);margin-top:2px}
.hc p{margin:9px 0 0;font-size:.72rem;line-height:1.62}
.hc .menu{background:var(--paper);border-radius:8px;padding:8px 10px;margin-top:9px;
  font-size:.68rem;line-height:1.6}
.hc .f{padding:0 12px 11px}
.hc .tel{background:var(--green);color:#fff;font-weight:700;text-align:center;
  border-radius:8px;padding:8px 0;font-size:.8rem;margin-top:9px}
.hc .share{display:block;text-align:center;color:var(--deep);font-size:.72rem;padding:8px 0 1px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:11px 13px;font-size:.8rem;line-height:1.8;margin-top:14px}
.panel b{font-variant-numeric:tabular-nums}
.panel .k{color:var(--ink-soft)}
.note{border-left:3px solid var(--rule);padding-left:11px;color:var(--ink-soft);
  font-size:.79rem;margin-top:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,244,245,.97);
  border-top:1px solid var(--rule);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  backdrop-filter:blur(8px);z-index:9}
.bar .r{display:flex;align-items:flex-start;gap:8px;margin:3px 0}
.bar .lb{flex:none;width:2.6em;font-size:.72rem;color:var(--ink-soft);padding-top:5px}
.bar .g{display:flex;flex-wrap:wrap;gap:5px}
.bar button{font:inherit;font-size:.75rem;padding:4px 10px;border-radius:7px;
  border:1px solid var(--deep);background:#fff;color:var(--deep);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--deep);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,244,245,.97);
  border-top:1px solid var(--rule);padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  backdrop-filter:blur(8px);z-index:9}
.bar .r{display:flex;align-items:center;gap:8px;margin:3px 0}
.bar .lb{flex:none;width:4.6em;font-size:.72rem;color:var(--ink-soft)}
.bar .g{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.bar .g::-webkit-scrollbar{display:none}
.bar button{font:inherit;font-size:.75rem;padding:4px 11px;border-radius:7px;white-space:nowrap;
  flex:none;border:1px solid var(--deep);background:#fff;color:var(--deep);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--deep);color:#fff}
</style>
</head>
<body>
<h1>頭圖：房子在說「芳仁　哩厚」</h1>
<p class="lede">驚嘆號改成<b>自己畫的</b>（字型做不到「只把頭加粗」）。
底下三把尺：<b>頭的粗細</b>、<b>角度</b>、<b>往下多少</b>。左上那一格是現在的。</p>

<div class="big"><img id="shot" alt=""></div>
<p class="cap" id="cap"></p>

<div class="chat">
  <div class="day">今天</div>
  <!-- ⚠ 這裡只放頭圖 ＋ 開場那一句，**不重畫整張卡** ——
       整張卡在 /preview/line-welcome/，文案還在動；兩頁各畫一份必然會走鐘
       （這一頁一度還停在「完成綁定，看診前 48 小時」那個舊版）。 -->
  <div class="hc">
    <img class="hero" id="mini" alt="">
    <div class="b">
      <p class="hi">歡迎加入芳仁牙醫的官方<i class="sp"> </i>LINE</p>
      <p class="more">整張卡在 <a href="/preview/line-welcome/">/preview/line-welcome/</a></p>
    </div>
  </div>
<p class="cap">↑ 頭圖在聊天室裡的<b>真實大小</b>（卡片 268px 寬）。⚠ 近似，不是 LINE 自己的算繪。</p>

<div class="panel" id="panel"></div>
<p class="note" id="note"></p>


<div class="bar">
  <div class="r"><span class="lb">頭的粗細</span><span class="g" id="sw-t"></span></div>
  <div class="r"><span class="lb">角度</span><span class="g" id="sw-d"></span></div>
  <div class="r"><span class="lb">往下</span><span class="g" id="sw-y"></span></div>
</div>
<script>
(function () {
  "use strict";
  var R = [{"id":"bang-11-12-10","bangTop":11,"bangDeg":12,"bangDy":10,"clear":22,"kb":106},{"id":"bang-11-12-18","bangTop":11,"bangDeg":12,"bangDy":18,"clear":22,"kb":106},{"id":"bang-11-12-26","bangTop":11,"bangDeg":12,"bangDy":26,"clear":22,"kb":106},{"id":"bang-11-18-10","bangTop":11,"bangDeg":18,"bangDy":10,"clear":19,"kb":106},{"id":"bang-11-18-18","bangTop":11,"bangDeg":18,"bangDy":18,"clear":19,"kb":106},{"id":"bang-11-18-26","bangTop":11,"bangDeg":18,"bangDy":26,"clear":19,"kb":106},{"id":"bang-11-24-10","bangTop":11,"bangDeg":24,"bangDy":10,"clear":16,"kb":106},{"id":"bang-11-24-18","bangTop":11,"bangDeg":24,"bangDy":18,"clear":16,"kb":106},{"id":"bang-11-24-26","bangTop":11,"bangDeg":24,"bangDy":26,"clear":16,"kb":106},{"id":"bang-14-12-10","bangTop":14,"bangDeg":12,"bangDy":10,"clear":21,"kb":106},{"id":"bang-14-12-18","bangTop":14,"bangDeg":12,"bangDy":18,"clear":21,"kb":106},{"id":"bang-14-12-26","bangTop":14,"bangDeg":12,"bangDy":26,"clear":21,"kb":106},{"id":"bang-14-18-10","bangTop":14,"bangDeg":18,"bangDy":10,"clear":18,"kb":106},{"id":"bang-14-18-18","bangTop":14,"bangDeg":18,"bangDy":18,"clear":18,"kb":106},{"id":"bang-14-18-26","bangTop":14,"bangDeg":18,"bangDy":26,"clear":18,"kb":106},{"id":"bang-14-24-10","bangTop":14,"bangDeg":24,"bangDy":10,"clear":14,"kb":106},{"id":"bang-14-24-18","bangTop":14,"bangDeg":24,"bangDy":18,"clear":14,"kb":106},{"id":"bang-14-24-26","bangTop":14,"bangDeg":24,"bangDy":26,"clear":14,"kb":106},{"id":"bang-17-12-10","bangTop":17,"bangDeg":12,"bangDy":10,"clear":19,"kb":106},{"id":"bang-17-12-18","bangTop":17,"bangDeg":12,"bangDy":18,"clear":19,"kb":106},{"id":"bang-17-12-26","bangTop":17,"bangDeg":12,"bangDy":26,"clear":19,"kb":106},{"id":"bang-17-18-10","bangTop":17,"bangDeg":18,"bangDy":10,"clear":17,"kb":106},{"id":"bang-17-18-18","bangTop":17,"bangDeg":18,"bangDy":18,"clear":17,"kb":106},{"id":"bang-17-18-26","bangTop":17,"bangDeg":18,"bangDy":26,"clear":17,"kb":106},{"id":"bang-17-24-10","bangTop":17,"bangDeg":24,"bangDy":10,"clear":13,"kb":106},{"id":"bang-17-24-18","bangTop":17,"bangDeg":24,"bangDy":18,"clear":13,"kb":106},{"id":"bang-17-24-26","bangTop":17,"bangDeg":24,"bangDy":26,"clear":13,"kb":106}];
  var by = {}; R.forEach(function (r) { by[r.bangTop + "|" + r.bangDeg + "|" + r.bangDy] = r; });
  var T = [11, 14, 17], D = [12, 18, 24], Y = [10, 18, 26];
  var st = { t: 11, d: 12, y: 10 };

  function render() {
    var r = by[st.t + "|" + st.d + "|" + st.y];
    var src = r.id + ".jpg";
    document.getElementById("shot").src = src;
    document.getElementById("mini").src = src;
    document.getElementById("cap").textContent = "1040\u00d7520（2:1）・" + r.kb + "KB";
    document.getElementById("panel").innerHTML =
      "<span class='k'>頭的粗細</span> <b>" + r.bangTop + "px</b>"
      + " <span class='k'>（尾一直是 8px，所以頭比尾粗 "
      + (r.bangTop / 8).toFixed(2) + " 倍）</span>"
      + "　<span class='k'>角度</span> <b>" + r.bangDeg + "\u00b0</b>"
      + "　<span class='k'>比基線低</span> <b>" + r.bangDy + "px</b>"
      + "<br><span class='k'>字離框邊</span> <b>" + r.clear + "px</b>"
      + " <span class='k'>（門檻 10；27 格最小的是 13）</span>"
      + "　<span class='k'>「哩厚」的筆畫</span> <b>14px</b>"
      + (r.bangTop > 14 ? " <span class='no'>頭比字粗了</span>"
                        : " <span class='ok'>頭還沒超過字</span>");
    document.getElementById("note").innerHTML =
      "⚠⚠ <b>驚嘆號改成自己畫的，不是字型的字。</b>「只把頭加粗」用描邊做不到 —— "
      + "描邊是整支一起變粗；字型也沒有這種軸。現在它是一個<b>錐形的莖 ＋ 一顆點</b>："
      + "莖的頂寬可以單獨調，尾一直是 8px。"
      + "<br>⚠ 「現況」那一格（11／12°／10）的預設值是<b>量 Zen Maru 那顆真的「!」</b>"
      + "得來的（89px 下：莖高 43.8、頂寬 7.2、底寬 4.4、間隙 5.4、點徑 14.4），"
      + "再把先前那 3.5px 的同色描邊併進寬度 —— 所以它和先前的字型版幾乎一樣。"
      + "<br>⚠ 兩端的圓是對上下兩個圓拉<b>外公切線</b>算的（同地圖圖釘那一輪），"
      + "取錯邊輪廓會從尖端折回去。"
      + "<br>⚠ <b>「哩厚」的筆畫是 14px</b>。頭超過 14 就比字還粗，讀起來會像第三個字 —— "
      + "面板會標出來，但要不要越過那條線是你決定的。"
      + "<br>⚠ 27 格<b>都通過</b>「字不能碰到框」那道守門（最小 13px、門檻 10）。"
      + "<br>⚠ 這 27 張是提案用的（品質 82，比正式的 88 低一階，省下載）。"
      + "你選完我會把值寫回去、用 88 重出一張，並把這 27 張刪掉。";
  }
  function chips(host, arr, k, suffix) {
    host.innerHTML = "";
    arr.forEach(function (v) {
      var b = document.createElement("button");
      b.textContent = v + suffix + (v === arr[0] ? "（現況）" : "");
      b.setAttribute("aria-pressed", st[k] === v ? "true" : "false");
      b.addEventListener("click", function () { st[k] = v; sync(); render(); });
      host.appendChild(b);
    });
  }
  function sync() {
    chips(document.getElementById("sw-t"), T, "t", "px");
    chips(document.getElementById("sw-d"), D, "d", "\u00b0");
    chips(document.getElementById("sw-y"), Y, "y", "px");
  }
  sync(); render();
  /* ⚠ 27 張約 2.9MB。load 之後一張一張接力預抓，不要一次全開把 4G 塞住。 */
  window.addEventListener("load", function () {
    var q = R.map(function (r) { return r.id + ".jpg"; });
    (function next() {
      var u = q.shift(); if (!u) return;
      var i = new Image(); i.onload = i.onerror = next; i.src = u;
    })();
  });
})();
</script>
</body>
</html>
