<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>招呼圖卡的頭圖 —— 裁切</title>
<!--
  提案頁：加入好友那張圖卡的頭圖，要怎麼裁。
  使用者 2026-09-03：「先不要管字，我們先處理照片的裁切。診所建築左邊還有點空間
  可以裁掉，照片下緣的道路也可裁掉一些。」

  ⚠⚠ 左邊和下面不能各自調：成品必須是 2:1（Flex 頭圖的比例），
    左邊裁掉多少，高度就得跟著裁掉一半。高度那一刀要從上下分配 ——
    全部從下面切會吃到騎樓（建築底部在 y 88%）。

  ⚠⚠ 順序是對的：**先裁切、再放字**。字的落點是相對於裁切框量出來的
    （前一輪量到最乾淨的那塊天空只有 6.4% 不合格），裁切一改那塊天空就換位置，
    字一定要重放、重量。所以這一頁上沒有字。

  ⚠ 這一頁擺的是真的產出檔（crop-*.jpg），不是用 CSS 再裁一次 ——
    要判斷的是縮到聊天室的 232px 還讀不讀得懂（同 og-topic-card 那一輪）。

  出圖：node drafts/line-hello/crop.mjs　　推導：drafts/line-hello/README.md
-->
<style>
:root{--paper:#e2e5e6;--card:#f4f4f5;--ink:#2a2c27;--ink-soft:#5c5f57;--rule:#cdd0d2;
  --green:#3f654a;--deep:#2c5238}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding:18px 16px 190px}
h1{font-size:1.12rem;margin:0 0 6px;letter-spacing:.01em}
.lede{color:var(--ink-soft);font-size:.86rem;margin:0 0 16px}
.lede b{color:var(--ink)}
.big{border-radius:12px;overflow:hidden;background:#000;line-height:0;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.big img{width:100%;display:block}
.cap{font-size:.78rem;color:var(--ink-soft);margin:7px 2px 16px}
.chat{background:#e9edf1;border-radius:12px;padding:12px 10px}
.hc{width:232px;border-radius:14px;overflow:hidden;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.08);margin-left:34px;position:relative}
.hc::before{content:"";position:absolute;left:-34px;top:0;width:26px;height:26px;
  border-radius:50%;background:var(--deep)}
.hc .hero{display:block;width:100%}
.hc .b{padding:11px 12px 9px}
.hc h4{margin:0;font-size:.92rem;font-weight:700}
.hc .loc{font-size:.66rem;color:var(--ink-soft);margin-top:2px}
.hc p{margin:9px 0 0;font-size:.72rem;line-height:1.62}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:11px 13px;font-size:.8rem;line-height:1.8;margin-top:14px}
.panel b{font-variant-numeric:tabular-nums}
.panel .k{color:var(--ink-soft)}
.note{border-left:3px solid var(--rule);padding-left:11px;color:var(--ink-soft);
  font-size:.79rem;margin-top:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,244,245,.97);
  border-top:1px solid var(--rule);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  backdrop-filter:blur(8px);z-index:9}
.bar .r{display:flex;align-items:flex-start;gap:8px}
.bar .lb{flex:none;width:2.6em;font-size:.72rem;color:var(--ink-soft);padding-top:5px}
.bar .g{display:flex;flex-wrap:wrap;gap:5px}
.bar button{font:inherit;font-size:.75rem;padding:4px 10px;border-radius:7px;
  border:1px solid var(--deep);background:#fff;color:var(--deep);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--deep);color:#fff}
</style>
</head>
<body>
<h1>頭圖要怎麼裁</h1>
<p class="lede">底下切換五個裁法。⚠ 左邊和下面<b>不能各自調</b> ——
成品要維持 <b>2:1</b>，左邊裁掉多少，高度就得跟著裁掉一半。</p>

<div class="big"><img id="shot" alt=""></div>
<p class="cap" id="cap"></p>

<div class="chat"><div class="hc">
  <img class="hero" id="mini" alt="">
  <div class="b">
    <h4>芳仁牙醫診所</h4><div class="loc">雲林斗六・永樂街</div>
    <p>這裡是診所的官方 LINE。</p>
  </div>
</div></div>
<p class="cap">↑ 它在聊天室裡的<b>真實大小</b>（卡片 232px 寬）。</p>

<div class="panel" id="panel"></div>
<p class="note" id="note"></p>

<div class="bar"><div class="r"><span class="lb">裁法</span><span class="g" id="sw"></span></div></div>

<script>
(function () {
  "use strict";
  var R = [{"id":"a","label":"Ⓐ 幾乎不裁（現況）","L":0.5,"bottom":100,"x0":40,"y0":2,"y1":3982,"skyAboveRoof":13.456532663316583,"roadStrip":9.504773869346733,"kb":136,"note":""},{"id":"b","label":"Ⓑ 左 5%・路留大半","L":5,"bottom":97,"x0":400,"y0":62.539999999999964,"y1":3862.54,"skyAboveRoof":12.500789473684213,"roadStrip":6.8113157894736815,"kb":136,"note":""},{"id":"c","label":"Ⓒ 左 9%・路留一條","L":9,"bottom":94,"x0":720,"y0":103.07999999999993,"y1":3743.08,"skyAboveRoof":11.936538461538465,"roadStrip":3.828846153846151,"kb":135,"note":""},{"id":"d","label":"Ⓓ 左 13%・貼到屋簷","L":13,"bottom":92.5,"x0":1040,"y0":203.3499999999999,"y1":3683.35,"skyAboveRoof":9.604022988505752,"roadStrip":2.288505747126433,"kb":134,"note":""},{"id":"e","label":"Ⓔ 左 9%・路切到底","L":9,"bottom":90.5,"x0":720,"y0":0,"y1":3640,"skyAboveRoof":14.768406593406594,"roadStrip":0.9969780219780209,"kb":132,"note":"⚠ 上面不夠切，下緣自動往下讓"}];
  var st = R[0].id;

  function fmt(n) { return Math.round(n); }
  function render() {
    var r = R.filter(function (x) { return x.id === st; })[0];
    document.getElementById("shot").src = "crop-" + r.id + ".jpg";
    document.getElementById("mini").src = "crop-" + r.id + ".jpg";
    document.getElementById("cap").textContent = "1040×520（2:1）・" + r.kb + "KB";
    document.getElementById("panel").innerHTML =
      "<span class='k'>左邊裁掉</span> <b>" + r.L + "%</b>" +
      "　<span class='k'>下緣留到</span> <b>" + r.bottom + "%</b>" +
      "　<span class='k'>上面跟著切</span> <b>" + (r.y0 / 3982 * 100).toFixed(1) + "%</b>" +
      "<br><span class='k'>屋簷上方還有</span> <b>" + r.skyAboveRoof.toFixed(1) + "%</b> 的天空" +
      "　<span class='k'>路面剩</span> <b>" + r.roadStrip.toFixed(1) + "%</b>" +
      "<br><span class='k'>原檔落點</span> x " + fmt(r.x0) + "~8000、y " + fmt(r.y0) + "~" + fmt(r.y1) +
      (r.note ? "<br><b>" + r.note + "</b>" : "");
    document.getElementById("note").innerHTML =
      "⚠⚠ <b>先裁切、再放字。</b> 字的落點是相對於裁切框量出來的（上一輪量到最乾淨的那塊天空只有 6.4% 的像素對比不合格），"
      + "裁切一改那塊天空就換位置 —— 所以這一頁上沒有字，等裁法定了再把字重放、重量一次。"
      + "<br>⚠ 地標位置（原檔百分比）：屋簷左緣 <b>13.5%</b>、外牆左緣 16%、建築底部 <b>88%</b>、路緣 90.5%。"
      + "<b>左邊裁超過 13.5% 就會切到屋簷</b>，所以 Ⓓ 是這條路的盡頭。";
  }
  var host = document.getElementById("sw");
  R.forEach(function (r) {
    var b = document.createElement("button");
    b.textContent = r.label;
    b.setAttribute("aria-pressed", r.id === st ? "true" : "false");
    b.addEventListener("click", function () {
      st = r.id;
      [].forEach.call(host.children, function (c, i) {
        c.setAttribute("aria-pressed", R[i].id === st ? "true" : "false");
      });
      render();
    });
    host.appendChild(b);
  });
  render();
  window.addEventListener("load", function () {
    R.forEach(function (r) { new Image().src = "crop-" + r.id + ".jpg"; });
  });
})();
</script>
</body>
</html>
