<title>招呼圖卡的頭圖 —— 芳仁／哩厚</title>
<!--
  提案頁：加入好友那張圖卡的頭圖。
  ✅ 裁切 2026-09-03 定案 Ⓒ3b（x 934~7614、y 403~3743），其餘八案已刪，推導在
     drafts/line-hello/README.md 第八節。
  這一輪要選的是：**兩行的距離**、**框多大**、**字體**。
  ⚠ 缺口 2026-09-03 被使用者拿掉了（「還是不要缺口好了」），bubble.mjs 的 openPath()
    已經移除，描邊和填色都吃 closedPath()。
  ⚠ 形狀已定：**超橢圓 2.6**（不是圓角矩形 —— 圓角矩形永遠是「四段直線＋四個圓角」，
    那四個轉折就是「太工整」的來源）、玻璃濃度「中」（白 .58／模糊 11）。
  ⚠ 有六格沒有出圖（行距拉開但框沒跟著大，字離框邊只剩 0.4~7.8px），切換條上是灰的。

<style>
:root{--paper:#e2e5e6;--card:#f4f4f5;--ink:#2a2c27;--ink-soft:#5c5f57;--rule:#cdd0d2;
  --green:#3f654a;--deep:#2c5238}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding:18px 16px 210px}
h1{font-size:1.12rem;margin:0 0 6px;letter-spacing:.01em}
.lede{color:var(--ink-soft);font-size:.86rem;margin:0 0 16px}
.lede b{color:var(--ink)}
.big{border-radius:12px;overflow:hidden;background:#000;line-height:0;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.big img{width:100%;display:block}
.cap{font-size:.78rem;color:var(--ink-soft);margin:7px 2px 16px}
.chat{background:#e9edf1;border-radius:12px;padding:12px 10px}
.chat .day{text-align:center;font-size:.66rem;color:#7b8794;margin-bottom:9px}
.hc{width:232px;border-radius:14px;overflow:hidden;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.08);margin-left:34px;position:relative}
.hc::before{content:"";position:absolute;left:-34px;top:0;width:26px;height:26px;
  border-radius:50%;background:var(--deep)}
.hc .hero{display:block;width:100%}
.hc .b{padding:11px 12px 9px}
.hc h4{margin:0;font-size:.92rem;font-weight:700}
.hc .loc{font-size:.66rem;color:var(--ink-soft);margin-top:2px}
.hc p{margin:9px 0 0;font-size:.72rem;line-height:1.62}
.hc .menu{background:var(--paper);border-radius:8px;padding:8px 10px;margin-top:9px;
  font-size:.68rem;line-height:1.6}
.hc .f{padding:0 12px 11px}
.hc .tel{background:var(--green);color:#fff;font-weight:700;text-align:center;
  border-radius:8px;padding:8px 0;font-size:.8rem;margin-top:9px}
.hc .share{display:block;text-align:center;color:var(--deep);font-size:.72rem;padding:8px 0 1px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:11px 13px;font-size:.8rem;line-height:1.8;margin-top:14px}
.panel b{font-variant-numeric:tabular-nums}
.panel .k{color:var(--ink-soft)}
.note{border-left:3px solid var(--rule);padding-left:11px;color:var(--ink-soft);
  font-size:.79rem;margin-top:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,244,245,.97);
  border-top:1px solid var(--rule);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  backdrop-filter:blur(8px);z-index:9}
.bar .r{display:flex;align-items:flex-start;gap:8px;margin:3px 0}
.bar .lb{flex:none;width:2.6em;font-size:.72rem;color:var(--ink-soft);padding-top:5px}
.bar .g{display:flex;flex-wrap:wrap;gap:5px}
.bar button{font:inherit;font-size:.75rem;padding:4px 10px;border-radius:7px;
  border:1px solid var(--deep);background:#fff;color:var(--deep);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--deep);color:#fff}
</style>
</head>
<body>
<h1>頭圖：房子在說「芳仁　哩厚」</h1>
<p class="lede">缺口<b>拿掉了</b>。這一輪的兩把尺是<b>兩行的距離</b>與<b>框多大</b>
（字級沒有跟著放大 —— 你要的是不要擠，字一起變大就等於沒鬆到）。</p>

<div class="big"><img id="shot" alt=""></div>
<p class="cap" id="cap"></p>

<div class="chat">
  <div class="day">今天</div>
  <div class="hc">
    <img class="hero" id="mini" alt="">
    <div class="b">
      <h4>芳仁牙醫診所</h4><div class="loc">雲林斗六・永樂街</div>
      <p>這裡是診所的官方 LINE。</p>
      <div class="menu">下面的選單有<br><b>約診查詢、診所資訊、診療項目、<br>醫師介紹、衛教資訊</b></div>
      <p>完成綁定，看診前 48 小時<br>就會在這裡提醒你。</p>
    </div>
    <div class="f">
      <div class="tel">撥打電話　05-5339369</div>
      <span class="share">把芳仁介紹給家人</span>
    </div>
  </div>
</div>
<p class="cap">↑ 整張圖卡在聊天室裡的<b>真實大小</b>（卡片 232px 寬）。⚠ 這是提案頁的近似，不是 LINE 自己的算繪。</p>

<div class="panel" id="panel"></div>
<p class="note" id="note"></p>

<div class="bar">
  <div class="r"><span class="lb">兩行</span><span class="g" id="sw-l"></span></div>
  <div class="r"><span class="lb">框</span><span class="g" id="sw-z"></span></div>
  <div class="r"><span class="lb">字體</span><span class="g" id="sw-f"></span></div>
</div>
