<style>

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);

.hc::before{content:"";position:absolute;left:-34px;top:0;width:26px;height:26px;
  border-radius:50%;background:var(--deep)}
.hc .hero{display:block;width:100%}
.hc .b{padding:14px 14px 12px}
.hc .sp{font-style:normal;font-size:9px}
.hc .hi{margin:0;font-size:16px;line-height:1.55;font-weight:700}
.hc .more{margin:8px 0 0;font-size:12px;color:var(--ink-soft)}
.hc .more a{color:var(--deep)}
.hc h4{margin:0;font-size:.92rem;font-weight:700}
.hc .loc{font-size:.66rem;color:var(--ink-soft);margin-top:2px}
.hc p{margin:9px 0 0;font-size:.72rem;line-height:1.62}
.hc .menu{background:var(--paper);border-radius:8px;padding:8px 10px;margin-top:9px;
  font-size:.68rem;line-height:1.6}
.hc .f{padding:0 12px 11px}
.hc .tel{background:var(--green);color:#fff;font-weight:700;text-align:center;
  border-radius:8px;padding:8px 0;font-size:.8rem;margin-top:9px}
.hc .share{display:block;text-align:center;color:var(--deep);font-size:.72rem;padding:8px 0 1px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:11px 13px;font-size:.8rem;line-height:1.8;margin-top:14px}
.panel b{font-variant-numeric:tabular-nums}
.panel .k{color:var(--ink-soft)}
.note{border-left:3px solid var(--rule);padding-left:11px;color:var(--ink-soft);
  font-size:.79rem;margin-top:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,244,245,.97);
  border-top:1px solid var(--rule);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  backdrop-filter:blur(8px);z-index:9}
.bar .r{display:flex;align-items:flex-start;gap:8px;margin:3px 0}
.bar .lb{flex:none;width:2.6em;font-size:.72rem;color:var(--ink-soft);padding-top:5px}
.bar .g{display:flex;flex-wrap:wrap;gap:5px}
.bar button{font:inherit;font-size:.75rem;padding:4px 10px;border-radius:7px;
  border:1px solid var(--deep);background:#fff;color:var(--deep);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--deep);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,244,245,.97);
  border-top:1px solid var(--rule);padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  backdrop-filter:blur(8px);z-index:9}
.bar .r{display:flex;align-items:center;gap:8px;margin:3px 0}
.bar .lb{flex:none;width:4.6em;font-size:.72rem;color:var(--ink-soft)}
.bar .g{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.bar .g::-webkit-scrollbar{display:none}
.bar button{font:inherit;font-size:.75rem;padding:4px 11px;border-radius:7px;white-space:nowrap;
  flex:none;border:1px solid var(--deep);background:#fff;color:var(--deep);cursor:pointer}
