<title>招呼圖卡的頭圖 —— 芳仁／哩厚</title>
<!--
  提案頁：加入好友那張圖卡的頭圖。
  ✅ 裁切 2026-09-03 定案 Ⓒ3b（x 934~7614、y 403~3743），其餘八案已刪，推導在
     drafts/line-hello/README.md 第八節。
  這一輪要選的是：**筆畫收尾的缺口有多大**（三級）與**字體**（三支）。
  ⚠ 形狀已定：圓角 92（圓角矩形 44 ↔ 膠囊 144 的正中間）、玻璃濃度「中」（白 .58／模糊 11）。

  ⚠⚠ 遮罩的位置是量出來的：逐列／逐行掃「有多少 % 的像素 L* ≥ 70」，
    乾淨區是 x 480~960、y 0~340。要避開三個東西：診所右牆的邊（x≈440）、
    劉家招牌的柱子（x≈640，只有 60% 夠亮）、右邊公寓的暗部（x≥980）。
    所以面板放在柱子右邊的 x 688~960、y 40~304。
    ⚠ 面板一定要整塊落在乾淨區裡 —— backdrop-filter 的模糊會把框外的暗色吸進來
      （第一版壓到遮陽棚，下緣糊掉一塊）。出圖有守門擋著。

  ⚠ 字體：實測 M PLUS Rounded 1c 與 Zen Maru Gothic **這四個漢字全都有**
    （連罕用的「哩」也在），而且逐字放大比對過 —— 芳／仁／哩／厚 在日文與繁中的
    結構完全一致，沒有日本字形的問題。所以中文終於拿得到真正的圓體。

  ⚠ 這一頁擺的是真的產出檔（hero-*.jpg），不是用 CSS 再做一次。
  出圖：node drafts/line-hello/generate.mjs
-->
<style>
:root{--paper:#e2e5e6;--card:#f4f4f5;--ink:#2a2c27;--ink-soft:#5c5f57;--rule:#cdd0d2;
  --green:#3f654a;--deep:#2c5238}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding:18px 16px 210px}
h1{font-size:1.12rem;margin:0 0 6px;letter-spacing:.01em}
.lede{color:var(--ink-soft);font-size:.86rem;margin:0 0 16px}
.lede b{color:var(--ink)}
.big{border-radius:12px;overflow:hidden;background:#000;line-height:0;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.big img{width:100%;display:block}
.cap{font-size:.78rem;color:var(--ink-soft);margin:7px 2px 16px}
.chat{background:#e9edf1;border-radius:12px;padding:12px 10px}
.chat .day{text-align:center;font-size:.66rem;color:#7b8794;margin-bottom:9px}
.hc{width:232px;border-radius:14px;overflow:hidden;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.08);margin-left:34px;position:relative}
.hc::before{content:"";position:absolute;left:-34px;top:0;width:26px;height:26px;
  border-radius:50%;background:var(--deep)}
.hc .hero{display:block;width:100%}
.hc .b{padding:11px 12px 9px}
.hc h4{margin:0;font-size:.92rem;font-weight:700}
.hc .loc{font-size:.66rem;color:var(--ink-soft);margin-top:2px}
.hc p{margin:9px 0 0;font-size:.72rem;line-height:1.62}
.hc .menu{background:var(--paper);border-radius:8px;padding:8px 10px;margin-top:9px;
  font-size:.68rem;line-height:1.6}
.hc .f{padding:0 12px 11px}
.hc .tel{background:var(--green);color:#fff;font-weight:700;text-align:center;
  border-radius:8px;padding:8px 0;font-size:.8rem;margin-top:9px}
.hc .share{display:block;text-align:center;color:var(--deep);font-size:.72rem;padding:8px 0 1px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:11px 13px;font-size:.8rem;line-height:1.8;margin-top:14px}
.panel b{font-variant-numeric:tabular-nums}
.panel .k{color:var(--ink-soft)}
.note{border-left:3px solid var(--rule);padding-left:11px;color:var(--ink-soft);
  font-size:.79rem;margin-top:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,244,245,.97);
  border-top:1px solid var(--rule);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  backdrop-filter:blur(8px);z-index:9}
.bar .r{display:flex;align-items:flex-start;gap:8px;margin:3px 0}
.bar .lb{flex:none;width:2.6em;font-size:.72rem;color:var(--ink-soft);padding-top:5px}
.bar .g{display:flex;flex-wrap:wrap;gap:5px}
.bar button{font:inherit;font-size:.75rem;padding:4px 10px;border-radius:7px;
  border:1px solid var(--deep);background:#fff;color:var(--deep);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--deep);color:#fff}
</style>
</head>
<body>
<h1>頭圖：房子在說「芳仁　哩厚」</h1>
<p class="lede">形狀照你說的走：<b>圓角矩形和膠囊之間</b>（圓角 92，兩端點是 44 與 144）、
邊框是<b>一筆畫下來、最後留一個小缺口</b>、玻璃濃度<b>中</b>。底下選<b>缺口大小</b>與<b>字體</b>。</p>

<div class="big"><img id="shot" alt=""></div>
<p class="cap" id="cap"></p>

<div class="chat">
  <div class="day">今天</div>
  <div class="hc">
    <img class="hero" id="mini" alt="">
    <div class="b">
      <h4>芳仁牙醫診所</h4><div class="loc">雲林斗六・永樂街</div>
      <p>這裡是診所的官方 LINE。</p>
      <div class="menu">下面的選單有<br><b>約診查詢、診所資訊、診療項目、<br>醫師介紹、衛教資訊</b></div>
      <p>完成綁定，看診前 48 小時<br>就會在這裡提醒你。</p>
    </div>
    <div class="f">
      <div class="tel">撥打電話　05-5339369</div>
      <span class="share">把芳仁介紹給家人</span>
    </div>
  </div>
</div>
<p class="cap">↑ 整張圖卡在聊天室裡的<b>真實大小</b>（卡片 232px 寬）。⚠ 這是提案頁的近似，不是 LINE 自己的算繪。</p>

<div class="panel" id="panel"></div>
<p class="note" id="note"></p>

<div class="bar">
  <div class="r"><span class="lb">缺口</span><span class="g" id="sw-s"></span></div>
  <div class="r"><span class="lb">字體</span><span class="g" id="sw-f"></span></div>
</div>

<script>
(function () {
  "use strict";
  var R = [{"id":"hero-s-mplus","gap":"s","font":"mplus","gapPx":31,"visiblePx":24,"visibleOnChat":5.3,"inkDrop":2.2,"gapLabel":"小","gapPct":2.8,"fs":104,"onChat":23.2,"stroke":7,"strokeOnChat":1.56,"glassA":0.58,"glassBlur":11,"r":92,"kb":139},{"id":"hero-s-zenmaru","gap":"s","font":"zenmaru","gapPx":31,"visiblePx":24,"visibleOnChat":5.3,"inkDrop":2.2,"gapLabel":"小","gapPct":2.8,"fs":104,"onChat":23.2,"stroke":7,"strokeOnChat":1.56,"glassA":0.58,"glassBlur":11,"r":92,"kb":140},{"id":"hero-s-ntc","gap":"s","font":"ntc","gapPx":31,"visiblePx":24,"visibleOnChat":5.3,"inkDrop":2.2,"gapLabel":"小","gapPct":2.8,"fs":104,"onChat":23.2,"stroke":7,"strokeOnChat":1.56,"glassA":0.58,"glassBlur":11,"r":92,"kb":138},{"id":"hero-m-mplus","gap":"m","font":"mplus","gapPx":53,"visiblePx":46,"visibleOnChat":10.3,"inkDrop":3.9,"gapLabel":"中","gapPct":4.8,"fs":104,"onChat":23.2,"stroke":7,"strokeOnChat":1.56,"glassA":0.58,"glassBlur":11,"r":92,"kb":139},{"id":"hero-m-zenmaru","gap":"m","font":"zenmaru","gapPx":53,"visiblePx":46,"visibleOnChat":10.3,"inkDrop":3.9,"gapLabel":"中","gapPct":4.8,"fs":104,"onChat":23.2,"stroke":7,"strokeOnChat":1.56,"glassA":0.58,"glassBlur":11,"r":92,"kb":140},{"id":"hero-m-ntc","gap":"m","font":"ntc","gapPx":53,"visiblePx":46,"visibleOnChat":10.3,"inkDrop":3.9,"gapLabel":"中","gapPct":4.8,"fs":104,"onChat":23.2,"stroke":7,"strokeOnChat":1.56,"glassA":0.58,"glassBlur":11,"r":92,"kb":138},{"id":"hero-l-mplus","gap":"l","font":"mplus","gapPx":83,"visiblePx":76,"visibleOnChat":16.9,"inkDrop":6.2,"gapLabel":"大","gapPct":7.5,"fs":104,"onChat":23.2,"stroke":7,"strokeOnChat":1.56,"glassA":0.58,"glassBlur":11,"r":92,"kb":139},{"id":"hero-l-zenmaru","gap":"l","font":"zenmaru","gapPx":83,"visiblePx":76,"visibleOnChat":16.9,"inkDrop":6.2,"gapLabel":"大","gapPct":7.5,"fs":104,"onChat":23.2,"stroke":7,"strokeOnChat":1.56,"glassA":0.58,"glassBlur":11,"r":92,"kb":140},{"id":"hero-l-ntc","gap":"l","font":"ntc","gapPx":83,"visiblePx":76,"visibleOnChat":16.9,"inkDrop":6.2,"gapLabel":"大","gapPct":7.5,"fs":104,"onChat":23.2,"stroke":7,"strokeOnChat":1.56,"glassA":0.58,"glassBlur":11,"r":92,"kb":138}];
  var by = {}; R.forEach(function (r) { by[r.gap + "|" + r.font] = r; });
  var S = { s: "小", m: "中", l: "大" };
  var F = { mplus: "M PLUS 圓體", zenmaru: "Zen Maru 圓體", ntc: "Noto Sans TC" };
  var st = { s: "m", f: "mplus" };

  function chips(host, obj, k) {
    host.innerHTML = "";
    Object.keys(obj).forEach(function (v) {
      var b = document.createElement("button");
      b.textContent = obj[v];
      b.setAttribute("aria-pressed", st[k] === v ? "true" : "false");
      var probe = { s: st.s, f: st.f }; probe[k] = v;
      if (!by[probe.s + "|" + probe.f]) { b.disabled = true; b.style.opacity = ".34"; }
      else b.addEventListener("click", function () { st[k] = v; sync(); render(); });
      host.appendChild(b);
    });
  }
  function sync() {
    chips(document.getElementById("sw-s"), S, "s");
    chips(document.getElementById("sw-f"), F, "f");
  }
  function render() {
    var r = by[st.s + "|" + st.f];
    var src = r.id + ".jpg";
    document.getElementById("shot").src = src;
    document.getElementById("mini").src = src;
    document.getElementById("cap").textContent = "1040×520（2:1）・" + r.kb + "KB";
    document.getElementById("panel").innerHTML =
      "<span class='k'>缺口</span> <b>" + r.gapLabel + "</b>"
      + "　弧長 <b>" + r.gapPx + "px</b>、真正看得到 <b>" + r.visiblePx + "px</b>"
      + " <span class='k'>（圓頭的筆尖會在兩端各補回半個線寬）</span>"
      + "<br><span class='k'>在聊天室裡的缺口</span> <b>" + r.visibleOnChat + "px</b>"
      + " <span class='k'>（×0.223 才是病人看到的）</span>"
      + "<br><span class='k'>字</span> <b>" + r.fs + "px</b>"
      + "　<span class='k'>在聊天室裡</span> <b>" + r.onChat + "px</b>"
      + " <span class='k'>（下限 11px）</span>"
      + "　<span class='k'>框線</span> <b>" + r.stroke + "px</b>（聊天室 " + r.strokeOnChat + "px）"
      + "<br><span class='k'>圓角</span> <b>" + r.r + "</b>"
      + " <span class='k'>（圓角矩形 44 ↔ 膠囊 144 的正中間）</span>"
      + "　<span class='k'>玻璃</span> <b>中</b><span class='k'>（白 " + r.glassA + "、模糊 " + r.glassBlur + "）</span>";
    document.getElementById("note").innerHTML =
      "⚠ <b>缺口是「筆畫沒接回去」不是「破了一個洞」</b>：描邊改成一條<b>開放路徑</b>，"
      + "繞一圈回來時停在缺口前面。底仍然是封閉的，所以玻璃不會從缺口漏出去。"
      + "<br>⚠ <b>缺口開在上緣、右上圓角之前</b>（x 749，框心 684、圓角從 764 起）。"
      + "第一版落在<b>上緣正中央</b>，對稱的位置讀起來像印壞了，不像有人把筆提起來；"
      + "而且這一段的底是乾淨的天空，縮到 232px 也讀得出來。"
      + "<br>⚠ <b>不要看「墨少了幾 %」判斷缺口夠不夠大</b>：圓頭的筆尖會在開放路徑的兩端"
      + "各補一個半圓，加起來約等於一整個線寬（7px）。所以名目弧長永遠比看得到的長，"
      + "面板印的 <b>" + r.visiblePx + "px</b> 才是眼睛讀到的那一段。"
      + "<br>⚠ 位置仍然是量出來的：框離外牆 <b>82px</b>，尾巴往左下指著房子、"
      + "而且驗過<b>不會撞到劉家那支紅招牌</b>（x 620~660、y 165~325）。"
      + "<br>⚠ 兩行刻意錯開（芳仁往右、哩厚往左各 22px）—— 字面框其實完全對齊，"
      + "看起來錯位是「仁」右邊留白多、「厚」填滿整格。";
  }
  sync(); render();
  window.addEventListener("load", function () {
    R.forEach(function (r) { new Image().src = r.id + ".jpg"; });
  });
})();
</script>
