<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>圖示對照測試</title>

<!-- ===========================================================================
     圖示對照測試頁（2026-08-12 第八輪）

     這一頁存在的唯一目的：**把「我們多宣告的那些東西」全部拿掉，看圖示會不會變銳利。**

     和首頁比，這一頁刻意**沒有**：
       ・site.webmanifest（連 <link rel="manifest"> 都沒有）
       ・apple-mobile-web-app-capable / mobile-web-app-capable
       ・apple-mobile-web-app-title
       ・任何其他尺寸的圖示宣告

     只留下一行 apple-touch-icon，指向和首頁**完全同一個檔案**。
     所以圖檔是同一張、顏色是同一組，唯一的變數是「宣告的環境」。

     判讀：
       這一頁的圖示**銳利** → 是我們多宣告的東西害的（manifest / web-app 模式），
                              回首頁把對應的東西拆掉即可。
       這一頁的圖示**一樣糊** → 和宣告無關，是 iOS 對這張圖本身的處理，
                              那就沒有站方能做的事了，停手。

     ⚠ 定案之後這一頁要刪掉（CLAUDE.md 第八節的規則）。
     =========================================================================== -->
<link rel="apple-touch-icon" sizes="192x192" href="/assets/icon-192.png?v=test1">

<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 2.5rem 1.4rem; background: #e2e5e6; color: #221e1c;
         font: 16px/1.75 "Noto Sans TC", system-ui, sans-serif; }
  main { max-width: 34em; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 1.2rem; }
  img { width: 96px; height: 96px; display: block; margin: 1.4rem 0;
        border-radius: 21px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  ol { padding-left: 1.3em; }
  li { margin-bottom: .6rem; }
  code { background: #d5d9da; padding: .1em .35em; border-radius: 4px; font-size: .9em; }
  .note { margin-top: 2rem; padding: 1rem 1.1rem; background: #d5d9da; border-radius: 12px;
          font-size: .93rem; }
</style>
</head>
<body>
<main>
  <h1>圖示對照測試</h1>

  <p>這一頁用的是和首頁<strong>完全同一張圖檔</strong>，但把 manifest、網頁 App 那些宣告全部拿掉了，只留一行 <code>apple-touch-icon</code>。</p>

  <img src="/assets/icon-192.png?v=test1" alt="芳仁牙醫圖示">

  <ol>
    <li>用 Safari 的「分享 → 加入主畫面」把這一頁加上去</li>
    <li>和首頁那顆放在一起比較</li>
  </ol>

  <div class="note">
    <p><strong>這一顆比較銳利</strong> → 問題出在我們多宣告的東西，回頭拆掉就好。</p>
    <p style="margin-bottom:0"><strong>兩顆一樣糊</strong> → 和宣告無關，是 iOS 對這張圖本身的處理，站方沒有能做的事。</p>
  </div>
</main>
</body>
</html>
